<style>
:root{
  --z:1;   /* text size: the sheet scales as a whole, proportions untouched */
  /* the lesson comes up in the navy of the quarterly's own cover; grey and the
     rest wait in the colour row of the settings */
  --ink:#1c1c1c; --muted:#666;
  /* ——— the band, in two cuts at once ———
     `paintTint` writes both onto the document: `--tl-*` for a white sheet and
     `--td-*` for a dark one. Which is worn is decided here, in the stylesheet,
     and not by the script — because the one place the script cannot reach is
     the printer. An inline style beats `@media print` at any specificity, so a
     tint chosen for a dark screen would have gone to paper as a navy slab with
     black type in it. Written this way, the dark cut lives inside
     `@media screen` with everything else, and paper simply never sees it. */
  --gray:var(--tl-band,#ccd5e2); --gray-dk:var(--tl-tag,#24426e); --box:var(--tl-box,#e7ecf4);
  /* ——— the same colour, standing rather than lying ———
     `--gray` is the ground of the band, and on a white sheet it doubles as the
     quiet mark: the big lesson numbers beside the page, the ring of the play
     button, the chevron. Both readings work while the tone is light, because a
     light tone is a soft ground and a soft mark at once. Inverted for dark stock
     it is a good ground and an invisible mark — the numbers went out. So the
     quiet mark is named apart and given a tone of its own on the dark sheet:
     the same hue, lifted until it can be seen against the paper it lies on. */
  --quiet:var(--tl-quiet,#ccd5e2);
  --gold:#c6a15b; --gold-d:#b28e44;
  --mine:#2f5bd0;                       /* everything the reader added himself */
  --warn:#e5484d; --warnbg:rgba(229,72,77,.10);   /* what is about to be removed */
  /* ——— one glass, three heights ———
     Everything that floats over the sheet is cut from the same material: one
     tone, one blur, one hairline. Two floating things differ in exactly one
     way — how far off the page they stand — and the shadow is the only place
     allowed to say it. A card is the single second material: a menu hung from
     a button has to be read through, not seen through. */
  --mat:rgba(250,250,252,.76); --hair:rgba(0,0,0,.08);
  --blur:saturate(180%) blur(24px);
  /* A panel one reads through is a panel one reads twice: the quarter behind the
     settings was legible enough to argue with them. The floating tools stay
     light — they cover nothing but margin — and only the two panels that lie
     over text take the denser pour. */
  --matx:rgba(250,250,252,.94);
  /* and the lightest pour for what merely waits in the margin: nothing is read
     under the rail or the strip of days, so they can be almost air. Three
     depths, and the difference between them is what the thing is doing —
     waiting, being held, or lying over the reading. */
  --matl:rgba(250,250,252,.62);
  --lift1:0 8px 22px rgba(0,0,0,.10);    /* lying in the margin */
  --lift2:0 14px 36px rgba(0,0,0,.16);   /* taken into the hand */
  --lift3:0 26px 60px rgba(0,0,0,.26);   /* over the whole page */
  --r-pop:14px; --r-tool:18px; --r-pill:999px;
  --card:#fff; --card-line:#e9e9e9;
  --sans:"PT Sans","Segoe UI",-apple-system,sans-serif;
  --serif:"PT Serif",Georgia,"Times New Roman",serif;
  --paper:none; --paper-tone:#fff;      /* the sheet is plain white until ⚙ says otherwise */
  /* ——— the chrome, in one place ———
     Every button in the bar and in the settings was cut from the same four
     values, written out thirty times over. Named once, they can be re-cut for
     a dark sheet without touching a single rule that uses them.
     `--on` is a control that is on, and it is the one pair that inverts: dark
     on light here, light on dark there — the state is the contrast, not the
     colour. `--onacc` is the lettering that sits on the band's own colour, and
     it follows the band rather than the chrome. */
  --ctl:#fff; --ctl-line:#e6e6e6; --ctl-line2:#d3d3d3; --ctl-t:#777; --ctl-t2:#333;
  --on:#2b2b2b; --on-t:#fff; --onacc:#fff;
  --selc-t:#1c1c1c;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{background:var(--paper-tone);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
/* selecting text feels like running a highlighter over the booklet */
::selection{background:var(--selc,#f7de84);color:var(--selc-t)}
::-moz-selection{background:var(--selc,#f7de84);color:var(--selc-t)}

/* control bar (screen only) — refined, document-like; hidden when printing */
.bar{position:sticky;top:0;z-index:70;background:var(--mat);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);color:#333;border-bottom:1px solid var(--card-line)}
/* the buttons line up with the text column, not with the edge of the sheet:
   same width and the same side margins as the page below */
.bar-in{max-width:820px;margin:0 auto;padding:11px 64px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.ar{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:10px;border:1px solid var(--ctl-line);background:var(--ctl);color:var(--ctl-t);cursor:pointer;font-size:18px;line-height:1;user-select:none;transition:background .15s,color .15s,border-color .15s,transform .1s}
.ar:hover{background:var(--on);color:var(--on-t);border-color:var(--on)}
.ar:active{transform:translateY(1px)}
/* the week label opens the month — it has to look like something you press */
.lbl{cursor:pointer;font-size:12px;font-weight:600;letter-spacing:.3px;color:#8c8c8c;min-width:104px;
  height:34px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;white-space:nowrap;
  border:1px solid var(--ctl-line);border-radius:10px;background:var(--ctl);transition:background .15s,border-color .15s}
.lbl:hover{border-color:var(--ctl-line2);background:var(--ctl-hi,#fafafa)}
.lbl::after{content:"";flex:none;width:4.5px;height:4.5px;margin-top:-2px;
  border-right:1.4px solid #bdbdbd;border-bottom:1.4px solid #bdbdbd;transform:rotate(45deg)}
.lbl:hover::after{border-color:#777}
/* text size — two square buttons cut like the rest of the toolbar */
.zoom{flex:none;width:34px;height:34px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--ctl-line);border-radius:10px;background:var(--ctl);color:var(--ctl-t);cursor:pointer;user-select:none;
  font-size:13px;font-weight:700;letter-spacing:0;transition:background .15s,color .15s,border-color .15s,opacity .15s}
.zoom:hover{border-color:var(--ctl-line2);color:var(--ctl-t2)}
.zoom.off{opacity:.32;cursor:default;border-color:var(--ctl-line)}
.zoom.off:hover{color:var(--ctl-t);border-color:var(--ctl-line)}
.lbl b{color:var(--ctl-t2);font-weight:700}
.lbl:hover b{text-decoration:underline;text-underline-offset:3px}
.seg{display:inline-flex;background:rgba(120,120,128,.10);border:1px solid var(--hair);border-radius:10px;padding:3px}
.seg .o{padding:6px 14px;font-size:12px;font-weight:700;letter-spacing:.8px;color:#8a8a8a;cursor:pointer;border-radius:7px;transition:background .15s,color .15s}
.seg .o:hover{color:var(--ctl-t2)}
.seg .o.active{background:var(--on);color:var(--on-t)}
.tog{padding:7px 15px;font-size:12px;font-weight:700;letter-spacing:.7px;color:var(--ctl-t);background:rgba(120,120,128,.09);border:1px solid var(--hair);border-radius:10px;cursor:pointer;user-select:none;transition:background .15s,color .15s,border-color .15s}
.tog:hover{border-color:var(--ctl-line2);color:var(--ctl-t2)}
.tog.active{background:var(--on);color:var(--on-t);border-color:var(--on)}
.tog[hidden]{display:none}
/* the toolbar carries two things: which lesson, and everything else */
.gear{flex:none;width:34px;height:34px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--ctl-line);border-radius:10px;background:var(--ctl);color:var(--ctl-t);cursor:pointer;user-select:none;
  transition:background .15s,color .15s,border-color .15s}
.gear:hover{border-color:var(--ctl-line2);color:var(--ctl-t2)}
.gear.open{background:var(--on);border-color:var(--on);color:var(--on-t)}
.gear svg{display:block}

/* ——— the settings stand where the list stands ———
   They used to hang off the gear in the corner of the bar, as a card with a
   ground, an edge and a shadow — furniture set down on the lesson, and the one
   thing on the page that read as belonging to another program. They take the
   margin instead, the same margin the list of lessons takes, anchored to the
   sheet and not to the window. The two never appear together (see `setpopSet`),
   so the seat is free whenever it is wanted.
   No ground and no shadow: beside the page there is nothing underneath to be
   read through, and a panel tone laid over paper is exactly what made it a
   card. It takes a ground only where it has to cover the text — the narrow
   rule below, the same one the list obeys. */
.setpop{position:fixed;z-index:63;right:max(10px,calc(50vw - 776px));
  top:calc(var(--barh,67px) + 14px);width:296px;
  max-height:calc(100dvh - var(--barh,67px) - 26px);overflow-y:auto;overscroll-behavior:contain;
  background:none;
  opacity:0;pointer-events:none;transform:translateX(14px);
  transition:opacity .24s,transform .3s cubic-bezier(.3,.9,.3,1)}
body.setopen .setpop{opacity:1;pointer-events:auto;transform:none}
/* ——— it comes in from the margin, the way the list does ———
   It grew out of the gear while it hung from the gear. Standing in the margin
   it arrives the way its neighbour arrives — sliding in from the edge it lives
   at — so the two read as one drawer used by turns rather than as two different
   ideas about where a panel comes from. */
@keyframes popinc{from{opacity:0;transform:translateX(-50%) translateY(-7px) scale(.972)}
                    to{opacity:1;transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){ .calpop{animation:none} .setpop{transition:opacity .16s} }
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 10px;border-radius:9px}
/* `display:flex` beats the browser's own [hidden] rule, so a row put away has
   to be told again — otherwise a setting that cannot work here still shows */
.srow[hidden]{display:none}
.srow + .srow{border-top:1px solid var(--hair)}
/* one quiet line closes the sheet: which version this is, and where the keys
   are written down */
.sfoot{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:9px 10px 4px;margin-top:2px;border-top:1px solid #f1f1f1}
.sfoot span{font-size:10.5px;letter-spacing:.2px;color:#b0b0b4;cursor:pointer;transition:color .15s}
.sfoot span:hover{color:var(--ctl-t2)}
.slab{font-size:12.5px;font-weight:600;color:var(--slab,#6f6f6f);white-space:nowrap}
/* the marking row's label opens the card about where the marks are kept — the
   counter on the rail used to be that door, and the counter is gone */
#lab-mark{cursor:pointer}
#lab-mark:hover{color:var(--ctl-t2)}
.sctl{display:flex;gap:6px;flex:none}
.sbtn{padding:7px 11px;font-size:12px;font-weight:700;color:var(--ctl-t2);background:rgba(120,120,128,.12);border-radius:8px;
  cursor:pointer;user-select:none;white-space:nowrap;transition:background .15s,color .15s}
.sbtn:hover{background:var(--on);color:var(--on-t)}
/* a switch reads at a glance: the tools are either out or away */
.sw2{position:relative;width:42px;height:25px;border-radius:13px;background:rgba(120,120,128,.3);
  cursor:pointer;flex:none;transition:background .2s}
.sw2 i{position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.28);transition:transform .22s cubic-bezier(.3,1.3,.4,1)}
.sw2.on{background:#34c759}
.sw2.on i{transform:translateX(17px)}
/* the list of second translations belongs to the switch above it, so it opens
   under it without a rule of its own — and folds away when the switch is off.
   Where there is no room for a second column there is no switch either: then
   the list stands on its own line and takes its own label, because it is still
   the setting that answers a held verse. */
.srow.prow{padding-top:0;border-top:none}
.srow.prow .slab{display:none}
.srow.prow.solo{padding-top:8px;border-top:1px solid var(--hair)}
.srow.prow.solo .slab{display:block}
.srow.prow.solo .ssel{flex:0 1 auto;width:auto;max-width:60%}
.ssel{flex:1 1 auto;min-width:0;width:100%;font:inherit;font-size:12.5px;font-weight:600;color:var(--ctl-t2);
  padding:7px 9px;border:1px solid var(--hair);border-radius:9px;background:rgba(120,120,128,.09);cursor:pointer;
  -webkit-appearance:none;appearance:none;transition:border-color .15s;
  /* the native arrow differs on every platform; this one matches .lbl above */
  background-image:linear-gradient(45deg,transparent 50%,#bdbdbd 50%),linear-gradient(135deg,#bdbdbd 50%,transparent 50%);
  background-position:calc(100% - 15px) calc(50% - 1.5px),calc(100% - 10px) calc(50% - 1.5px);
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:28px}
.ssel:hover{border-color:var(--ctl-line2)}
/* a select that shares its row with a visible label takes only what it needs,
   so the row reads like the switches above it and not like a form field */
.srow .ssel.short{flex:0 1 auto;width:auto;max-width:58%}
/* the PDF row is the one that does something: its first button says so */
.sbtn.pri{background:var(--on);color:var(--on-t)}
.sbtn.pri:hover{filter:brightness(.82)}
.swatches{display:flex;align-items:center;gap:7px}
.sw{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid #fff;box-shadow:0 0 0 1px #dcdcdc;transition:transform .1s}
.sw:hover{transform:scale(1.1)}
.sw.active{box-shadow:0 0 0 2px #111}
/* the colour wheel says "any colour you like" better than a plus sign */
.sw.custom{background:conic-gradient(from .5turn,#e04b4b,#e0a33c,#d6cf3f,#4fb257,#3f9fd6,#5b57c9,#b950b0,#e04b4b)}
/* ——— the hue strip ———
   The band takes a hue and nothing else. Its lightness is not the reader's to
   move: the dark tag carries white lettering and the box has to stay light
   enough to print, so both are fixed and only the hue travels. The system
   colour dialog offered a whole cube — brightness, saturation, eyedropper —
   and answered to one axis of it, which reads as a page that ignores you.
   This strip offers exactly what it can do, and it is drawn in the band's own
   colours, so the strip is the answer, not a promise about it. */
.huebar{position:relative;flex:1 1 auto;height:26px;border-radius:9px;cursor:pointer;touch-action:none;
  border:1px solid rgba(0,0,0,.10);
  background:linear-gradient(90deg,hsl(0,46%,38%),hsl(40,46%,38%),hsl(80,46%,38%),hsl(120,46%,38%),
    hsl(160,46%,38%),hsl(200,46%,38%),hsl(240,46%,38%),hsl(280,46%,38%),hsl(320,46%,38%),hsl(360,46%,38%))}
.huebar i{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;
  background:#fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.22),0 1px 4px rgba(0,0,0,.28);pointer-events:none}
/* text size — two square buttons cut like the rest */
.zoom{flex:none;width:32px;height:32px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--hair);border-radius:9px;background:rgba(120,120,128,.09);color:var(--ctl-t);cursor:pointer;user-select:none;
  font-size:13px;font-weight:700;transition:background .15s,color .15s,border-color .15s,opacity .15s}
.zoom:hover{border-color:var(--ctl-line2);color:var(--ctl-t2)}
.zoom.off{opacity:.32;cursor:default;border-color:var(--ctl-line)}
.tog{width:32px;height:32px;padding:0;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--hair);border-radius:9px;background:rgba(120,120,128,.09);color:var(--ctl-t);cursor:pointer;user-select:none;
  transition:background .15s,color .15s,border-color .15s}
.tog:hover{border-color:var(--ctl-line2);color:var(--ctl-t2)}
.tog.active{background:var(--on);color:var(--on-t);border-color:var(--on)}
.tog svg{display:block}

/* a month at a glance, with the lesson standing beside its week */
.calpop{position:absolute;top:calc(100% + 7px);left:50%;transform:translateX(-50%);background:var(--matx);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border-radius:var(--r-tool);box-shadow:0 0 0 .5px var(--hair),var(--lift2);padding:12px;
  transform-origin:50% 0;animation:popinc .19s cubic-bezier(.2,1.05,.35,1);z-index:72;
  width:min(430px,calc(100vw - 24px));max-height:min(70vh,560px);overflow:auto}
.calpop[hidden]{display:none}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calhead b{font-size:13.5px;font-weight:700;color:#2b2b2b;letter-spacing:.3px;text-transform:capitalize}
.calnav{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:8px;
  border:1px solid var(--hair);color:#777;cursor:pointer;font-size:15px;user-select:none}
.calnav:hover{background:#2b2b2b;color:#fff;border-color:#2b2b2b}
.calrow{display:flex;align-items:center;gap:8px;padding:2px 0}
.calrow.head .d{color:#b0b0b0;font-size:9.5px;letter-spacing:.6px;text-transform:uppercase;cursor:default}
/* the week inside the calendar. It must NOT be called `days`: that name belongs
   to the fixed strip of the lesson's own days, and a row carrying it inherited
   `position:fixed`, the pill and the shadow — the week floated out of the
   calendar and lay over the list of lessons. */
.calrow .dcells{display:flex;gap:2px;flex:none}
.calrow .d{width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:7px;
  font-size:11.5px;color:#3a3a3a;cursor:pointer}
.calrow .d.out{color:#c9c9c9}
.calrow .d.today{font-weight:700;box-shadow:inset 0 0 0 1px var(--gray-dk)}
.calrow .les{flex:1;min-width:0;font-size:11.5px;line-height:1.25;color:#8a8a8a;cursor:pointer;
  padding:4px 7px;border-radius:8px;overflow:hidden}
.calrow .les b{display:block;color:#2b2b2b;font-weight:700;font-size:11px;letter-spacing:.3px}
.calrow .les span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.calrow.pick:hover .d:not(.head),.calrow.pick:hover .les{background:#f4f4f4}
.calrow.on .les{background:var(--box)}
.calrow.on .les b{color:var(--gray-dk)}
.calfoot{margin-top:9px;padding-top:9px;border-top:1px solid #eee;display:flex;justify-content:center}
.calfoot .it{font-size:12px;font-weight:700;color:#2b2b2b;cursor:pointer;padding:7px 14px;border-radius:8px}
.calfoot .it:hover{background:#f4f4f4}

/* the page (booklet)
   --z scales the whole sheet at once — type, bands, tags, rules, margins — so
   every proportion of the printed layout is kept. The sheet keeps its full
   820px of measure and simply grows with the text; it only gives width back
   when the window itself has none left, so the column never narrows on a
   screen that had room for it. */
.page{position:relative;overflow:hidden;max-width:min(calc(820px / var(--z)),100%);
  margin:6px auto 44px;background-color:var(--paper-tone);zoom:var(--z);
  padding:calc(56px / var(--z)) calc(64px / var(--z)) calc(72px / var(--z))}
/* ——— the sheet as paper ———
   Real paper, scanned and tiled — three sheets from the Transparent Textures
   library (Subtle Patterns), not noise drawn by a filter. The drawn kind gave
   itself away as a screen effect the moment it stood next to type; a scan of a
   real sheet does not, because it carries what a filter cannot invent — the
   weave, the specks, the places where the pulp lay thicker.
   Each tile repeats seamlessly both ways and is carried inside this file as
   WebP, so nothing is fetched while reading and the page still works offline
   with no files beside it. Re-hosted here on purpose: the library asks that its
   patterns not be hot-linked from production pages.
     · grain — the quietest: a fine speckle, barely a shade
     · dust  — a soft mottle, the paper of a cheap booklet
   A third, a woven linen, was tried and dropped: it read as cloth, not paper.
   The paper belongs to the sheet, not to the window: it sits on `.page` and on
   what is printed on it, so it travels with the lesson as it is scrolled — the
   page moves under the eye the way a leaf of a booklet does. `zoom` on .page
   takes the background with it, so the tooth keeps its size against the type at
   every text size.
   The day tag is the one dark thing on the sheet, and there the tile is blended
   with `soft-light` instead of laid on top: a pale grain at full strength turns
   any dark colour towards grey, and the tag has to stay navy in the navy theme,
   green in the green one and brown in the paper one. Soft-light keeps the hue
   and leaves only the texture — the same sheet under heavier ink.
   Print never sees any of it (see @media print) — paper needs no picture of
   paper printed on it. */
/* On paper the glass takes the tone of the paper. A cool white panel over a
   warm sheet reads as something brought from another program and left lying
   there; the same panel, tinted by what it lies on, belongs to the page. */
html.paper{ --paper-tone:#fdfcf8; --mat:rgba(253,252,248,.80); --matx:rgba(253,252,248,.95);
