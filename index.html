<script>
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }

/* ——— the editions the booklet is actually published in ———
   The order is the publisher's own, so a reader who knows the list on
   sdarm.org finds his language where he expects it. Four more are printed —
   Amharic, Chichewa, Ewe, Tshiluba — but the old site alone serves them and
   there is nothing here to fetch them with; they are left out rather than
   offered and found empty. */
const LANGS=["bg","zh","cs","en","fr","de","hu","id","ja","rw","mk","pt","ru","sr","es","th","uk","zu"];
/* each in its own words: a reader looking for his language is not looking for
   the English name of it */
const LANGNAME={bg:"Български",zh:"中文",cs:"Čeština",en:"English",fr:"Français",
  de:"Deutsch",hu:"Magyar",id:"Bahasa Indonesia",ja:"日本語",rw:"Kinyarwanda",
  mk:"Македонски",pt:"Português",ru:"Русский",sr:"Српски",es:"Español",
  th:"ไทย",uk:"Українська",zu:"isiZulu"};
const LOCALE={bg:"bg-BG",zh:"zh-CN",cs:"cs-CZ",en:"en-US",fr:"fr-FR",de:"de-DE",
  hu:"hu-HU",id:"id-ID",ja:"ja-JP",rw:"rw-RW",mk:"mk-MK",pt:"pt-BR",ru:"ru-RU",
  sr:"sr-RS",es:"es-ES",th:"th-TH",uk:"uk-UA",zu:"zu-ZA"};
/* ——— the one label that is printed on the sheet ———
   The lesson already carries it — "LEITTEXT:", "MEMORY VERSE:" — and `cleanMem`
   cuts it off so it can be set in the booklet's own type rather than in the
   publisher's capitals. Where this table has no entry the cut-off words are put
   back instead of an English stand-in: on the sheet itself the reader must see
   the publisher's wording in his own language, never a guess of ours. */
const MEMLABEL={de:"Merktext",en:"Memory verse",ru:"Памятный стих",
  bg:"Паметен стих",cs:"Pamětní verš",es:"Versículo para memorizar",
  fr:"Verset à mémoriser",hu:"Emlékvers",id:"Ayat hafalan",ja:"暗唱聖句",
  mk:"Златен стих",pt:"Versículo para decorar",sr:"Златни стих",
  th:"ข้อท่องจำ",uk:"Пам'ятний вірш",zh:"记忆经文"};
let lang=localStorage.getItem("sbl.lang")||localStorage.getItem("sbl.left")||"en";
if(LANGS.indexOf(lang)===-1) lang="en";
let current=new Date();
/* ——— a link to exactly this place ———
   `#de/20260826/b` — the language, the day, and the letter of the question if
   the finger was that precise. It is read before the first paint, so a lesson
   opened from someone else's message opens where he was pointing and not at
   today. Nothing of the reader travels in it: his marks stay on his device, and
   the link carries only where to look. */
const LINK_RE=/^#?([a-z]{2})\/(\d{8})(?:\/([a-z]))?$/;
let linkWant=null;
function linkRead(){
  let h=""; try{ h=decodeURIComponent(location.hash||""); }catch(e){ h=location.hash||""; }
  const m=LINK_RE.exec(h);
  if(!m||LANGS.indexOf(m[1])<0) return null;
  const at=ymdToDate(m[2]);
  return isNaN(at.getTime())?null:{lang:m[1],date:m[2],at:at,q:m[3]||""};
}
(function(){ const w=linkRead(); if(w){ lang=w.lang; current=w.at; linkWant=w; } })();
const quarters={};
/* ——— which Bible the lesson quotes ———
   This is only where a language starts: the edition the booklet itself is set
   against. It is not a limit. Most of the eighteen editions of the lesson have
   no Bible of their own on this server, and hiding the verses from those
   readers would have been the wrong answer to the wrong question — a reader
   studying the Ukrainian lesson can perfectly well read the passages in Russian
   or in English, and now says so himself in the settings. `bibleOwn` is his
   answer; empty means "whatever the lesson is set in", which is what everyone
   had before and what everyone keeps until they say otherwise. */
const BIBLE={de:"de-lut",en:"en-kjv",ru:"ru-rst",es:"es-rvr1960",pt:"pt-acf",
  cs:"cs-bkr",fr:"fr-ls1910"};
let bibleOwn=localStorage.getItem("sbl.bible")||"";
/* the edition a sheet in this language should quote: the reader's own choice
   first, then the language's own Bible, and King James for a language that has
   neither — never nothing, because nothing is an empty verse box */
function bibleOf(l){ return bibleOwn||BIBLE[l]||"en-kjv"; }
const bibles={};
let versesOn=localStorage.getItem("sbl.verses")==="1";
let versesLines=localStorage.getItem("sbl.verselines")==="1";   /* one verse per line */
/* Parallel reading: a second translation beside the one the lesson is in.
   Kept apart from `versesOn` on purpose — the reader turns it on once and it
   stays on through language changes and reloads, like every other setting. */
let paraOn=localStorage.getItem("sbl.para")==="1";
let paraVer=localStorage.getItem("sbl.paraver")||"";
/* every edition app.sdarm.org serves, in the order the picker lists them:
   [language tag, file id, the name it is known by] */
const PARA=[
  ["DE","de-lut","Luther Bibel"],
  ["EN","en-kjv","King James Version"],
  ["EN","en-nkjv","New King James Version"],
  ["EN","en-esv","English Standard Version"],
  ["EN","en-niv","New International Version"],
  ["EN","en-nasb","New American Standard Bible"],
  ["EN","en-nlt","New Living Translation"],
  ["EN","en-amp","Amplified Bible"],
  ["EN","en-web","World English Bible"],
  ["EN","en-net","New English Translation"],
  ["EN","en-ylt","Young's Literal Translation"],
  ["RU","ru-rst","Синодальный перевод"],
  ["ES","es-rvr1960","Reina Valera 1960"],
  ["ES","es-nvi","Nueva Versión Internacional"],
  ["PT","pt-acf","Almeida Corrigida e Fiel"],
  ["PT","pt-nvi","Nova Versão Internacional"],
  ["FR","fr-ls1910","Louis Segond 1910"],
  ["RO","ro-vdc","Dumitru Cornilescu"],
  ["CS","cs-bkr","Bible Kralická"]
];
/* A second column needs the room for a second column, and room is width —
   nothing else.
   An earlier version asked for landscape instead, and that made the setting
   impossible to find: on one tablet it was there, on the next it was not, for
   reasons the reader could not see. Width alone can be explained in one
   sentence, and the numbers are chosen against real tablets rather than picked
   round:

     iPad 10.2"  upright  810 · lying 1080
     iPad Air    upright  820 · lying 1180
     iPad Pro 13 upright 1024 · lying 1366

   1040 puts every tablet lying down above the line and every one standing up
   below it — including the big Pro, whose 1024 upright was the width that used
   to let two columns in and then squeeze them.

   Under the line nothing is lost — the second translation is still one gesture
   away, under a held verse. */
const PARA_MQ=matchMedia("(min-width:1040px)");
function paraFits(){ return PARA_MQ.matches; }
/* the second column has to be a second translation: whatever the lesson is
   already set in cannot stand beside itself */
/* One function, one answer: this says what is actually set beside the verses on
   screen. */
function paraPick(){ return paraOn&&paraFits()&&paraVer&&paraVer!==bibleOf(lang)?paraVer:""; }

/* band colour themes — first colour matches the quarterly cover (navy + light) */
/* Each theme is cut twice: `dk/lt/bx` for a white sheet and `d` for a dark one.
   The two are not one computed from the other — a hue alone cannot carry grey,
   which has no hue at all, and a formula that turned the neutral swatch faintly
   red on dark stock is a formula that was wrong about what the colour is. So
   both cuts are written out, and the reader's choice survives the change of
   sheet exactly as he left it: the same swatch, the same character, re-cut for
   the ground it now has to be read against. */
const THEMES=[
  {dk:"#606162",lt:"#d1d3d4",bx:"#e6e6e6",   /* grey (default) */
   d:{dk:"#9b9c9f",lt:"#292a2d",bx:"#212225",q:"#4e5054"}},
  {dk:"#24426e",lt:"#ccd5e2",bx:"#e7ecf4",   /* navy — cover */
   d:{dk:"#8fadd8",lt:"#242f40",bx:"#1c2532",q:"#44506a"}},
  /* paper — the bands in the tone of the sheet instead of a colour, so the
     booklet reads as one printing: kraft band, brown ink, no second hue on the
     page at all. Wine stood here before and any colour is a tap away in the
     custom swatch, so nothing is lost by giving the seat to this one. */
  {dk:"#6b5f4b",lt:"#ddd5c3",bx:"#ece6d8",   /* paper */
   d:{dk:"#c9b894",lt:"#302b22",bx:"#26221b",q:"#5d5340"}},
  {dk:"#2f5140",lt:"#cfdfd6",bx:"#e7f0ea",   /* forest */
   d:{dk:"#8fc5a8",lt:"#22302a",bx:"#1b2621",q:"#405c4c"}},
  {dk:"#8f7328",lt:"#e6dabb",bx:"#f2ecd8",   /* gold */
   d:{dk:"#dcbc6a",lt:"#332b16",bx:"#282212",q:"#645230"}}
];
/* Both cuts go onto the document together and neither is chosen here: the
   stylesheet takes `--tl-*` on a white sheet and `--td-*` on a dark one, so
   what gets printed is a matter of the cascade rather than of an event firing
   at the right moment. */
function setTint(t,d){
  const R=document.documentElement.style; d=d||t;
  R.setProperty("--tl-tag",t.dk); R.setProperty("--tl-band",t.lt); R.setProperty("--tl-box",t.bx);
  R.setProperty("--td-tag",d.dk); R.setProperty("--td-band",d.lt); R.setProperty("--td-box",d.bx);
  /* on a white sheet the quiet mark is the band's own tone; on a dark one it is
     the tone written for it, and a cut that carries none falls back to the band */
  R.setProperty("--tl-quiet",t.lt); R.setProperty("--td-quiet",d.q||d.lt);
}
function hexHsl(h){h=h.replace("#","");const r=parseInt(h.slice(0,2),16)/255,g=parseInt(h.slice(2,4),16)/255,b=parseInt(h.slice(4,6),16)/255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let hh,s,l=(mx+mn)/2;if(mx===mn){hh=s=0;}else{const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);hh=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;hh/=6;}return[Math.round(hh*360),Math.round(s*100)];}
/* one hue in, three tones out. The lightnesses are the printed booklet's own:
   38% carries white lettering on the day tag, 84% and 90% stay light enough to
   read black type through. Only the hue is the reader's — see .huebar. */
function hueTint(h){return{dk:"hsl("+h+",46%,38%)",lt:"hsl("+h+",30%,84%)",bx:"hsl("+h+",21%,90%)"};}
/* the same hue on dark stock. The roles swap rather than the colour changing:
   the band goes under the type instead of over it, and the day tag becomes the
   light thing on the sheet — so it takes dark lettering (`--onacc`). 68% is
   where a tag still carries a black letter at every hue on the strip. */
function hueTintDark(h){return{dk:"hsl("+h+",42%,68%)",lt:"hsl("+h+",22%,18%)",bx:"hsl("+h+",20%,14%)",
                                q:"hsl("+h+",20%,34%)"};}
let hueOwn=210;        /* where the strip's dot sits until the reader moves it */
let hueActive=false;   /* is the page wearing a hue of its own, or a theme */
let tintIdx=1;         /* which swatch, when no hue of its own is worn — the cover */

/* ——— light sheet or dark ———
   Three states and not two: a reader who has said nothing is following his
   system, and a reader who has said something is not to be argued with when the
   system changes its mind at sunset. "" is the first, "light" and "dark" the
   second. */
const DARK_MQ=matchMedia("(prefers-color-scheme:dark)");
let themePref="";
try{ const t=localStorage.getItem("sbl.theme"); if(t==="light"||t==="dark") themePref=t; }catch(e){}
function isDark(){ return themePref==="dark"||(themePref!=="light"&&DARK_MQ.matches); }
/* the browser's own chrome takes the tone of the sheet, so the window has one
   edge and not two */
function paintThemeMeta(){
  const m=document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute("content",isDark()?"#16171b":"#24426e");
}
function paintTheme(){
  document.documentElement.classList.toggle("dark",isDark());
  paintThemeMeta();
  paintPop();          /* the bands are re-cut by the cascade; the row of
                          swatches is a picture of them and has to be redrawn */
}
function setTheme(t){
  themePref=(t==="light"||t==="dark")?t:"";
  try{ localStorage.setItem("sbl.theme",themePref); }catch(e){}
  paintTheme();
}
/* following the system means following it while the page is open as well */
(function(){ const f=function(){ if(!themePref) paintTheme(); };
  if(DARK_MQ.addEventListener) DARK_MQ.addEventListener("change",f); else DARK_MQ.addListener(f); })();

/* ——— one place decides what the bands are wearing ———
   Asked again on every change of stock. The colour is the reader's choice and
   not the light's: changing the sheet keeps the swatch and the hue exactly as
   he left them, and re-cuts only their lightnesses for the ground underneath. */
function paintTint(){
  if(hueActive) setTint(hueTint(hueOwn),hueTintDark(hueOwn));
  else{ const t=THEMES[tintIdx]||THEMES[1]; setTint(t,t.d); }
}
(function(){try{const s=JSON.parse(localStorage.getItem("sbl.tint")||"null");if(!s)return;
  /* {c:"#rrggbb"} is how a custom colour was kept before the strip: the hue of
     it is all that ever reached the page, so that is what is read back */
  if(s.h!=null){hueOwn=s.h;hueActive=true;}
  else if(s.c){hueOwn=hexHsl(s.c)[0];hueActive=true;}
  else if(s.i!=null&&THEMES[s.i])tintIdx=s.i;}catch(e){}})();
paintTint();
paintThemeMeta();

/* the paper grain — classes on <html>, set before the first sheet is drawn so
   the reader never sees the white flash of a setting arriving late */
const PAPERS=["grain","dust"];
let paperKind="";
try{ const p=localStorage.getItem("sbl.paper"); if(PAPERS.indexOf(p)>=0) paperKind=p; }catch(e){}
function paintPaper(){
  const R=document.documentElement.classList;
  R.toggle("paper",!!paperKind);
  PAPERS.forEach(function(k){ R.toggle("paper-"+k,paperKind===k); });
}
function setPaper(k){
  paperKind=PAPERS.indexOf(k)>=0?k:"";
  paintPaper();
  try{ localStorage.setItem("sbl.paper",paperKind); }catch(e){}
}
/* ——— the edition the verses are taken from ———

async function loadQuarter(l,y,q){

     one that stays put: the publisher rewrites old quarters years after they
     end (de-2021-1 was touched in November 2024), and text that moves under a
     mark takes the mark with it. The publisher is asked only for what we have
     not got — a quarter that has just appeared, or one nobody froze. */

/* what the browser will call the saved file — set as the page is built */
let docName="SBL Edition";
function fileSafe(s){ return String(s||"").replace(/[\\/:*?"<>|]+/g," ").replace(/\s+/g," ").trim(); }

/* An A4 page holds about 1010 px of text. Keeping the opening of a day
   together is worth a page break; keeping half a page of commentary together
   is not — past that the last piece is let out of the block again. */
const KEEPMAX=420;
function relaxDayStarts(){
  document.querySelectorAll(".daystart").forEach(function(d){
    while(d.children.length>2 && d.offsetHeight>KEEPMAX)
      d.parentNode.insertBefore(d.lastElementChild,d.nextSibling);
  });
}

async function render(){
  const my=++token;
  mkKeepY=window.scrollY;              /* where the reader was, in case the lesson stays */
  /* the whole sheet is set justified with hyphens:auto, and the browser picks
     its hyphenation dictionary by the language of the document: without this
     line German breaks by English rules and Russian never breaks at all, which
     tears rivers of white through every justified paragraph in the PDF */
  document.documentElement.lang=lang;
  buildSeg();
  const sheets=document.getElementById("sheets"), wk=document.getElementById("wk");
  sheets.innerHTML=sheet('<div class="msg">&hellip;</div>');
  const tasks=[]; vid=0;

  /* `sideHtml` builds the whole sheet in the language it is handed. It kept that
     shape when the second language went: a function that takes its language as
     an argument is what lets the PDF be printed in one while the page is read in
     another, and that is still done below. */
  async function sideHtml(lg){
    if(scope==="quarter"){
      const data=await loadQuarter(lg,current.getFullYear(),qOf(current));
      const lessons=(data&&data.lessons)||[];
      if(!lessons.length) return {html:sheet('<div class="msg">No lessons for this quarter.</div>'),title:"",name:""};
      return {html:lessons.map(function(les){ return sheet(renderLesson(les,tasks,lg),les.date,lg); }).join(""),
        title:strip(data.title||""),
        name:fileSafe("SBL "+current.getFullYear()+"-Q"+qOf(current)+" "+strip(data.title||""))};
    }
    const les=await findLesson(current,lg);
    if(!les) return {html:sheet('<div class="msg">No lesson for this week.</div>'),title:"",name:""};
    return {html:sheet(renderLesson(les,tasks,lg),les.date,lg),
      title:strip(les.header||""),
      name:fileSafe("SBL "+String(les.date).replace(/^(\d{4})(\d{2})(\d{2})$/,"$1-$2-$3")
        +" "+strip(les.header||"")+" "+strip(les.title||""))};
  }

  const side=await sideHtml(lang);
  if(my!==token) return;
  rlang=lang;                          /* the page is itself again outside a sheet */
  if(!side.title&&!side.name){
    sheets.innerHTML=side.html;
    wk.innerHTML=""; mkDaysBuild(); mkLastLes=null; window.scrollTo(0,0); return; }
  /* the lesson number alone — the date is on the sheet and in the calendar */
  wk.innerHTML='<b>'+esc(side.title)+'</b>';
  docName=side.name;
  sheets.innerHTML=side.html;

  relaxDayStarts();
  mkRestore();
  mkDaysBuild(); mkOpenToday();
  outQ=null; if(outOn) outBuild();
  audSync();
  mkPrefetch();

  if(versesOn && tasks.length){
    /* Every edition the page needs at once — the second must not make the first
       one wait, and the service worker keeps each of them for next time. Each
       task says which edition is its own. */
    const par=paraPick();
    const pl=par?String(par).split("-")[0]:"";
    const want=[];
    for(const t of tasks) if(t[4]&&want.indexOf(t[4])<0) want.push(t[4]);
    if(par&&want.indexOf(par)<0) want.push(par);
    const got=await Promise.all(want.map(loadBible).concat([
      /* the names of the books in the second edition's language, if the page
         has a lesson in it at all — fetched beside the editions, never after */
      pl&&pl!==lang&&LANGS.indexOf(pl)>=0
        ? paraRefMap(pl,current.getFullYear(),qOf(current)) : null ]));
    if(my!==token) return;
    const bibs={}; want.forEach(function(v,i){ bibs[v]=got[i]; });
    const refs2=got[want.length];
    for(const t of tasks){ const el=document.getElementById(t[0]); if(!el) continue;
      const bib=bibs[t[4]];
      if(t[2]){
        const el2=document.getElementById(t[2]), bib2=bibs[par];
        const p=versePair(bib&&bib.books,bib2&&bib2.books,t[1],versesLines);
        el.innerHTML=p[0]||'<span class="vmiss">—</span>';
        if(el2) el2.innerHTML=p[1]||'<span class="vmiss">—</span>';
        const hd=t[3]&&document.getElementById(t[3]), r2=refs2&&refs2[t[1]];
        if(hd&&r2) hd.textContent=verShort(par)+" · "+r2;
        continue;
      }
      const vh=verseHtml(bib&&bib.books,t[1],versesLines); el.innerHTML=vh||'<span class="vmiss">—</span>'; }
    relaxDayStarts();   /* the passage has arrived — the block may have outgrown its keep */
    mkRestore();        /* … and the marks that live inside the passage can go back on */
  }
  linkStamp(); linkLand();
}
/* ——— eighteen languages are a list, not a row of buttons ———
   Three fitted across a panel and could be shown all at once, which was the
   right shape for three. Eighteen cannot be, and a row that scrolls sideways is
   a row nobody reads to the end of. Each stands in its own words — a reader
   looking for his language is not looking for the English name of it, still
   less for two letters of it. */
function buildSeg(){
  const el=document.getElementById("langseg");
  el.innerHTML=LANGS.map(x=>'<option value="'+x+'"'+(x===lang?' selected':'')+'>'
    +esc(LANGNAME[x]||x.toUpperCase())+'</option>').join("");
  el.onchange=function(){ if(this.value===lang) return;
    lang=this.value; localStorage.setItem("sbl.lang",lang); render(); };
  paintUI();
}
/* ‹ › step by week, or by quarter when the whole quarter is on screen */
function step(dir){
  if(scope==="quarter"){ const d=new Date(current.getTime()); d.setMonth(d.getMonth()+dir*3,15); return d; }
  return addDays(current,dir*7);
}
/* text size — the whole sheet grows, so every proportion of the booklet holds.
   Three steps, 130% being as far as a phone line can usefully stretch. */
const ZOOMS=[1,1.15,1.3];
let zi=+(localStorage.getItem("sbl.zoom")||0);
if(!(zi===1||zi===2)) zi=0;
const zout=document.getElementById("zoomout"), zin=document.getElementById("zoomin");
function paintZoom(){
  if(zi>maxStep()) zi=maxStep();
  document.documentElement.style.setProperty("--z",ZOOMS[zi]);
  zout.classList.toggle("off",zi===0);
  zin.classList.toggle("off",zi>=maxStep());
  const pct=Math.round(ZOOMS[zi]*100)+"%";
  zout.title="Smaller text — now "+pct;
  zin.title="Larger text — now "+pct;
}
/* a 320px screen has no room for the booklet's tag and date side by side at
   the largest step, so the top step is only offered where it fits */
function maxStep(){ return window.innerWidth<400?1:ZOOMS.length-1; }
/* ——— growing the type must not lose the line ———
   The sheet scales as a whole, so every line above the reader grows too and the
   place he was at slides out from under him — the further into the lesson, the
   further it goes. The pixel he was on is worthless; the line he was reading is
   not. So the block at the top of the screen is noted down together with where
   on the screen it stood, and afterwards the page is moved until it stands
   there again. */
function zoomAnchor(){
  const line=mkBarH();
  const blocks=document.querySelectorAll("#sheets [data-k]");
  for(const b of blocks){
    const r=b.getBoundingClientRect();
    if(r.bottom>line) return {el:b,at:r.top};
  }
  return null;
}
function zoomRestore(a){
  if(!a||!a.el.isConnected) return;
  const d=a.el.getBoundingClientRect().top-a.at;
  if(Math.abs(d)<1) return;
  window.scrollBy(0,d);
}
function setZoom(d){
  const n=Math.min(maxStep(),Math.max(0,zi+d));
  if(n===zi) return;
  const a=zoomAnchor();
  zi=n; localStorage.setItem("sbl.zoom",String(zi)); paintZoom();
  /* At once, so that a second press lands on a page already put right — two
     quick presses used to take their bearings from a page still moving. Then
     again on the next frames, for the reflow further down the sheet. */
  zoomRestore(a);
  requestAnimationFrame(function(){ zoomRestore(a); requestAnimationFrame(function(){ zoomRestore(a); }); });
}
paintZoom();
zout.onclick=function(){setZoom(-1);};
zin.onclick=function(){setZoom(1);};

/* week stepping lives in the calendar now; the keyboard still walks the weeks */
document.addEventListener("keydown",function(e){
  /* while the reader is writing, the arrows walk the words — not the weeks */
  const t=e.target, a=document.activeElement, F=/^(INPUT|TEXTAREA|SELECT)$/;
  if(t&&(t.isContentEditable||F.test(t.tagName))) return;
  if(a&&(a.isContentEditable||F.test(a.tagName))) return;
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==="ArrowLeft"){ current=step(-1); render(); }
  if(e.key==="ArrowRight"){ current=step(1); render(); }
});
/* the month, with every week carrying the lesson that ends on its Sabbath */
const calpop=document.getElementById("calpop");
let calMonth=null;
async function buildCal(){
  const y=calMonth.getFullYear(), m=calMonth.getMonth();
  const byDate={};
  for(const [yy,qq] of neigh(y,Math.floor(m/3)+1)){
    const d=await loadQuarter(lang,yy,qq);
    if(d&&d.lessons) for(const l of d.lessons) byDate[l.date]=l;
  }
  const first=new Date(y,m,1);
  const cur=new Date(first.getTime()); cur.setDate(1-first.getDay());     /* back to Sunday */
  const today=new Date(), tKey=ymd(today), cKey=ymd(current);
  const dayNames=[];
  for(let i=0;i<7;i++){ const d=new Date(2026,1,1+i);
    dayNames.push(esc(new Intl.DateTimeFormat(LOCALE[lang],{weekday:"short"}).format(d)).slice(0,2)); }

  let h='<div class="calhead"><span class="calnav" data-m="-1">&lsaquo;</span><b>'
      + esc(new Intl.DateTimeFormat(LOCALE[lang],{month:"long",year:"numeric"}).format(first))
      + '</b><span class="calnav" data-m="1">&rsaquo;</span></div>'
      + '<div class="calrow head"><div class="dcells">'+dayNames.map(n=>'<div class="d">'+n+'</div>').join("")+'</div><div class="les"></div></div>';

  for(let w=0;w<6;w++){
    const sat=new Date(cur.getTime()); sat.setDate(cur.getDate()+6);
    if(w>0&&cur.getMonth()!==m&&sat.getMonth()!==m) break;
    const les=byDate[ymd(sat)];
    let days="",inWeek=false;
    for(let i=0;i<7;i++){
      const d=new Date(cur.getTime()); d.setDate(cur.getDate()+i);
      const k=ymd(d);
      if(k===cKey) inWeek=true;
      days+='<div class="d'+(d.getMonth()!==m?" out":"")+(k===tKey?" today":"")+'" data-d="'+k+'">'+d.getDate()+'</div>';
    }
    h+='<div class="calrow'+(les?" pick":"")+(inWeek&&les?" on":"")+'"'+(les?' data-d="'+les.date+'"':'')+'>'
      +'<div class="dcells">'+days+'</div><div class="les">'
      +(les?'<b>'+esc(strip(les.header||""))+'</b><span>'+esc(strip(les.title||""))+'</span>':'')
      +'</div></div>';
    cur.setDate(cur.getDate()+7);
  }
  h+='<div class="calfoot"><div class="it" data-today="1">'+esc(WORDtoday())+'</div></div>';
  calpop.innerHTML=h;

  calpop.querySelectorAll(".calnav").forEach(function(n){ n.onclick=function(e){
    e.stopPropagation(); calMonth.setMonth(calMonth.getMonth()+ +n.dataset.m,1); buildCal(); }; });
  calpop.querySelectorAll("[data-d]").forEach(function(el){ el.onclick=function(e){
    e.stopPropagation(); calpop.hidden=true;
    current=ymdToDate(el.dataset.d); render(); }; });
  calpop.querySelector("[data-today]").onclick=function(){ calpop.hidden=true; current=new Date(); render(); };
}
function WORDtoday(){ return {de:"Diese Woche",en:"This week",ru:"Эта неделя"}[lang]; }
document.getElementById("wk").onclick=function(e){
  e.stopPropagation(); setpopSet(false);
  if(calpop.hidden){ calMonth=new Date(current.getFullYear(),current.getMonth(),1); buildCal(); calpop.hidden=false; }
  else calpop.hidden=true;
};

const tog=document.getElementById("tog"), vlines=document.getElementById("vlines");
/* the icon shows the layout you are in: solid block of text, or a numbered list */
const ICON_FLOW='<svg width="15" height="12" viewBox="0 0 15 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M1 1.6h13M1 6h13M1 10.4h8.5"/></svg>';
const ICON_LIST='<svg width="15" height="12" viewBox="0 0 15 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="1.5" cy="1.6" r=".9" fill="currentColor" stroke="none"/><path d="M5 1.6h9"/><circle cx="1.5" cy="6" r=".9" fill="currentColor" stroke="none"/><path d="M5 6h9"/><circle cx="1.5" cy="10.4" r=".9" fill="currentColor" stroke="none"/><path d="M5 10.4h6"/></svg>';
/* Running text and one verse per line are two answers to one question, so the
   two buttons are exclusive: exactly one of them is lit while the Bible text is
   shown, and pressing the lit one puts the text away altogether. The parallel
   button asks a different question and stands apart — it may be lit with either
   of them, and both shapes work in two columns. */
/* The icons are put in once and never touched again. Rewritten on every repaint
   they destroyed the very node that had just been clicked, and the handler that
   closes the settings when you press outside them saw a target no longer in the
   page and closed the sheet under the hand — one press of a layout button and
   the settings were gone. */
tog.innerHTML=ICON_FLOW; vlines.innerHTML=ICON_LIST;
function paintVerseBtns(){
  tog.classList.toggle("active",versesOn&&!versesLines);
  vlines.classList.toggle("active",versesOn&&versesLines);
  tog.title=T("flow"); vlines.title=T("perline");
}
/* One press picks a layout and shows the text in it; pressing the layout that
   is already lit puts the text away. The columns are not touched either way —
   they take both shapes. */
function mkVerseLayout(lines){
  if(versesOn&&versesLines===lines) versesOn=false;      /* the lit one put out */
  else{ versesOn=true; versesLines=lines; }
  localStorage.setItem("sbl.verses",versesOn?"1":"0");
  localStorage.setItem("sbl.verselines",versesLines?"1":"0");
  paintVerseBtns(); paintPara(); render();
}
tog.onclick=function(){ mkVerseLayout(false); };
vlines.onclick=function(){ mkVerseLayout(true); };
/* Parallel reading — the switch and the list of second translations. The list
   never offers the edition the lesson is already set in, and it is rebuilt on
   every language change, because what counts as "the other one" changes with
   it. */
const paraTog=document.getElementById("paratog"), paraSel=document.getElementById("para-sel");
function paraDefault(){ return bibleOf(lang)==="en-kjv"?"de-lut":"en-kjv"; }
function paintPara(){
  const fits=paraFits();
  /* the three buttons in that row all answer one question — how the Bible text
     is shown — so the second translation stands with them instead of taking a
     row of its own. It keeps its setting while it is away: narrowing the window
     hides the button, widening it again brings the columns back as they were. */
  paraTog.hidden=!fits;
  /* with no Bible text on the sheet there is nothing to set beside anything, so
     the button is unlit — its setting is kept, it simply has nothing to do */
  paraTog.classList.toggle("active",paraOn&&fits&&versesOn);
  /* The list is never away: it names the edition for both shapes at once — the
     column when the column is on, and the verse held under a finger when it is
     not. Hiding it with the columns would leave the hold with no way to say
     which translation it should bring. It only changes how it stands: pressed
     to the button while the columns are on, on its own line with its own label
     the rest of the time. */
  const prow=document.getElementById("para-row");
  prow.hidden=false;
  prow.classList.toggle("solo",!(fits&&paraOn));
  if(paraVer===bibleOf(lang)||!PARA.some(p=>p[1]===paraVer)){
    paraVer=paraDefault(); localStorage.setItem("sbl.paraver",paraVer); }
  paraSel.innerHTML=PARA.filter(p=>p[1]!==bibleOf(lang))
    .map(p=>'<option value="'+p[1]+'"'+(p[1]===paraVer?' selected':'')+'>'+esc(p[0]+" · "+p[2])+'</option>').join("");
}
paraTog.onclick=function(){
  paraOn=!paraOn;
  /* a second Bible text with no first one makes no sense — the same courtesy
     the layout button does above */
  if(paraOn&&!versesOn){ versesOn=true; localStorage.setItem("sbl.verses","1"); }
  localStorage.setItem("sbl.para",paraOn?"1":"0");
  /* the columns and the layout are separate questions, but both buttons must
     show the truth after either of them moves */
  paintPara(); paintVerseBtns(); render();
};

paraSel.onchange=function(){
  paraVer=paraSel.value; localStorage.setItem("sbl.paraver",paraVer);
  /* picking a second Bible text with no first one on screen leaves the reader
     with a setting and nothing to hold — the same courtesy the switch does */
  let redraw=!!paraPick();
  if(!versesOn){ versesOn=true; localStorage.setItem("sbl.verses","1"); paintVerseBtns(); redraw=true; }

  /* otherwise only the column has to be set again: a held verse is fetched at
     the moment it is held, so a phone is not made to redraw the lesson */
  if(redraw) render();
};
/* Turning the tablet is the one gesture that adds or takes away the room for a
   second column, so it is the one gesture that has to redraw the sheet. Only
   when the parallel is actually on — otherwise a rotation costs nothing. */
PARA_MQ.addEventListener("change",function(){ paintPara(); if(paraOn) render(); });

/* ——— the second translation under a held verse ———
   Where the pair has no room the other edition is still one gesture away: press
   a verse and hold, and it comes out under it in the translation picked above;
   let go and it folds. Two things it never argues with — a tool in hand marks
   the verse instead (that is what taking a tool means), and where the parallel
   column is actually on screen the card stays down, because the answer is
   already standing beside the verse. */
const vpeek=document.getElementById("vpeek");
let peekTok=0,peekT=0;
function peekRect(el){ return el.getClientRects()[0]||el.getBoundingClientRect(); }
function peekPlace(el){
  const r=peekRect(el),full=el.getBoundingClientRect(),w=vpeek.offsetWidth,h=vpeek.offsetHeight;
  /* placed in what is on screen, with no scroll position added: that addition
     is what threw the marker bubble a browser bar's worth off on iOS */
  const x=Math.max(10,Math.min(r.left+r.width/2-w/2,document.documentElement.clientWidth-w-10));
  /* ——— it opens upward, over the verse that was pressed ———
     It used to open downward, which on a tablet is straight under the hand: the
     finger holding the verse is standing on the very place the card arrives, and
     the reader has to lift it to read — taking the card with him. Upward, the
     card's foot sits just above the line he pressed, so the two lie one over the
     other with nothing in between: the verse in his own edition and the same
     verse in the other, read together without moving anything.
     Downward is the fallback, for a verse near the top of the window where there
     is nothing above to open into — and there it clears the whole verse, not
     just the line that was touched. */
  let y=r.top-h-8;
  if(y<10) y=full.bottom+8;
  /* and whatever the arithmetic above decided, inside the window: a verse can
     be off the top of the screen by the time the edition lands, and a card
     placed against it would be off the screen with it */
  y=Math.max(10,Math.min(y,window.innerHeight-h-10));
  vpeek.style.left=Math.round(x)+"px"; vpeek.style.top=Math.round(y)+"px";
}
function peekClose(){
  clearTimeout(peekT); peekTok++;
  if(!vpeek.classList.contains("on")) return;
  vpeek.classList.remove("in");
  const mine=peekTok;
  setTimeout(function(){ if(mine===peekTok) vpeek.classList.remove("on"); },220);
}
async function peekOpen(el){
  const a=String(el.dataset.vr||"").split("."),ver=paraVer;
  if(a.length!==3||!ver) return;
  const my=++peekTok,n=+a[2];
  const vs0=esc((ver.split("-")[1]||ver).toUpperCase());
  /* the card stands up at once, named and empty: the first hold of a session
     may have a whole edition still to fetch */
  vpeek.innerHTML='<div class="pv">'+vs0+'</div>'
    +'<div class="pt"><span class="pn">'+n+'</span><span class="pb">&hellip;</span></div>';
  vpeek.classList.add("on"); peekPlace(el);
  requestAnimationFrame(function(){ if(my===peekTok) vpeek.classList.add("in"); });
  /* ——— and then says which passage it is ———
     The card is what stands in for the second column where there is no room to
     draw one, so it is named the way that column is named: the edition, and the
     passage it is quoting, written in the edition's own language rather than in
     the language of the sheet underneath. "KJV" alone answers "which Bible" and
     leaves "which place" to be worked out from the page behind the card — which
     is the one thing the card is covering.
     It arrives on its own and late if need be: naming the passage must never
     hold up the verse, which is what was actually asked for. */
  peekName(my,vs0,el,ver);
  const bib=await loadBible(ver);
  if(my!==peekTok) return;              /* let go while the edition was still in the air */
  const ch=bib&&bib.books&&bib.books[a[0]],vs=ch&&ch[+a[1]-1];
  const t=vs&&vs[n-1]!=null?esc(strip(String(vs[n-1])).trim()):"";
  vpeek.querySelector(".pb").innerHTML=t||'<span class="vmiss">&mdash;</span>';
  peekPlace(el);                        /* the verse arrived and the card grew */
}
/* The reference is looked up by the key both editions share — the same lookup
   the second column uses, and the same table. Where the edition's language has
   no lesson of its own the card carries its edition and nothing more, exactly as
   the column does: honest, and it costs nothing. */
async function peekName(my,vs0,el,ver){
  const item=el.closest&&el.closest("[data-os]"), os=item&&item.dataset.os;
  const pl=String(ver).split("-")[0];
  if(!os||LANGS.indexOf(pl)<0) return;
  let refs=null;
  try{ refs=await paraRefMap(pl,current.getFullYear(),qOf(current)); }catch(e){ return; }
  if(my!==peekTok) return;
  const r=refs&&refs[os], pv=vpeek.querySelector(".pv");
  if(!r||!pv) return;
  pv.textContent=(ver.split("-")[1]||ver).toUpperCase()+" · "+r;
  peekPlace(el);                        /* the name may have widened the card */
}
/* Once it is up it stays up. Letting go of the verse used to fold it, which
   meant reading a whole verse with a finger held still on the glass — and on a
   phone the finger was standing on the very text being compared. It closes
   when it is dismissed: a tap anywhere, a scroll, or Escape. */
let peekAt=0;
function peekDismiss(){
  if(!vpeek.classList.contains("on")) return;
  /* a stray scroll event in the same breath as the opening must not take it
     straight back down again */
  if(Date.now()-peekAt<400) return;
  peekClose();
}
document.addEventListener("pointerdown",peekDismiss,true);   /* before anything opens a new one */
window.addEventListener("scroll",peekDismiss,{passive:true});
document.addEventListener("keydown",function(e){ if(e.key==="Escape") peekDismiss(); },true);

document.getElementById("sheets").addEventListener("pointerdown",function(e){
  if(mkMode) return;                    /* something in hand: it marks, it does not ask */
  if(paraPick()) return;                /* the column beside the verse already answers */
  const el=e.target.closest&&e.target.closest("[data-vr]"); if(!el) return;
  const x0=e.clientX,y0=e.clientY; let held=false;
  clearTimeout(peekT);
  peekT=setTimeout(function(){ held=true; peekAt=Date.now(); peekOpen(el); },340);
  const off=function(){
    document.removeEventListener("pointermove",move);
    document.removeEventListener("pointerup",off);
    document.removeEventListener("pointercancel",off);
    /* the card was never opened — this was a tap, or a finger that travelled */
    if(!held) peekClose();
  };
  /* a pointer that travels is turning the page or dragging a selection, and
     neither of those asked for a translation */
  const move=function(ev){ if(Math.abs(ev.clientX-x0)>8||Math.abs(ev.clientY-y0)>8){ clearTimeout(peekT); off(); } };
  document.addEventListener("pointermove",move);
  document.addEventListener("pointerup",off);
  document.addEventListener("pointercancel",off);
});

/* what to put back once the print dialog is gone */
let backScope=null, backTitle=null, printGuard=0;
window.addEventListener("afterprint",function(){
  clearTimeout(printGuard);
  if(backTitle!=null){ document.title=backTitle; backTitle=null; }
  /* saving a PDF is not a way of navigating: whoever was reading one lesson
     gets that lesson back, not the thirteen of the quarter */
  const s=backScope; backScope=null;
  if(s!=null&&s!==scope) scope=s;
  render();
});
/* The sheet, printed in a named language rather than in whatever the page
   happens to be set to. Nothing calls it with a second language any more, but
   the shape is worth keeping: it is what puts the document into a language,
   waits for the type, and puts the setting back afterwards. */
async function printSide(lg){
  const back=lang;
  lang=lg;
  document.documentElement.lang=lang;
  try{ await render(); }catch(e){}
  try{ await document.fonts.ready; }catch(e){}
  await new Promise(function(r){ requestAnimationFrame(function(){ requestAnimationFrame(r); }); });
  /* the browser names the file after the title — so it says which lesson it is */
  backTitle=document.title; document.title=docName;
  lang=back;                      /* the setting was never really changed */
  /* Some browsers never send `afterprint`. Without a way back the page would be
     left in its printing state — one language, the scope of the file — until a
     reload. This puts it back if nothing has been heard for a while. */
  clearTimeout(printGuard);
  printGuard=setTimeout(function(){ window.dispatchEvent(new Event("afterprint")); },20000);
  window.print();
}
async function savePdf(which){
  setpopSet(false);
  const b=document.getElementById("pdf-"+which),o=b.textContent; b.textContent="…";
  backScope=scope; scope=which;
  try{ await render(); }catch(e){}
  b.textContent=o;
  /* print only once the type is really on the page: the fallback faces carry
     other metrics and would break the lesson onto different sheets */
  try{ await document.fonts.ready; }catch(e){}
  await new Promise(function(r){ requestAnimationFrame(function(){ requestAnimationFrame(r); }); });
  backTitle=document.title; document.title=docName;
  window.print();
}

const TINT_ROW=[0,2,4,3,1];      /* серый · земля 38° · золото 44° · лес 150° · обложка 216° */
function buildPop(){
  const tpop=document.getElementById("tintpop");
  if(!tpop) return;
  let html="";
  /* the row is laid out by colour and not by the order the themes were written
     in: neutral first, then round the wheel — earth, gold, forest, cover. The
     index in `data-i` stays the real one, because that is what a reader's saved
     choice points at. */
  TINT_ROW.forEach(function(i){
    html+='<span class="sw" data-i="'+i+'" title="'+TINT_NAME[i]+'"></span>'; });
  html+='<span class="sw custom" id="swcustom"></span>';
  tpop.innerHTML=html;
  tpop.querySelectorAll(".sw[data-i]").forEach(function(s){ s.onclick=function(){ const i=+s.dataset.i;
    tintIdx=i; hueActive=false; paintTint();
    try{ localStorage.setItem("sbl.tint",JSON.stringify({i:i})); }catch(e){}
    const hr=document.getElementById("hue-row"); if(hr) hr.hidden=true;
    paintPop(); }; });
  paintPop();
  /* the wheel opens the strip in the panel itself: one row appears under the
     swatches, and it is the only thing there is to move */
  document.getElementById("swcustom").onclick=function(){ hueRow.hidden=!hueRow.hidden; if(!hueRow.hidden) paintHue(); };
}
/* ——— the row shows what it would actually give you ———
   The swatches used to be painted once, from the light cut, and stayed that way
   on a dark sheet: five colours promising something the page would not do. They
   are painted from whichever cut is being worn, so the row is the answer and not
   a picture of one. Nothing here is held in a closure — it can be called before
   the rest of the panel exists, which is what a change of system theme does. */
function paintPop(){
  const tpop=document.getElementById("tintpop");
  if(!tpop) return;
  const d=isDark();
  tpop.querySelectorAll(".sw[data-i]").forEach(function(el){
    const t=THEMES[+el.dataset.i]; if(!t) return;
    el.style.background=(d&&t.d?t.d:t).dk;
  });
  const sc=document.getElementById("swcustom");
  if(sc) sc.style.background=hueActive?(d?hueTintDark(hueOwn):hueTint(hueOwn)).dk:"";
}
const hueRow=document.getElementById("hue-row"), hueBar=document.getElementById("huebar");
/* the dot sits where the hue is, and the wheel wears the colour it stands for
   as soon as one is taken — so the row of swatches always shows what is on */
function paintHue(){
  hueBar.firstElementChild.style.left=(hueOwn/360*100)+"%";
  paintPop();
}
function takeHue(e){
  const r=hueBar.getBoundingClientRect();
  const x=Math.min(Math.max(e.clientX-r.left,0),r.width);
  hueOwn=Math.round(x/r.width*360)%360;
  hueActive=true;
  paintTint(); paintHue();
  try{ localStorage.setItem("sbl.tint",JSON.stringify({h:hueOwn})); }catch(e){}
}

hueBar.addEventListener("pointerdown",function(e){ e.preventDefault(); hueBar.setPointerCapture(e.pointerId); takeHue(e); });

/* ——— one thing at a time beside the sheet ———
   The settings and the list of lessons both hang off the bar and both used to
   be allowed up at once — two panels standing either side of a booklet with
   nothing of it left in between. The settings win while they are open, because
   they are the thing being used; the list steps aside and comes back when they
   close.
   Comes back only if it was up to begin with. Opening the settings is not a way
   of turning the list on, and closing them is not a way of discovering it: a
   reader who keeps the list away must find it away afterwards.
   `outAside` is that memory, and it is kept out of `outSet` on purpose. `outSet`

/* ——— the ink itself ——— */

/* Two strokes of the same colour standing side by side are one stroke: they

/* ——— the reader's own words ——— */

let mkNoteFocused=null;

function mkNoteBody(d){ const c=d.cloneNode(true);
  c.querySelectorAll(".del,.foot,.lab,.fmt").forEach(function(x){ x.remove(); }); return c; }

}

  mkFmt.querySelector(".i").classList.toggle("on",i);

function mkNote(afterEl,html,quiet,colour){

  mkNoteTint(d,colour);
  d.innerHTML=mkClean(html||"");
  /* a note with nothing but its cross has nowhere to put the caret — so an
     empty note is given one empty line to write on */
  if(!d.firstChild){ const ln=document.createElement("div"); ln.appendChild(document.createElement("br")); d.appendChild(ln); }
  /* no signature, no date and no bar of its own under the note: the colour, the
     other face and the line at the foot of the printed sheet already say whose
     these words are, and the settings for them stand free of the note (`mkFmt`) */
  const del=document.createElement("div"); del.className="del"; del.contentEditable="false"; del.textContent="×";
  del.onclick=function(e){ e.stopPropagation(); d.remove(); mkStore(); };
  d.appendChild(del);
  /* pasting brings the reader's words, not somebody's markup */
  d.addEventListener("paste",function(e){
    e.preventDefault();
    const t=(e.clipboardData||window.clipboardData).getData("text/plain");
    document.execCommand("insertText",false,t);
  });
  /* ⌘B, ⌘I and ⌘⇧9 do what the three buttons do; typing "> " opens a quotation
     the way it is typed everywhere else */
  d.addEventListener("keydown",function(e){
    if(!(e.metaKey||e.ctrlKey)) return;
    const k=e.key.toLowerCase();
    if(k==="b"||k==="i"||k==="u"){ e.preventDefault(); mkCmd(k==="b"?"bold":k==="u"?"underline":"italic"); mkStore(); mkFmtPaint(d); }
    else if(e.shiftKey&&e.code==="Digit9"){ e.preventDefault(); mkQuote(d); }
  });
  d.addEventListener("input",function(){
    const n=mkNoteLine(d); if(!n) return;
    const isQ=n.nodeType===1&&n.tagName==="BLOCKQUOTE";
    const txt=n.nodeType===3?n.nodeValue:n.textContent;
    if(!isQ&&txt.slice(0,2)==="> "){
      if(n.nodeType===3) n.nodeValue=n.nodeValue.slice(2);
      else{ const t=mkFirstText(n); if(t) t.nodeValue=t.nodeValue.replace(/^> /,""); }
      mkQuote(d);
    }
  });
  ["keyup","mouseup","focus"].forEach(function(ev){
    d.addEventListener(ev,function(){ mkFmtPaint(d); });
  });
  d.addEventListener("focus",function(){ mkNoteFocused=d; });
  d.addEventListener("blur",function(){ setTimeout(function(){ if(mkNoteFocused===d) mkNoteFocused=null; },150); });
  afterEl.parentNode.insertBefore(d,afterEl.nextSibling);
  const blank=function(){ d.classList.toggle("blank",!mkNoteText(d)); };
  d.addEventListener("input",blank);
  d.addEventListener("input",mkStoreSoon);
  d.addEventListener("blur",function(){ if(!mkNoteText(d)) d.remove(); mkStore(); });
  blank();
  if(!quiet){
    const ln=d.querySelector("blockquote,div:not(.foot):not(.fmt):not(.lab):not(.del)");
    d.focus(); if(ln) mkCaretEnd(ln);
    mkStore();
  }
  return d;
}

/* ——— THE RAIL — a tool is taken first, then the work is done ———
   Nothing pops up to be found and nothing closes after a click: take the
   yellow marker, run through the lesson phrase by phrase, put it back. */
function mkSvgCursor(inner,hx,hy){
  const svg="%3Csvg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'%3E"+inner+"%3C/svg%3E";
  return 'url("data:image/svg+xml;charset=utf8,'+svg+'") '+hx+' '+hy+', crosshair';
}
/* The pointer is the tool itself, drawn at the angle a hand holds it, with the
   nib exactly on the hot spot — so the ink lands where the point is, not where
   a guessed arrow was. The nib carries the colour that is loaded. */
function mkToolCursor(mode,c){
  const col=encodeURIComponent(c||"#ffd84d");
  const E=function(t){ return t.replace(/</g,"%3C").replace(/>/g,"%3E").replace(/#/g,"%23"); };
  /* held at the angle a hand holds it, turned about its own nib — so the nib
     stays exactly on the hot spot, and the barrel leans up and to the right,
     where there is room for it inside the 32 pixels a cursor gets */
  const hand=function(body){ return E("<g transform='rotate(28 7 26) translate(7 26) scale(1.15) translate(-7 -26)'>")+body+E("</g>"); };
  if(mode==="mark"){
    /* a felt marker: barrel, collar, and the wedge in the ink that is loaded */
    return mkSvgCursor(hand(
      E("<path d='M2.2 7a2.2 2.2 0 0 1 2.2-2.2h5.2A2.2 2.2 0 0 1 11.8 7v11H2.2z'")
      +E(" fill='#3c3c41' stroke='#fff' stroke-width='1.5' stroke-linejoin='round'/>")
      +E("<rect x='1.7' y='18' width='10.6' height='3.1' rx='1' fill='#8e8e93' stroke='#fff' stroke-width='1.3'/>")
      +"%3Cpath d='M3 21.1h8l-1.5 5.3H4.5z' fill='"+col+"'"
      +E(" stroke='#fff' stroke-width='1.3' stroke-linejoin='round'/>")
    ),7,26);
  }
  if(mode==="erase"){
    /* a rubber, held the same way, its working corner on the hot spot */
    return mkSvgCursor(hand(
      E("<rect x='1.6' y='13.8' width='11' height='12.4' rx='1.8' fill='#f6f6f9' stroke='#3c3c41' stroke-width='1.5'/>")
      +E("<path d='M1.6 21.3h11' stroke='#3c3c41' stroke-width='1.3'/>")
      +E("<path d='M3.1 21.3h8v3.3a1.6 1.6 0 0 1-1.6 1.6H4.7a1.6 1.6 0 0 1-1.6-1.6z' fill='#d7d7de'/>")
    ),7,26);
  }
  if(mode==="note"){
    /* a card to hang under the paragraph — not a pen: nothing is drawn with it */
    const ink=encodeURIComponent(c||"#2f5bd0");
    return mkSvgCursor(
      E("<rect x='3.2' y='4.2' width='19.6' height='17.6' rx='3' fill='#fff' stroke='#3c3c41' stroke-width='1.7'/>")
      +"%3Cpath d='M7 9.6h12M7 13.2h12M7 16.8h7' stroke='"+ink+"'"
      +E(" stroke-width='1.7' stroke-linecap='round'/>")
      ,4,5);
  }
  if(mode==="copy"){
    /* two cards, the way copying is drawn everywhere, on a beam that shows
       where the words will be taken from */
    return mkSvgCursor(
      E("<path d='M5 3.4v17.2M2.2 3.4h5.6M2.2 20.6h5.6' stroke='#fff' stroke-width='3.6' stroke-linecap='round'/>")
      +E("<path d='M5 3.4v17.2M2.2 3.4h5.6M2.2 20.6h5.6' stroke='#25252a' stroke-width='1.7' stroke-linecap='round'/>")
      +E("<rect x='14' y='8.4' width='11.4' height='13.6' rx='2.2' fill='#fff' stroke='#3c3c41' stroke-width='1.6'/>")
      +E("<rect x='10.4' y='12.4' width='11.4' height='13.6' rx='2.2' fill='#fff' stroke='#3c3c41' stroke-width='1.6'/>")
      +E("<path d='M13.2 17h6M13.2 20.4h4' stroke='#6b6b73' stroke-width='1.4' stroke-linecap='round'/>")
      ,5,12);
  }
  return "";
}
const MK_CURSOR={ins:"text"};
/* the cursor, the selection colour and the lit buttons all say the same thing:
   this is what is in your hand right now */
function mkPaintMode(){
  const sh=document.getElementById("sheets");
  sh.style.cursor=MK_CURSOR[mkMode]||mkToolCursor(mkMode,mkTool.c);
  const p=mkRgb(mkTool.c);

    b.title=T(b.dataset.s); });

  document.querySelector('[data-mode="note"]').title=T("addnote");

/* seven inks and the gamut make eight cells — two even columns, no odd circle
   left standing in the middle */
function mkRailInks(){
  mkInks.innerHTML=mkInkRow().map(function(c){
    return '<span class="ink'+(mkMode==="mark"&&c===mkTool.c?" on":"")+(mkPins.indexOf(c)>=0?" pin":"")
      +'" data-c="'+c+'" style="background:'+c+'" title="'+esc(T("pinhint"))+'"></span>';
  }).join("")+'<span class="ink more'+(mkPickBox.hidden?"":" on")+'" id="more" title="'+esc(T("more"))+'"></span>';
}
function mkSetRail(v){
  mkRailOn=v; mkSet("rail",v);
  if(!v){ mkHintLeft=0; mkSet("hint",0); mkHintHide(); }   /* он уже знает, где они */
  if(!v){ mkMode=null; mkBubClose(); }

     knows it — the buttons are wider on a finger device */

  document.getElementById("mk-rail").classList.toggle("on",v);

}
function mkSetMode(m){
  if(!mkRailOn) return;
  mkMode=(mkMode===m)?null:m;

  mkBubClose(); mkPaintMode();
}
/* a type button takes the marker; pressing the same one again puts it down */
/* A tap on a button drops the selection before the click is delivered, so the
   last live one is kept aside: pressing a tool then paints what the reader had
   already chosen, instead of quietly swallowing it. */
let mkLastSel=null, mkLastSelAt=0;
document.addEventListener("selectionchange",function(){
  const s=window.getSelection();
  if(!s.rangeCount||s.isCollapsed) return;
  const r=s.getRangeAt(0);
  const h=r.commonAncestorContainer.nodeType===1?r.commonAncestorContainer:r.commonAncestorContainer.parentElement;
  if(h&&h.closest&&h.closest(".page[data-les]")&&!h.closest(".myins,.mynote")){
    mkLastSel=r.cloneRange(); mkLastSelAt=Date.now();
  }
});
function mkPending(){
  const s=window.getSelection();
  if(s.rangeCount&&!s.isCollapsed){
    const r=s.getRangeAt(0);
    const h=r.commonAncestorContainer.nodeType===1?r.commonAncestorContainer:r.commonAncestorContainer.parentElement;
    if(h&&h.closest&&h.closest(".page[data-les]")) return r.cloneRange();
  }
  if(mkLastSel&&Date.now()-mkLastSelAt<4000&&mkLastSel.startContainer.isConnected&&!mkLastSel.collapsed)
    return mkLastSel.cloneRange();
  return null;
}
function mkUseSelection(c,y){
  const r=mkPending(); if(!r) return false;
  mkPaint(r,c,y);
  mkLastSel=null;
  const s=window.getSelection(); if(s.removeAllRanges) s.removeAllRanges();
  return true;
}
function mkTakeStyle(y){
  if(!mkRailOn) return;
  if(mkGroup&&mkGroup.length){ mkApply(mkTool.c,y); mkTool.s=y; mkSet("pen",mkTool); mkPaintMode(); return; }
  /* something is already chosen on the page — paint that, and keep the tool */
  if(mkUseSelection(mkTool.c,y)){
    mkTool.s=y; mkSet("pen",mkTool); mkMode="mark"; mkPaintMode(); mkLinger(); return;
  }
  if(mkMode==="mark"&&mkTool.s===y) mkMode=null;
  else { mkTool.s=y; mkSet("pen",mkTool); mkMode="mark"; }
  mkPaintMode();
}
/* a colour never puts the tool down — it only changes what it writes with */
function mkTakeColour(c){
  if(mkNoteFocused&&document.body.contains(mkNoteFocused)){   /* a note is open — colour it */
    mkNoteTint(mkNoteFocused,c); mkStore(); return; }
  if(mkGroup&&mkGroup.length){ mkApply(c,mkTool.s); return; }
  if(mkUseSelection(c,mkTool.s)){ mkRemember(c,mkTool.s); mkMode="mark"; mkPaintMode(); mkLinger(); return; }
  mkRemember(c,mkTool.s); mkMode="mark"; mkPaintMode();
}
/* two fingers of hint: a double click on a desktop, a long press on a screen */
mkRail.addEventListener("dblclick",function(e){
  const i=e.target.closest(".inks [data-c]"); if(i) mkPinToggle(i.dataset.c);
});
let mkHold=null;
mkRail.addEventListener("touchstart",function(e){
  const i=e.target.closest&&e.target.closest(".inks [data-c]"); if(!i) return;
  clearTimeout(mkHold);
  mkHold=setTimeout(function(){ mkHold=null; mkPinToggle(i.dataset.c); },550);
},{passive:true});
mkRail.addEventListener("touchend",function(){ clearTimeout(mkHold); },{passive:true});
mkRail.addEventListener("touchmove",function(){ clearTimeout(mkHold); },{passive:true});
mkRail.addEventListener("mousedown",function(e){
  if(e.target.closest("[data-c],[data-s],[data-mode],#more")) e.preventDefault();   /* keep the selection */
});
mkRail.addEventListener("click",function(e){

    mkPaintMode(); return;
  }

});

/* ——— how many marks are kept, and where ——— */
function mkCount(){
  let n=0;
  document.querySelectorAll(".page[data-les]").forEach(function(pg){
    const d=MKALL[mkKey(pg)];
    if(d) n+=(d.marks||[]).length+(d.ins||[]).length+(d.notes||[]).length;
  });
  return n;
}
/* The count used to sit at the foot of the rail. It is gone: a number that
   goes up while you read is a scoreboard, and nobody marks a lesson to score.
   The calls are left standing — where the marks are kept, and how to clear
   them, is now under the "Marking" label in the settings. */
function mkChipPaint(){}
/* ——— переезд без сервера ———
   The marks live in this browser and nowhere else — that is the promise of the
   card above, and it is worth keeping. So the way to the second device is not
   an account: it is a file the reader carries himself. One tap on a phone hands
   it to AirDrop; on a desktop it lands in Downloads and travels however he
   likes. Nothing is uploaded, nothing is registered, and no one but him ever
   holds it.

   The file is added, never applied over: a mark on the iPad and a mark on the
   phone are both his, and a transfer that silenced one of them would teach him
   not to transfer. Two entries are the same entry when they sit on the same
   block at the same offsets; anything else is new and joins the lesson. Where
   the same range is coloured differently on the two devices, the device being
   read wins and the toast says how often that happened. */
const MK_CARRY_KEY="pencil";     /* всё, что написал читатель, лежит под одним ключом */
function mkCarryCount(all){
  const c={lessons:0,marks:0,ins:0,notes:0};
  for(const k in all){ const d=all[k]||{}; c.lessons++;
    c.marks+=(d.marks||[]).length; c.ins+=(d.ins||[]).length; c.notes+=(d.notes||[]).length; }
  return c;
}
/* the same entry twice is the same entry: a mark is where it sits, a note is
   what it says under the block it hangs from */
const MK_SAME={
  marks:function(o){ return o.k+"|"+o.s+"|"+o.e; },
  ins:  function(o){ return o.k+"|"+o.s+"|"+o.t; },
  notes:function(o){ return o.k+"|"+o.t; }
};
function mkCarryOut(){
  const all=mkGet(MK_CARRY_KEY,{}), c=mkCarryCount(all);
  if(!c.lessons){ mkToast(T("carrynone")); return; }
  const box={sbl:"carry",v:1,made:new Date().toISOString(),app:APP_VERSION,work:all};
  const name="sbl-"+new Date().toISOString().slice(0,10)+".json";
  const text=JSON.stringify(box);
  /* on a tablet the file has somewhere to go by hand — the share sheet is the
     AirDrop the reader already knows; on a desktop it simply saves */
  try{
    const file=new File([text],name,{type:"application/json"});
    if(matchMedia("(pointer:coarse)").matches && navigator.canShare && navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:name}).catch(function(){});
      return;
    }
  }catch(e){}
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([text],{type:"application/json"}));
  a.download=name; a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); },4000);
  mkToast(T("carryout")+" · "+name);
}
function mkCarryIn(){
  const inp=document.createElement("input");
  inp.type="file"; inp.accept="application/json,.json";
  inp.onchange=function(){
    const f=inp.files&&inp.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=function(){
      let box=null;
      try{ box=JSON.parse(String(rd.result)); }catch(e){}
      if(!box||box.sbl!=="carry"||!box.work||typeof box.work!=="object"){ mkToast(T("carrybad")); return; }
      mkCarryMerge(box.work);
    };
    rd.readAsText(f);
  };
  inp.click();
}
function mkCarryMerge(inc){
  const before=JSON.parse(JSON.stringify(MKALL));
  const got={lessons:0,marks:0,ins:0,notes:0}, kept={n:0};
  for(const key in inc){
    const src=inc[key]; if(!src||typeof src!=="object") continue;
    if(!MKALL[key]){ MKALL[key]={marks:[],ins:[],notes:[]}; got.lessons++; }
    const dst=MKALL[key];
    ["marks","ins","notes"].forEach(function(kind){
      dst[kind]=dst[kind]||[];
      const seen={};
      dst[kind].forEach(function(o){ seen[MK_SAME[kind](o)]=o; });
      (src[kind]||[]).forEach(function(o){
        if(!o||typeof o!=="object"||typeof o.k!=="string") return;
        const s=MK_SAME[kind](o);
        if(!(s in seen)){ dst[kind].push(o); seen[s]=o; got[kind]++; }
        else if(JSON.stringify(seen[s])!==JSON.stringify(o)) kept.n++;
      });
    });
  }
  /* a merge that did not fit is worse than no merge: put it all back and say so */
  try{ localStorage.setItem("sbl."+MK_CARRY_KEY,JSON.stringify(MKALL)); }
  catch(e){ MKALL=before; mkToast(T("carryfull")); return; }
  mkRestore(); mkLegend(); mkKeysClose();
  if(!got.lessons&&!got.marks&&!got.ins&&!got.notes){ mkToast(T("carrysame")); return; }
  const said=[];
  if(got.marks) said.push(T("carrymarks")+": "+got.marks);
  if(got.notes) said.push(T("carrynotes")+": "+got.notes);
  if(got.ins)   said.push(T("carryins")+": "+got.ins);
  if(kept.n)    said.push(T("carrykept")+": "+kept.n);
  mkToast(T("carryadded")+" — "+said.join(", "),function(){
    MKALL=before; mkSet(MK_CARRY_KEY,MKALL); mkRestore(); mkLegend();
  });
}
let mkWipeArmed=false;
function mkStoreCard(){
  mkCard(MK_STORE);
  /* carrying comes before erasing: the card says the marks are on this device
     only, and this is the sentence that answers it */
  [["mk-out","carryout","carryouthint"],["mk-in","carryin","carryinhint"]].forEach(function(r,i){
    const row=document.createElement("div");
    row.className="krow"; if(!i) row.style.marginTop="14px";
    row.innerHTML='<kbd id="'+r[0]+'" style="min-width:auto;cursor:pointer">'+esc(T(r[1]))+'</kbd>'
                 +'<span>'+esc(T(r[2]))+'</span>';
    keysPop.appendChild(row);
  });
  document.getElementById("mk-out").onclick=mkCarryOut;
  document.getElementById("mk-in").onclick=mkCarryIn;
  const b=document.createElement("div");
  b.className="krow"; b.style.marginTop="14px";
  b.innerHTML='<kbd id="mk-wipe" style="min-width:auto;cursor:pointer;color:#b3261e">'+esc(T("wipe"))+'</kbd>'
             +'<span>'+esc(T("wipehint"))+'</span>';
  keysPop.appendChild(b);
  mkWipeArmed=false;
  document.getElementById("mk-wipe").onclick=function(){
    if(!mkWipeArmed){ mkWipeArmed=true; this.textContent=T("sure"); return; }
    const before=JSON.parse(JSON.stringify(MKALL));
    document.querySelectorAll(".page[data-les]").forEach(function(pg){
      pg.querySelectorAll("mark").forEach(mkUnwrap);
      pg.querySelectorAll(".myins").forEach(function(e){ e.replaceWith(document.createTextNode(mkInsText(e))); });
      pg.querySelectorAll(".mynote").forEach(function(e){ e.remove(); });
      delete MKALL[mkKey(pg)];
    });
    mkSet("pencil",MKALL); mkLegend(); mkChipPaint(true); mkKeysClose();
    mkToast(T("cleared"),function(){ MKALL=before; mkSet("pencil",MKALL); mkRestore(); mkChipPaint(true); });
  };
}

/* ——— colour, picked beside the rail ——— */
function mkHsv2hex(h,s,v){
  const f=function(n){ const k=(n+h/60)%6, x=v-v*s*Math.max(0,Math.min(k,4-k,1));
    return ("0"+Math.round(x*255).toString(16)).slice(-2); };
  return "#"+f(5)+f(3)+f(1);
}
function mkHex2hsv(hex){
  const p=mkRgb(hex),r=p[0]/255,g=p[1]/255,b=p[2]/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;
  let h=0; if(d){ h=mx===r?60*(((g-b)/d)%6):mx===g?60*((b-r)/d+2):60*((r-g)/d+4); }
  if(h<0) h+=360;
  return [h,mx?d/mx:0,mx];
}
let mkHSV=mkHex2hsv(mkTool.c);
function mkPaintPicker(){
  const h=Math.round(mkHSV[0]);
  mkArea.style.background="linear-gradient(to top,#000,rgba(0,0,0,0)),"
    +"linear-gradient(to right,#fff,hsl("+h+",100%,50%))";
  mkArea.firstElementChild.style.left=(mkHSV[1]*100)+"%";
  mkArea.firstElementChild.style.top=((1-mkHSV[2])*100)+"%";
  mkHue.firstElementChild.style.left=(h/360*100)+"%";
}
/* dragging the field recolours the stroke under the hand, if there is one —
   the choice is made on the text itself, not on a swatch */
function mkLive(){
  const hex=mkHsv2hex(mkHSV[0],mkHSV[1],mkHSV[2]);
  mkPaintPicker();
  if(mkGroup&&mkGroup.length) mkGroup.forEach(function(m){
    const ps=m.classList.contains("ps"),pe=m.classList.contains("pe");
    m.dataset.c=hex; mkInkTo(m,hex,m.dataset.y,ps,pe); });
  return hex;
}
function mkDrag(el,fn){
  const go=function(e){ const b=el.getBoundingClientRect();
    fn(Math.min(1,Math.max(0,(e.clientX-b.left)/b.width)),
       Math.min(1,Math.max(0,(e.clientY-b.top)/b.height))); mkLive(); };
  el.addEventListener("pointerdown",function(e){
    e.preventDefault(); el.setPointerCapture(e.pointerId); go(e);
    const mv=function(ev){ go(ev); };
    const up=function(){ el.removeEventListener("pointermove",mv); el.removeEventListener("pointerup",up);
      const hex=mkLive(); mkRemember(hex,mkTool.s); mkMode="mark"; mkStore();
      mkPickBox.hidden=true; mkPaintMode();       /* the colour is chosen — the gamut steps aside */
      mkUseSelection(hex,mkTool.s); };
    el.addEventListener("pointermove",mv); el.addEventListener("pointerup",up);
  });
}

/* a linger is a hold, not a timer racing other timers: clearing the selection
   after a mark asks the rail to go the same instant, and it must lose */
function mkLinger(ms){

}
/* a finished selection is the moment a tool is wanted — but only when the hand
   is empty: with a marker already taken the selection is painted where it lies
   (mkFromSelection) and nothing has to appear at all */
function mkCallOnSel(){ setTimeout(function(){ if(mkSelLive()) mkCall(true); },mkTouch?200:70); }

document.addEventListener("touchend",mkCallOnSel);
document.addEventListener("selectionchange",function(){ if(!mkSelLive()) mkCall(false); });
/* on a phone the rail lives in the edge: the tab pulls it out, a tap anywhere

const mkTab=document.getElementById("railtab");

mkDrawer(false);
mkTab.addEventListener("click",function(e){ e.stopPropagation(); mkDrawer(true); });

});

/* a swipe in from the left edge pulls the rail out */
let mkEdge=null;

  if(mkRailOn||e.touches.length!==1){ mkEdge=null; return; }

},{passive:true});

/* ——— a tap on the page, with nothing in hand, clears the room ——— */
if(mkTouch) document.addEventListener("click",function(e){
  if(mkMode) return;                                   /* a tool is out — the tap is work */
  if(!window.getSelection().isCollapsed) return;        /* the reader is selecting to copy */
  const t=e.target;
  if(t.closest&&t.closest("#rail,#bub,.bar,.keyspop,.mtoast,a,.myins,.mynote")) return;
  if(t.tagName==="MARK") return;

/* ——— keys: the same tools, without reaching for the rail ——— */
document.addEventListener("keydown",function(e){
  if(e.target.isContentEditable||/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(!mkRailOn) return;              /* the rail is away: the keys are quiet too */
  const k=e.key.toLowerCase();
  if(e.key==="Escape"){ mkSetMode(null); mkBubClose(); mkKeysClose(); return; }
  if(e.key>="1"&&e.key<="4"){ mkTakeStyle(MK_STYLES[+e.key-1]); return; }
  if(k==="e"){ mkSetMode("erase"); return; }
  if(k==="c"){ mkSetMode("copy"); return; }
  if(k==="i"){ mkSetMode("ins"); return; }
  if(k==="n"){ mkSetMode("note"); return; }
  if(k==="m"){ mkMode?mkSetMode(null):mkTakeStyle(mkTool.s); return; }
});

/* ——— the cheat sheet ——— */

/* ——— the quarter, standing on the right ———
   Built from the same quarter file the sheet is built from, so it costs no
   fetch of its own once the lesson is open. `outQ` is the quarter being looked
   at, which is not always the one being read: the arrows walk into the quarters
   either side, and that walk is how the reader learns there are others. */
let outQ=null;
let outOn=localStorage.getItem("sbl.outline")!=="0";
const outEl=document.getElementById("outline");
function outSet(on){ outOn=on; document.body.classList.toggle("outlineon",on);

  const heart='<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 21.35 4.2 14.1a4.6 4.6 0 0 1 6.5-6.5l1.3 1.3 1.3-1.3a4.6 4.6 0 0 1 6.5 6.5Zm0-1.9 6.5-6.1a2.9 2.9 0 0 0-4.1-4.1L12 11.65 9.6 9.25a2.9 2.9 0 0 0-4.1 4.1Z"/></svg>';
  const here=ymd(current);

function outStep(n){ let[y,q]=outQ||[current.getFullYear(),qOf(current)];

document.getElementById("outbtn").onclick=function(){
