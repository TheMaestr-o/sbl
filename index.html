function mkNote(afterEl,html,quiet,colour){
  const d=document.createElement("div");
  d.className="mynote"; d.contentEditable="true"; d.spellcheck=false;
  d.dataset.ph=T("ph");
  mkNoteTint(d,colour);
  d.innerHTML=html||"";
  const lab=document.createElement("div");
  lab.className="lab"; lab.contentEditable="false"; lab.textContent=T("note")+" · "+mkStamp();
  d.appendChild(lab);
  const del=document.createElement("div"); del.className="del"; del.contentEditable="false"; del.textContent="×";
  del.onclick=function(e){ e.stopPropagation(); d.remove(); mkStore(); };
  d.appendChild(del);
  /* pasting brings the reader's words, not somebody's markup */
  d.addEventListener("paste",function(e){
    e.preventDefault();
    const t=(e.clipboardData||window.clipboardData).getData("text/plain");
    document.execCommand("insertText",false,t);
  });
  d.addEventListener("focus",function(){ mkNoteFocused=d; });
  d.addEventListener("blur",function(){ setTimeout(function(){ if(mkNoteFocused===d) mkNoteFocused=null; },150); });
  afterEl.parentNode.insertBefore(d,afterEl.nextSibling);
  const blank=function(){ d.classList.toggle("blank",!mkNoteText(d)); };
  d.addEventListener("input",blank);
  d.addEventListener("blur",function(){ if(!mkNoteText(d)) d.remove(); mkStore(); });
  blank();
  if(!quiet){ d.focus(); mkStore(); }
  return d;
}

/* ——— THE RAIL — a tool is taken first, then the work is done ———
   Nothing pops up to be found and nothing closes after a click: take the
   yellow marker, run through the lesson phrase by phrase, put it back. */
function mkSvgCursor(inner,hx,hy){
  const svg="%3Csvg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'%3E"+inner+"%3C/svg%3E";
  return 'url("data:image/svg+xml;charset=utf8,'+svg+'") '+hx+' '+hy+', crosshair';
}
/* The pointer is the tool itself, drawn at the angle a hand holds it, with the
   nib exactly on the hot spot — so the ink lands where the point is, not where
   a guessed arrow was. The nib carries the colour that is loaded. */
function mkToolCursor(mode,c){
  const col=encodeURIComponent(c||"#ffd84d");
  const g=function(body){ return "%3Cg transform='rotate(-38 7 26)'%3E"+body+"%3C/g%3E"; };
  const barrel=function(x,w,top){
    return "%3Crect x='"+x+"' y='"+top+"' width='"+w+"' height='"+(20-top)+"' rx='1.6' fill='%233c3c41'"
      +" stroke='%23ffffff' stroke-opacity='.85' stroke-width='.9'/%3E"; };
  if(mode==="mark"||mode==="note"){
    const ink=mode==="note"?"%232f5bd0":col;
    /* a chisel-tip highlighter: barrel, collar, and the felt wedge in the ink */
    return mkSvgCursor(g(
      barrel(2.6,9,5)
      +"%3Crect x='2.6' y='20' width='9' height='2.4' fill='%238e8e93'/%3E"
      +"%3Cpath d='M3.1 22.4h8L9.4 27.4H4.8z' fill='"+ink+"' stroke='%23000' stroke-opacity='.28' stroke-width='.5'/%3E"
    ),7,26);
  }
  if(mode==="copy"){
    /* a thin pen: the same hand, a finer point */
    return mkSvgCursor(g(
      barrel(4,6.4,4)
      +"%3Cpath d='M4 20h6.4l-3.2 7z' fill='%23606162' stroke='%23000' stroke-opacity='.25' stroke-width='.5'/%3E"
    ),7,26);
  }
  if(mode==="erase"){
    /* a rubber, held the same way, its working corner on the hot spot */
    return mkSvgCursor(g(
      "%3Crect x='2.2' y='16.4' width='9.6' height='9.6' rx='1.5' fill='%23f7f7fa' stroke='%235f5f66' stroke-width='1.1'/%3E"
      +"%3Cpath d='M2.2 22h9.6' stroke='%235f5f66' stroke-width='1'/%3E"
      +"%3Cpath d='M3.7 22h6.6v2.6a1.5 1.5 0 0 1-1.5 1.5H5.2a1.5 1.5 0 0 1-1.5-1.5z' fill='%23d8d8de'/%3E"
    ),7,26);
  }
  return "";
}
const MK_CURSOR={ins:"text"};
/* the cursor, the selection colour and the lit buttons all say the same thing:
   this is what is in your hand right now */
function mkPaintMode(){
  const sh=document.getElementById("sheets");
  sh.style.cursor=MK_CURSOR[mkMode]||mkToolCursor(mkMode,mkTool.c);
  const p=mkRgb(mkTool.c);
  document.documentElement.style.setProperty("--selc",
    mkMode==="mark"?"rgba("+p[0]+","+p[1]+","+p[2]+",.5)":"rgba(0,122,255,.22)");
  mkRail.querySelectorAll("[data-mode]").forEach(function(b){
    b.classList.toggle("on",!!mkMode&&b.dataset.mode===mkMode); });
  mkRail.querySelectorAll("[data-s]").forEach(function(b){
    b.classList.toggle("on",mkMode==="mark"&&b.dataset.s===mkTool.s);
    b.title=T(b.dataset.s); });
  document.querySelector('[data-mode="ins"]').title=T("ins");
  document.querySelector('[data-mode="note"]').title=T("addnote");
  document.querySelector('[data-mode="erase"]').title=T("erase");
  document.querySelector('[data-mode="copy"]').title=T("copy");
  mkRailInks();
}
/* seven inks and the gamut make eight cells — two even columns, no odd circle
   left standing in the middle */
function mkRailInks(){
  mkInks.innerHTML=mkInkRow().map(function(c){
    return '<span class="ink'+(mkMode==="mark"&&c===mkTool.c?" on":"")+(mkPins.indexOf(c)>=0?" pin":"")
      +'" data-c="'+c+'" style="background:'+c+'" title="'+esc(T("pinhint"))+'"></span>';
  }).join("")+'<span class="ink more'+(mkPickBox.hidden?"":" on")+'" id="more" title="'+esc(T("more"))+'"></span>';
}
function mkSetRail(v){
  mkRailOn=v; mkSet("rail",v);
  if(!v){ mkHintLeft=0; mkSet("hint",0); mkHintHide(); }   /* он уже знает, где они */
  if(!v){ mkMode=null; mkBubClose(); }
  mkRail.style.display=v?"":"none";
  document.getElementById("mk-rail").classList.toggle("on",v);
  mkPaintMode();
  mkToast(T(v?"railshown":"railhid"));
}
function mkSetMode(m){
  if(!mkRailOn) return;
  mkMode=(mkMode===m)?null:m;
  if(mkMode!=="mark") mkPickBox.hidden=true;
  mkBubClose(); mkPaintMode();
}
/* a type button takes the marker; pressing the same one again puts it down */
function mkTakeStyle(y){
  if(!mkRailOn) return;
  if(mkGroup&&mkGroup.length){ mkApply(mkTool.c,y); mkTool.s=y; mkSet("pen",mkTool); mkPaintMode(); return; }
  if(mkMode==="mark"&&mkTool.s===y) mkMode=null;
  else { mkTool.s=y; mkSet("pen",mkTool); mkMode="mark"; }
  mkPaintMode();
}
/* a colour never puts the tool down — it only changes what it writes with */
function mkTakeColour(c){
  if(mkNoteFocused&&document.body.contains(mkNoteFocused)){   /* a note is open — colour it */
    mkNoteTint(mkNoteFocused,c); mkStore(); return; }
  if(mkGroup&&mkGroup.length){ mkApply(c,mkTool.s); return; }
  mkRemember(c,mkTool.s); mkMode="mark"; mkPaintMode();
}
/* two fingers of hint: a double click on a desktop, a long press on a screen */
mkRail.addEventListener("dblclick",function(e){
  const i=e.target.closest(".inks [data-c]"); if(i) mkPinToggle(i.dataset.c);
});
let mkHold=null;
mkRail.addEventListener("touchstart",function(e){
  const i=e.target.closest&&e.target.closest(".inks [data-c]"); if(!i) return;
  clearTimeout(mkHold);
  mkHold=setTimeout(function(){ mkHold=null; mkPinToggle(i.dataset.c); },550);
},{passive:true});
mkRail.addEventListener("touchend",function(){ clearTimeout(mkHold); },{passive:true});
mkRail.addEventListener("touchmove",function(){ clearTimeout(mkHold); },{passive:true});
mkRail.addEventListener("click",function(e){
  const y=e.target.closest("[data-s]"); if(y) return mkTakeStyle(y.dataset.s);
  const m=e.target.closest("[data-mode]"); if(m) return mkSetMode(m.dataset.mode);
  if(e.target.closest("#more")){
    const open=mkPickBox.hidden;
    mkPickBox.hidden=!open;
    if(open){ mkHSV=mkHex2hsv(mkTool.c); mkPaintPicker(); if(!mkMode) mkMode="mark"; }
    mkPaintMode(); return;
  }
  const c=e.target.closest("[data-c]"); if(c) return mkTakeColour(c.dataset.c);
  if(e.target.closest("#mkchip")) mkStoreCard();
});

/* ——— how many marks are kept, and where ——— */
function mkCount(){
  let n=0;
  document.querySelectorAll(".page[data-les]").forEach(function(pg){
    const d=MKALL[mkKey(pg)];
    if(d) n+=(d.marks||[]).length+(d.ins||[]).length+(d.notes||[]).length;
  });
  return n;
}
function mkChipPaint(flash){
  mkChip.textContent="✓ "+mkCount();
  mkChip.title=T("kept");
  if(flash){ mkChip.classList.add("flash");
    clearTimeout(mkChipPaint.t);
    mkChipPaint.t=setTimeout(function(){ mkChip.classList.remove("flash"); },1300); }
}
let mkWipeArmed=false;
function mkStoreCard(){
  mkCard(MK_STORE);
  const b=document.createElement("div");
  b.className="krow"; b.style.marginTop="14px";
  b.innerHTML='<kbd id="mk-wipe" style="min-width:auto;cursor:pointer;color:#b3261e">'+esc(T("wipe"))+'</kbd>'
             +'<span>'+esc(T("wipehint"))+'</span>';
  keysPop.appendChild(b);
  mkWipeArmed=false;
  document.getElementById("mk-wipe").onclick=function(){
    if(!mkWipeArmed){ mkWipeArmed=true; this.textContent=T("sure"); return; }
    const before=JSON.parse(JSON.stringify(MKALL));
    document.querySelectorAll(".page[data-les]").forEach(function(pg){
      pg.querySelectorAll("mark").forEach(mkUnwrap);
      pg.querySelectorAll(".myins").forEach(function(e){ e.replaceWith(document.createTextNode(mkInsText(e))); });
      pg.querySelectorAll(".mynote").forEach(function(e){ e.remove(); });
      delete MKALL[mkKey(pg)];
    });
    mkSet("pencil",MKALL); mkLegend(); mkChipPaint(true); mkKeysClose();
    mkToast(T("cleared"),function(){ MKALL=before; mkSet("pencil",MKALL); mkRestore(); mkChipPaint(true); });
  };
}

/* ——— colour, picked beside the rail ——— */
function mkHsv2hex(h,s,v){
  const f=function(n){ const k=(n+h/60)%6, x=v-v*s*Math.max(0,Math.min(k,4-k,1));
    return ("0"+Math.round(x*255).toString(16)).slice(-2); };
  return "#"+f(5)+f(3)+f(1);
}
function mkHex2hsv(hex){
  const p=mkRgb(hex),r=p[0]/255,g=p[1]/255,b=p[2]/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;
  let h=0; if(d){ h=mx===r?60*(((g-b)/d)%6):mx===g?60*((b-r)/d+2):60*((r-g)/d+4); }
  if(h<0) h+=360;
  return [h,mx?d/mx:0,mx];
}
let mkHSV=mkHex2hsv(mkTool.c);
function mkPaintPicker(){
  const h=Math.round(mkHSV[0]);
  mkArea.style.background="linear-gradient(to top,#000,rgba(0,0,0,0)),"
    +"linear-gradient(to right,#fff,hsl("+h+",100%,50%))";
  mkArea.firstElementChild.style.left=(mkHSV[1]*100)+"%";
  mkArea.firstElementChild.style.top=((1-mkHSV[2])*100)+"%";
  mkHue.firstElementChild.style.left=(h/360*100)+"%";
}
/* dragging the field recolours the stroke under the hand, if there is one —
   the choice is made on the text itself, not on a swatch */
function mkLive(){
  const hex=mkHsv2hex(mkHSV[0],mkHSV[1],mkHSV[2]);
  mkPaintPicker();
  if(mkGroup&&mkGroup.length) mkGroup.forEach(function(m){
    const ps=m.classList.contains("ps"),pe=m.classList.contains("pe");
    m.dataset.c=hex; mkInkTo(m,hex,m.dataset.y,ps,pe); });
  return hex;
}
function mkDrag(el,fn){
  const go=function(e){ const b=el.getBoundingClientRect();
    fn(Math.min(1,Math.max(0,(e.clientX-b.left)/b.width)),
       Math.min(1,Math.max(0,(e.clientY-b.top)/b.height))); mkLive(); };
  el.addEventListener("pointerdown",function(e){
    e.preventDefault(); el.setPointerCapture(e.pointerId); go(e);
    const mv=function(ev){ go(ev); };
    const up=function(){ el.removeEventListener("pointermove",mv); el.removeEventListener("pointerup",up);
      const hex=mkLive(); mkRemember(hex,mkTool.s); mkMode="mark"; mkPaintMode(); mkStore(); };
    el.addEventListener("pointermove",mv); el.addEventListener("pointerup",up);
  });
}
mkDrag(mkArea,function(x,y){ mkHSV=[mkHSV[0],x,1-y]; });
mkDrag(mkHue,function(x){ mkHSV=[x*360,mkHSV[1],mkHSV[2]]; });

/* ——— the bubble on a stroke already laid down ——— */
function mkBubPlace(rect){
  mkBub.classList.add("on");
  mkBub.querySelector('[data-a="erase"]').title=T("erase");
  const w=mkBub.offsetWidth,h=mkBub.offsetHeight;
  let x=rect.left+window.scrollX+rect.width/2-w/2;
  x=Math.max(10,Math.min(x,document.documentElement.clientWidth-w-10));
  let y=rect.bottom+window.scrollY+9;
  if(rect.bottom+h+16>window.innerHeight) y=rect.top+window.scrollY-h-9;
  mkBub.style.left=x+"px"; mkBub.style.top=y+"px";
}
function mkBubClose(){
  mkBub.classList.remove("on");
  if(mkGroup) mkGroup.forEach(function(m){ m.classList.remove("sel"); });
  mkGroup=null;
}
/* recolour the stroke that was clicked — and stay open, so the colours can be
   tried one after another */
function mkApply(c,s){
  if(!mkGroup||!mkGroup.length) return;
  mkGroup.forEach(function(m){
    const ps=m.classList.contains("ps"),pe=m.classList.contains("pe");
    m.dataset.c=c; m.dataset.y=s;
    m.className=s+(ps?" ps":"")+(pe?" pe":"");
    mkInkTo(m,c,s,ps,pe);
  });
  mkRemember(c,s); mkStore(); mkRailInks();
}
document.addEventListener("click",function(e){
  if(e.target.tagName!=="MARK"||mkMode==="erase") return;
  mkBubClose();
  mkGroup=e.target.dataset.g?mkPieces(e.target.dataset.g):[e.target];
  mkGroup.forEach(function(m){ m.classList.add("sel"); });
  mkBubPlace(e.target.getBoundingClientRect());
});
mkBub.addEventListener("mousedown",function(e){ e.preventDefault(); });
mkBub.addEventListener("click",function(e){
  if(!e.target.closest("[data-a]")||!mkGroup||!mkGroup.length) return;
  const g=mkGroup; mkBubClose(); mkEraseAround(g);
});
/* the rail is not "somewhere else": while a stroke is picked up, pressing a
   colour or another stroke there has to reach the stroke, not the desk */
document.addEventListener("mousedown",function(e){
  if(mkBub.contains(e.target)||mkRail.contains(e.target)) return;
  if(e.target.tagName==="MARK") return;
  mkBubClose();
});

/* ——— the eraser takes the text clean ——— */
function mkEraseRange(r){
  [].slice.call(document.querySelectorAll("mark")).filter(function(m){ return r.intersectsNode(m); }).forEach(mkUnwrap);
  [].slice.call(document.querySelectorAll(".myins")).filter(function(m){ return r.intersectsNode(m); })
    .forEach(function(m){ m.remove(); });
  mkStore();
}
function mkEraseAround(g){
  const r=document.createRange(); r.setStartBefore(g[0]); r.setEndAfter(g[g.length-1]);
  mkEraseRange(r);
}

/* ——— what a finished selection does depends on the tool in hand ——— */
const mkTouch=matchMedia("(pointer:coarse)").matches;
function mkFromSelection(e){
  if(mkMode!=="mark"&&mkMode!=="erase"&&mkMode!=="copy") return;
  if(mkRail.contains(e.target)||mkBub.contains(e.target)) return;
  setTimeout(function(){
    const s=window.getSelection();
    if(!s.rangeCount||s.isCollapsed) return;
    const r=s.getRangeAt(0);
    const host=r.commonAncestorContainer.nodeType===1?r.commonAncestorContainer:r.commonAncestorContainer.parentElement;
    if(!host||!host.closest||!host.closest(".page[data-les]")) return;
    const keep=r.cloneRange();
    s.removeAllRanges();
    if(mkMode==="erase") mkEraseRange(keep);
    else if(mkMode==="copy") mkCopyRange(keep);
    else mkPaint(keep,mkTool.c,mkTool.s);
  },mkTouch?120:0);
}
document.addEventListener("mouseup",mkFromSelection);
document.addEventListener("touchend",mkFromSelection);

/* copying carries the reference with it: the verse above the passage, or the
   lesson itself */
function mkCopyRange(r){
  const t=r.toString().trim(); if(!t) return;
  let el=r.commonAncestorContainer;
  if(el.nodeType===3) el=el.parentElement;
  const item=el.closest?el.closest(".vitem"):null;
  const ref=item&&item.querySelector(".vref")?item.querySelector(".vref").textContent.trim():"";
  const out="«"+t+"»"+(ref?" ("+ref+")":"");
  if(navigator.clipboard) navigator.clipboard.writeText(out);
  mkToast(T("copied"));
}

/* ——— one click writes your own words exactly where you clicked ——— */
function mkRangeAt(x,y){
  if(document.caretRangeFromPoint) return document.caretRangeFromPoint(x,y);
  if(document.caretPositionFromPoint){
    const p=document.caretPositionFromPoint(x,y);
    if(p){ const r=document.createRange(); r.setStart(p.offsetNode,p.offset); r.collapse(true); return r; }
  }
  return null;
}
document.addEventListener("click",function(e){
  if(!mkMode||mkMode==="mark") return;
  if(mkRail.contains(e.target)||mkBub.contains(e.target)) return;
  const blk=e.target.closest?e.target.closest("[data-k]"):null;
  if(!blk||!blk.closest(".page[data-les]")) return;
  if(e.target.closest(".myins,.mynote")) return;
  if(mkMode==="ins"){
    const r=mkRangeAt(e.clientX,e.clientY);
    if(r&&blk.contains(r.startContainer)) mkInsert(r);
  }
  if(mkMode==="note"){
    const host=blk.classList.contains("vtext")?(blk.closest(".vgroup")||blk):blk;
    mkNote(host,"",false,mkTool.c);
  }
  if(mkMode==="erase"&&e.target.tagName==="MARK"){
    mkEraseAround(e.target.dataset.g?mkPieces(e.target.dataset.g):[e.target]);
  }
});

/* ——— the days down the side ———
   Seven bands make a lesson; the strip is built from what is on the page, so
   it works the same for one week and for a whole quarter of them. Clicking a
   day takes you to it; scrolling moves the mark along by itself. */
const mkDaysEl=document.getElementById("days");
let mkAnchors=[];
/* a lesson runs a week: when today is one of its days, that is where it opens.
   Only when the lesson itself changes — switching the language or turning the
   verses on must not throw the reader back. */
let mkLastLes=null;
function mkOpenToday(){
  if(scope!=="week") return;
  const pg=document.querySelector(".page[data-les]"); if(!pg) return;
  if(mkLastLes===pg.dataset.les) return;
  mkLastLes=pg.dataset.les;
  const sec=document.querySelector('.sec[data-d="'+ymd(new Date())+'"]');
  if(!sec) return;
  requestAnimationFrame(function(){ mkGoTo(sec,false); mkDaysMark(); });
}
function mkDaysBuild(){
  mkAnchors=[];
  let html="";
  if(scope==="quarter"){
    document.querySelectorAll(".page[data-les]").forEach(function(pg){
      const h=pg.querySelector(".lesson"); if(!h) return;
      const n=(strip(h.textContent).match(/\d+/)||[""])[0];
      mkAnchors.push(pg);
      html+='<div class="dchip">'+esc(n)+'</div>';
    });
  } else {
    document.querySelectorAll(".sec[data-d]").forEach(function(sec){
      const d=sec.querySelector(".day"); if(!d) return;
      const short=strip(d.textContent).trim().split(/[\s,.]+/)[0];
      mkAnchors.push(sec);
      html+='<div class="dchip">'+esc(short)+'</div>';
    });
  }
  mkDaysEl.innerHTML=mkAnchors.length>1?('<i class="dpill"></i>'+html):"";
  mkDaysEl.classList.remove("ready");
  mkDaysMark();
}
function mkBarH(){
  const b=document.querySelector(".bar");
  return (b&&getComputedStyle(b).position==="sticky"?b.getBoundingClientRect().height:0)+10;
}
function mkGoTo(el,smooth){
  const y=el.getBoundingClientRect().top+window.scrollY-mkBarH();
  window.scrollTo({top:Math.max(0,y),behavior:smooth?"smooth":"auto"});
  const band=el.classList&&el.classList.contains("sec")?el:el.querySelector(".sec");
  if(band){ band.classList.remove("flash"); void band.offsetWidth; band.classList.add("flash");
    setTimeout(function(){ band.classList.remove("flash"); },1000); }
}
mkDaysEl.addEventListener("click",function(e){
  const c=e.target.closest(".dchip"); if(!c) return;
  const chips=[].slice.call(mkDaysEl.querySelectorAll(".dchip"));
  const el=mkAnchors[chips.indexOf(c)]; if(!el) return;
  chips.forEach(function(x){ x.classList.toggle("on",x===c); });
  mkDaysMove(c);
  mkGoTo(el,true);
  setTimeout(mkDaysMark,700);
});
function mkDaysMove(c){
  const pill=mkDaysEl.querySelector(".dpill"); if(!pill||!c) return;
  pill.style.width=c.offsetWidth+"px"; pill.style.height=c.offsetHeight+"px";
  pill.style.transform="translate("+(c.offsetLeft-6)+"px,"+(c.offsetTop-6)+"px)";
  mkDaysEl.classList.add("ready");
}
function mkDaysMark(){
  if(!mkAnchors.length) return;
  const chips=[].slice.call(mkDaysEl.querySelectorAll(".dchip"));
  let cur=0;
  const line=mkBarH()+38;
  for(let i=0;i<mkAnchors.length;i++) if(mkAnchors[i].getBoundingClientRect().top<=line) cur=i;
  chips.forEach(function(c,i){ c.classList.toggle("on",i===cur); });
  mkDaysMove(chips[cur]);
}
let mkTick=false;
window.addEventListener("scroll",function(){
  if(mkTick) return; mkTick=true;
  requestAnimationFrame(function(){ mkTick=false; mkDaysMark(); });
},{passive:true});

/* ——— two ways in for someone who has never met the tools ———
   A swipe from the left edge pulls the rail out, the way a drawer opens on the
   side it lives on. And the first few times a reader selects a line with the
   tools away, a small chip offers them — after three refusals it never asks
   again. */
const mkHintEl=document.getElementById("mkhint");
let mkHintLeft=mkGet("hint",3);
function mkHintHide(){ mkHintEl.classList.remove("on"); }
function mkHintShow(rect){
  if(mkRailOn||mkHintLeft<=0) return;
  mkHintEl.textContent="✎ "+T("markit");
  mkHintEl.classList.add("on");
  const w=mkHintEl.offsetWidth,h=mkHintEl.offsetHeight;
  let x=Math.max(10,Math.min(rect.left+window.scrollX+rect.width/2-w/2,
    document.documentElement.clientWidth-w-10));
  let y=rect.bottom+window.scrollY+10;
  if(rect.bottom+h+16>window.innerHeight) y=rect.top+window.scrollY-h-10;
  mkHintEl.style.left=x+"px"; mkHintEl.style.top=y+"px";
  mkHintLeft--; mkSet("hint",mkHintLeft);
  clearTimeout(mkHintShow.t); mkHintShow.t=setTimeout(mkHintHide,5000);
}
mkHintEl.onmousedown=function(e){ e.preventDefault(); };
mkHintEl.onclick=function(){ mkHintHide(); mkHintLeft=0; mkSet("hint",0); mkSetRail(true); };
document.addEventListener("selectionchange",function(){
  if(window.getSelection().isCollapsed) mkHintHide();
});
function mkOffer(){
  if(mkRailOn||mkHintLeft<=0) return;
  setTimeout(function(){
    const s=window.getSelection();
    if(!s.rangeCount||s.isCollapsed) return;
    const r=s.getRangeAt(0);
    const host=r.commonAncestorContainer.nodeType===1?r.commonAncestorContainer:r.commonAncestorContainer.parentElement;
    if(!host||!host.closest||!host.closest(".page[data-les]")) return;
    if(String(s).trim().length<6) return;
    mkHintShow(r.getBoundingClientRect());
  },mkTouch?140:0);
}
document.addEventListener("mouseup",mkOffer);
document.addEventListener("touchend",mkOffer);

/* a swipe in from the left edge pulls the rail out */
let mkEdge=null;
document.addEventListener("touchstart",function(e){
  if(mkRailOn||e.touches.length!==1){ mkEdge=null; return; }
  const t=e.touches[0];
  mkEdge=t.clientX<=28?{x:t.clientX,y:t.clientY}:null;
},{passive:true});
document.addEventListener("touchend",function(e){
  if(!mkEdge) return;
  const t=e.changedTouches[0],dx=t.clientX-mkEdge.x,dy=Math.abs(t.clientY-mkEdge.y);
  mkEdge=null;
  if(dx>60&&dy<70){ mkHintHide(); mkHintLeft=0; mkSet("hint",0); mkSetRail(true); }
},{passive:true});

/* ——— a tap on the page, with nothing in hand, clears the room ——— */
if(mkTouch) document.addEventListener("click",function(e){
  if(mkMode) return;                                   /* a tool is out — the tap is work */
  if(!window.getSelection().isCollapsed) return;        /* the reader is selecting to copy */
  const t=e.target;
  if(t.closest&&t.closest("#rail,#bub,.bar,.keyspop,.mtoast,a,.myins,.mynote")) return;
  if(t.tagName==="MARK") return;
  if(!t.closest||!t.closest("#sheets")) return;
  document.body.classList.toggle("bare");
});

/* ——— keys: the same tools, without reaching for the rail ——— */
document.addEventListener("keydown",function(e){
  if(e.target.isContentEditable||/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(!mkRailOn) return;              /* the rail is away: the keys are quiet too */
  const k=e.key.toLowerCase();
  if(e.key==="Escape"){ mkSetMode(null); mkBubClose(); mkKeysClose(); return; }
  if(e.key>="1"&&e.key<="4"){ mkTakeStyle(MK_STYLES[+e.key-1]); return; }
  if(k==="e"){ mkSetMode("erase"); return; }
  if(k==="c"){ mkSetMode("copy"); return; }
  if(k==="i"){ mkSetMode("ins"); return; }
  if(k==="n"){ mkSetMode("note"); return; }
  if(k==="m"){ mkMode?mkSetMode(null):mkTakeStyle(mkTool.s); return; }
});

/* ——— the cheat sheet ——— */
const keysPop=document.getElementById("keyspop"), keysBack=document.getElementById("keysback");
function mkCard(list){
  let h="";
  list.forEach(function(row){
    const k=row[0], t=row[1][lang]||row[1].en;
    if(k==="title"){ h+='<h4>'+esc(t)+'</h4>'; return; }
    if(k==="cap"||k==="cap2"){ h+='<div class="cap">'+esc(t)+'</div>'; return; }
    h+='<div class="krow"><kbd>'+esc(k.trim()||"✱")+'</kbd><span>'+esc(t)+'</span></div>';
  });
  keysPop.innerHTML=h; keysPop.hidden=false; keysBack.hidden=false;
  setpop.hidden=true; gear.classList.remove("open");
}
function mkKeysOpen(){ mkCard(MK_KEYS); }
function mkKeysClose(){ keysPop.hidden=true; keysBack.hidden=true; }
document.getElementById("mk-keys").onclick=mkKeysOpen;
document.getElementById("mk-ver").onclick=function(){ mkCard(MK_NEW); };
keysBack.onclick=mkKeysClose;
document.addEventListener("keydown",function(e){ if(e.key==="Escape") mkKeysClose(); },true);

document.getElementById("mk-rail").onclick=function(){ mkSetRail(!mkRailOn); };
mkRail.style.display=mkRailOn?"":"none";
mkPaintMode(); mkChipPaint();

render();
</script>
</body>
</html>
