/* ——— one sheet, edge to edge ———
   The paper is laid on the document itself, not on the column of text: a tile
   that stopped where the lesson stops drew a line down both margins, and the
   eye finds that line before it finds a word. So the body carries the paper,
   the sheet gives up its own fill and lets it through, and there is no edge to
   feel anywhere in the window — the text simply sits on the paper.
   It is the body's background and not the root's, so it scrolls with the
   lesson: paper that stood still under moving type would read as a wall, not
   as a page. */
html.paper body{background-image:var(--paper)}
html.paper .page{background-color:transparent}
/* the same paper under the printed parts: the band, the memory box and the
   lesson tag are ink on this sheet, not stickers laid over it */
html.paper .mem,html.paper .sec::before,html.paper .lesson{background-image:var(--paper)}
html.paper .sec .day{background-image:var(--paper);background-blend-mode:soft-light}
/* the browser tries to keep the old text under your eye when the sheet is
   replaced, and quietly scrolls back to it — which fought every jump to a day.
   The two gutters are the standing rule of this page: a fixed panel does not
   lie on the lesson, it takes room away from it. Whatever is pinned to an edge
   sets its own gutter (see `body.railout` and the strip of days), and the sheet
   is laid inside what is left. Default zero — on a wide screen the panels stand
   in the margin the window already gives. */
#sheets{overflow-anchor:none;padding-left:var(--gut-l,0px);padding-right:var(--gut-r,0px);
  padding-bottom:var(--gut-b,0px);
  transition:padding-left .34s cubic-bezier(.25,1.1,.35,1),
             padding-right .34s cubic-bezier(.25,1.1,.35,1)}
/* ——— one sheet, and one only ———
   The lesson was once offered twice over, in two languages side by side. It is
   gone, and on purpose: two columns of a booklet set for one is a way of
   reading that fights the way this page is built, and the link already carries
   the language — `#de/20260826` — so a second tongue is a second tab, scrolled,
   marked and saved on its own. `manna` is the reader made for comparing two
   translations; this one sets one booklet properly. */
@media (prefers-reduced-motion:reduce){ #sheets{transition:none} }
/* the browser puts a heading under the bar by its own rules, with its own idea
   of where the viewport starts — which is what iOS browsers disagree about */
/* ——— where a jump comes to rest ———
   Landing puts the top of the block at the top of the window, and the bar is
   sitting there. A day cleared it because it was told to; a question was not,
   so the voice and the links both left it just under the bar, out of sight. It
   clears the bar now and stands a little under it — a block pressed against the
   chrome reads as cut off even when all of it is there. */
.sec,.page{scroll-margin-top:var(--barh,67px)}
.q,.note,.vgroup{scroll-margin-top:calc(var(--barh,67px) + 22px)}
.msg{text-align:center;color:#999;padding:80px 0;font-family:var(--serif);font-style:italic;font-size:19px}

/* LESSON tag — contour from L4.eps: vertical sides, horizontal top (bleeds off page top),
   bottom slants down to the right (right corner ~4.86% of width lower). */
.lesson{position:absolute;top:-40px;right:64px;z-index:2;width:210px;height:138px;
  background:var(--gray);color:var(--gray-dk);
  font-weight:700;font-size:26px;letter-spacing:3px;text-transform:uppercase;line-height:1;white-space:nowrap;
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:18px;
  clip-path:polygon(0 0,100% 0,100% 100%,0 calc(100% - 10px))}

/* the lesson tag's seat: the date can never grow into it, at any text size */
.top{margin-bottom:24px;padding-right:292px;min-height:100px}
.top .date{font-weight:700;font-size:19px;letter-spacing:.4px;text-transform:uppercase}
h1.title{font-weight:700;font-size:58px;line-height:1.02;letter-spacing:-1px;margin:6px 0 30px}

.mem{background:var(--box);padding:20px 22px;margin-bottom:26px;text-align:justify;hyphens:auto;font-size:18px;line-height:1.5}
.mem b{font-weight:700}
.read{margin-bottom:34px;font-size:18px}
.read .lbl{font-weight:700}
.read .val{margin-left:1.6em}
.read .val i{font-family:var(--serif);font-style:italic}
.quote{font-family:var(--serif);font-size:19px;line-height:1.52;text-align:justify;hyphens:auto;margin-bottom:34px}
.quote i{font-style:italic}

/* band shape from official vector: rectangle + dark tag (vertical left seam, right edge slanted 8.2deg) */
.sec{position:relative;height:auto;min-height:40px;margin:40px 0 22px}   /* band hugs the text as in the printed booklet */
.sec::before{content:"";position:absolute;inset:0;background:var(--gray);clip-path:polygon(0 0,100% 0,calc(100% - 7.5px) 100%,0 100%)}
/* the right padding is the day tag's seat — a long title wraps inside the band
   instead of running underneath it */
.sec .t{position:relative;min-height:40px;display:flex;align-items:center;padding:6px 152px 6px 20px;
  font-weight:700;font-size:22px;line-height:1.2;text-transform:uppercase;letter-spacing:.2px}
.sec .t .n{margin-right:.32em}   /* one space between "1." and the title */
.sec .day{position:absolute;top:0;bottom:0;right:0;z-index:1;background:var(--gray-dk);color:var(--onacc);display:flex;align-items:center;
  padding:0 26px;font-weight:700;font-size:18px;white-space:nowrap;clip-path:polygon(0 0,100% 0,calc(100% - 7.5px) 100%,0 100%)}

/* 24px + the 2px rule = 26px, the same column the question text starts in, so
   reference, verse and question all hang on one vertical line */
.vgroup{margin:8px 0 16px;padding:3px 0 4px 24px;border-left:2px solid var(--gray-dk)}
.vitem{break-inside:avoid}
.vitem + .vitem{margin-top:12px}
.vref{font-weight:700;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--gray-dk);margin-bottom:4px}
.vtext{font-family:var(--serif);font-size:16.5px;line-height:1.5;text-align:justify;hyphens:auto;color:#2b2b2b}
/* the verse number keeps one look everywhere: same serif, same size, same
   colour — only a gentle raise, not a full superscript hop */
.vtext .vnum{font-weight:700;font-size:11px;vertical-align:.42em;line-height:0;margin:0 4px 0 0;color:var(--gray-dk)}
/* one verse per line — number hangs in the margin, wrapped lines align under the text */
.vtext.lines{text-align:left;hyphens:none}
/* the number starts the line — flush with the reference above it and with the
   question text — and the verse hangs off it */
.vtext.lines .v{display:block;padding-left:17px;text-indent:-17px;break-inside:avoid}
.vtext.lines .v + .v{margin-top:5px}
/* min-width, not width: the verse follows the number as closely as it does in
   running text, and a three-digit number simply takes the room it needs */
.vtext.lines .vn{display:inline-block;min-width:13px;margin-right:4px;text-indent:0;vertical-align:.42em;
  font-weight:700;font-size:11px;color:var(--gray-dk)}   /* same raise as the inline number */
.vmiss{color:#bbb}
/* A passage still on its way holds its place and shows that it is coming,
   instead of leaving a hole the reader reads as a page that failed. */
.vtext:empty{min-height:1.5em;border-radius:4px;
  background:linear-gradient(90deg,rgba(0,0,0,.04),rgba(0,0,0,.08),rgba(0,0,0,.04));
  background-size:220% 100%;animation:vwait 1.5s ease-in-out infinite}
@keyframes vwait{from{background-position:120% 0}to{background-position:-120% 0}}
@media (prefers-reduced-motion:reduce){ .vtext:empty{animation:none} }

/* Parallel reading — a second translation beside the first. The two columns
   are not two blocks of text set next to each other: both are laid into one
   grid and every verse is placed on its own row, so verse 12 on the left and
   verse 12 on the right always stand on the same line. A verse one edition
   does not carry leaves an empty cell instead of pushing the rest out of step.
   The column elements themselves keep no box (`display:contents`) — they stay
   in the DOM only so that a highlight still has one block with a stable
   `data-k` to hang on; see `mkRestore()`. */
.vpair{display:grid;grid-template-columns:1fr 1fr;column-gap:22px;row-gap:6px;align-items:start}
.vpair>.vtext{display:contents}
/* set as running text there is nothing to hold level, so each column goes back
   to being an ordinary block and simply stands beside the other */
.vpair.flow>.vtext{display:block}
.vpair>.vtext>.v{grid-column:1;grid-row:var(--r)}
.vpair>.vtext.alt>.v{grid-column:2}
/* the grid keeps the rows apart — the running margin would only add to it */
.vpair>.vtext .v + .v{margin-top:0}
/* both columns are set exactly alike: a second translation is a translation,
   not a footnote to the first, and greying it made it read as the lesser one.
   The two are told apart by the edition named over each column, nothing else. */
/* the reference line carries the editions too, one over each column: the same
   line already stood there, so naming them costs no height at all */
.vref.pair{display:grid;grid-template-columns:1fr 1fr;column-gap:22px}
/* a note written against a parallel passage belongs to the whole width */
.vpair>.mynote{grid-column:1/-1}

/* The same second translation, where a column has nowhere to stand: hold the
   verse and it comes out under it, let go and it folds. On a phone and on a
   narrow tablet this is the only shape the other edition can take — and
   where the pair is actually on screen the card never opens, because the column
   beside the verse is already the answer (see the guard on `paraPick()`). */
#vpeek{position:fixed;z-index:61;display:none;width:max-content;
  max-width:min(430px,calc(100vw - 20px));padding:10px 14px 12px;border-radius:var(--r-pop);
  background:var(--card);border:1px solid var(--card-line);box-shadow:var(--lift2);
  /* it must never take the touch that is holding the verse underneath it */
  /* it rises into place, the way it now opens: up out of the verse it belongs to */
  pointer-events:none;opacity:0;transform:translateY(6px);
  transition:opacity .16s,transform .22s cubic-bezier(.2,1.1,.4,1)}
#vpeek.on{display:block}
#vpeek.in{opacity:1;transform:none}
/* the edition names itself in the same small capitals as a parallel column */
#vpeek .pv{font-size:9px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;
  color:#adadb2;padding-bottom:5px;margin-bottom:7px;border-bottom:1px solid #eee}
#vpeek .pt{font-family:var(--serif);font-size:16px;line-height:1.5;color:#2b2b2b;
  padding-left:17px;text-indent:-17px}
#vpeek .pn{display:inline-block;min-width:13px;margin-right:4px;text-indent:0;vertical-align:.42em;
  font-weight:700;font-size:11px;color:var(--gray-dk)}
@media (prefers-reduced-motion:reduce){ #vpeek{transition:opacity .16s} }
.q{font-weight:700;font-size:18px;line-height:1.45;text-align:justify;hyphens:auto;margin:0 0 14px;padding-left:26px;text-indent:-26px}
.note{font-family:var(--serif);font-size:18px;line-height:1.52;text-align:justify;hyphens:auto;margin:0 0 16px}
.note i{font-style:italic}
.review{font-weight:700;font-size:18px;line-height:1.45;margin:0 0 14px;padding-left:26px;text-indent:-26px}
/* the "a." / "b." marker owns its own column, so wrapped lines land exactly
   under the first word of the question rather than a few pixels off */
.q .qm,.review .qm{display:inline-block;width:26px;text-indent:0}
/* ——— the letter is the address of the question ———
   A reader points another at one question the way he would in the room: by its
   letter. Pressing it copies the link, and pressing the day of a band copies the
   link to the day. Nothing is added to the sheet for this — the two things that
   already name a place are simply made to answer. */
.q .qm{cursor:pointer}
.sec .day{cursor:pointer}
@media (hover:hover){ .q .qm:hover{color:var(--gray-dk)} .sec .day:hover{filter:brightness(1.16)} }
/* the question a link points at says so, once, and then lets go */
.q.lit{animation:qlit 1.8s ease-out}
@keyframes qlit{from{background:var(--box)}to{background:transparent}}
/* a reference is one word: it never breaks and it is never hyphenated */
.ref{white-space:nowrap;-webkit-hyphens:none;hyphens:none}

/* colophon — takes its accent from whatever colour the bands are wearing */
footer{max-width:820px;margin:0 auto;text-align:center;padding:20px 22px 58px}
.frule{width:230px;height:1px;margin:0 auto 16px;
  background:linear-gradient(90deg,transparent,var(--gray-dk),transparent)}
.fkind{font-size:10px;letter-spacing:2.6px;text-transform:uppercase;color:#b9b9b9;margin-bottom:15px}
.fnote{font-size:12px;line-height:1.75;color:#9c9c9c}
.fset{font-size:11px;letter-spacing:.4px;color:#c2c2c2;margin-top:9px}
footer a{color:#7a7a7a;text-decoration:none;border-bottom:1px solid #e2e2e2;padding-bottom:1px;transition:color .15s,border-color .15s}
footer a:hover{color:var(--gray-dk);border-bottom-color:var(--gray-dk)}

/* a narrow desktop window: the text column is only 640px, so the toolbar has
   to give up a little padding to stay on one line inside it */
@media screen and (min-width:721px) and (max-width:900px){
  .bar-in{gap:10px 6px}
  .lbl{min-width:98px;padding:0 7px;gap:5px}
  .seg .o{padding:6px 9px}
}
/* screen-only: the phone. `screen` keeps the PDF (A4 ≈ 794px) out of these rules. */
@media screen and (max-width:720px){
  body{font-size:16px}

  /* control bar: week row on top, then everything else on one line */
  .bar-in{padding:9px 22px;gap:8px;justify-content:center}
  .wk{flex:0 0 100%;justify-content:space-between;gap:6px}
  .lbl{min-width:0;max-width:calc(100% - 46px);overflow:hidden;text-overflow:ellipsis;padding:0 10px}
  .ar,.tintbtn{flex:none;width:34px;height:34px;font-size:17px}
  .seg .o{padding:6px 11px}
  .tog{padding:7px 12px}
  .pdf{padding:7px 13px}

  .page{padding:calc(30px / var(--z)) calc(22px / var(--z)) calc(44px / var(--z));margin:0}
  /* lesson tag shrinks and the date keeps clear of it */
  .lesson{width:136px;height:96px;top:-30px;right:22px;font-size:17px;letter-spacing:2px;padding-bottom:13px}
  .top{margin-bottom:18px;padding-right:146px;min-height:66px}
  .top .date{font-size:14px;line-height:1.35}
  h1.title{font-size:34px;letter-spacing:-.5px;margin:4px 0 22px}

  /* justified text needs a wide measure — a phone has none, so rag right */
  .mem,.quote,.vtext,.q,.note,.review{text-align:left}
  .mem{padding:16px;margin-bottom:20px;font-size:16px}
  .read{font-size:16px;margin-bottom:20px}
  .read .val{margin-left:0;display:block}
  .quote{font-size:17px;margin-bottom:26px}

  /* section band grows to fit; the title never runs under the day tag */
  .sec{height:auto;min-height:36px;margin:30px 0 18px}
  .sec .t{min-height:36px;font-size:15px;letter-spacing:0;line-height:1.25;padding:8px 104px 8px 12px}
  .q .qm,.review .qm{width:20px}
  .sec .day{font-size:11.5px;padding:0 11px}

  .vgroup{margin:8px 0 14px;padding-left:18px}   /* + 2px rule = the 20px question column */
  .vtext{font-size:15.5px}
  /* no .vpair rules here on purpose: below 1040px the parallel is never
     rendered at all (see PARA_MQ), so there is nothing to lay out */
  .q{font-size:17px;padding-left:20px;text-indent:-20px}
  .note{font-size:16.5px}
  .review{font-size:17px;padding-left:20px;text-indent:-20px}
  footer{padding:6px 18px 36px}
}
@media screen and (max-width:400px){
  .bar-in{padding:9px 18px;gap:6px}
  .ar,.zoom,.tintbtn,.langbtn{width:30px;height:30px;font-size:12px}
  .seg .o{padding:6px 7px;letter-spacing:.3px}
  .tog,.pdf{padding:7px 8px;letter-spacing:.3px}
  .tog.ic,.pdf.ic,.tog.vlines,.langbtn{width:30px;height:30px;padding:0}
  .page{padding:calc(26px / var(--z)) calc(18px / var(--z)) calc(40px / var(--z))}
  .lesson{width:122px;height:88px;right:18px;font-size:15px;letter-spacing:1.5px}
  .top{padding-right:130px;min-height:58px}
  h1.title{font-size:30px}
  .sec .t{font-size:14px;padding-right:96px}
  .sec .day{font-size:11px;padding:0 9px}
}
/* ——— PENCIL MARKS ———
   Everything is drawn as the background of the line itself, never as an overlay:
   the ink then flows with the text, breaks with it across lines and pages, and
   arrives in the PDF exactly as it looks on screen. */
mark{background:none;color:inherit;background-repeat:no-repeat;background-size:100% 100%;
  mix-blend-mode:multiply;-webkit-box-decoration-break:clone;box-decoration-break:clone;
  cursor:pointer;transition:filter .15s}
mark:hover{filter:saturate(1.22)}
/* the stroke that was tapped: the rail's colours and strokes now act on it */
mark.sel{outline:1.5px dashed rgba(0,0,0,.4);outline-offset:1px;border-radius:2px}
@media (prefers-color-scheme:dark){ mark.sel{outline-color:rgba(0,0,0,.55)} }
mark.fill{padding:0;margin:0;background-repeat:no-repeat}
mark.tex{padding:.1em 0 .12em;margin:0;background-size:100% 1.15em;background-position:0 .06em}
/* the ink reaches past the letters only at the true ends of the selection —
   otherwise neighbouring pieces overlap and a dirty seam shows in the middle */
mark.ps{padding-left:.3em;margin-left:-.3em}
mark.pe{padding-right:.3em;margin-right:-.3em}
/* куски одного мазка встают встык: перекрытие давало бы тёмную зарубку на
   стыке, а разрыв — белую щель. Обычно куска и вовсе один — см. mkWhole() */
mark.fill:not(.ps),mark.tex:not(.ps){margin-left:0;padding-left:0}
mark.fill:not(.pe),mark.tex:not(.pe){margin-right:0;padding-right:0}
/* an underline must not move a letter: side padding on an inline box pushes
   the text along, so there is none — only the room under the baseline, which
   costs the line nothing */
mark.line,mark.wave{mix-blend-mode:normal;padding:0 0 .26em;margin:0;background-position:0 100%}
mark.line{background-size:100% .48em}
mark.wave{background-size:auto .42em;background-repeat:repeat-x}

/* ——— what the reader wrote: another colour, another face, its own label ——— */
.myins{font-family:var(--sans);font-size:.93em;font-style:normal;color:var(--mine);
  background:rgba(47,91,208,.08);border-bottom:1.5px dotted rgba(47,91,208,.55);border-radius:3px;
  padding:.02em .3em;margin:0 .08em;-webkit-box-decoration-break:clone;box-decoration-break:clone;
  outline:none;text-indent:0}
.myins:empty::before{content:"…";opacity:.5}
.myins .del{display:inline-block;margin-left:.35em;width:1.15em;height:1.15em;line-height:1.05em;text-align:center;
  border-radius:50%;background:rgba(47,91,208,.16);color:var(--mine);font-size:.82em;cursor:pointer;user-select:none;
  vertical-align:.05em}
.myins .del:hover{background:var(--mine);color:var(--onacc)}
.myins:focus{background:rgba(47,91,208,.13);box-shadow:0 0 0 2px rgba(47,91,208,.18)}
/* the reader's own block: rounded on every corner, with its own colour and a
   bar of the same shape down the side */
.mynote{position:relative;margin:14px 0 18px;padding:12px 16px 10px;text-indent:0;
  background:var(--nbg,rgba(47,91,208,.10));border-radius:12px;
  font-family:var(--sans);font-size:15.5px;line-height:1.55;color:#22304e;outline:none;text-align:left;
  transition:background .16s}
/* The corner belongs to the cross, so the text is not allowed into it: an empty
   float in the top right ends the first line early and lets every line under it
   run the full width. Without this the cross sits on the first words. */
.mynote::before{content:"";float:right;width:30px;height:22px}
.mynote b,.mynote strong{font-weight:700}
.mynote i,.mynote em{font-style:italic}
/* the rule sits a little below the letters, clear of the descenders */
.mynote u{text-decoration:underline;text-underline-offset:2.5px;text-decoration-thickness:1px}
/* a quotation inside your own note is set the way the lesson sets its quotes:
   the serif face, a rule of your colour down the side */
.mynote blockquote{position:relative;margin:9px 0 9px 2px;padding-left:14px;
  font-family:var(--serif);font-size:16.5px;line-height:1.5}
.mynote blockquote::before{content:"";position:absolute;left:0;top:2px;bottom:2px;width:2px;
  border-radius:2px;background:var(--nc,var(--mine));opacity:.4}
.mynote blockquote i,.mynote blockquote em{font-style:italic}
/* Bold · italic · underline · quotation. The bar belongs to the page, not to a
   note: standing free it takes no height from the note, does not move when it
   comes and goes, and is in reach whatever part of a long note is being
   written. It only appears while something of the reader's own has the caret. */
.fmtbar{position:fixed;left:50%;bottom:12px;z-index:64;display:flex;gap:3px;padding:5px 7px;
  transform:translateX(-50%) translateY(6px);opacity:0;pointer-events:none;
  background:var(--mat);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border-radius:var(--r-pop);box-shadow:0 0 0 .5px var(--hair),var(--lift2);
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;
  transition:opacity .16s,transform .22s cubic-bezier(.2,1.2,.4,1)}
.fmtbar[hidden]{display:none}
.fmtbar.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
.fmtbar span{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-size:15px;font-family:var(--serif);line-height:1;color:#3a3a3f;cursor:pointer;
  transition:background .14s,color .14s}
@media (hover:hover){ .fmtbar span:hover{background:rgba(120,120,128,.16);color:#1c1c1e} }
.fmtbar span.on{background:var(--on);color:var(--on-t)}
.fmtbar .b{font-weight:700}
.fmtbar .i{font-style:italic}
.fmtbar .u{text-decoration:underline;text-underline-offset:2px}
@media (pointer:coarse){ .fmtbar span{width:40px;height:40px;font-size:17px} }
/* ——— the sheet is always a sheet ———
   These panels used to turn dark with the system, and the page they float over
   never does: paper is paper at every hour. The result was a black slab lying on
   a white lesson, which is what the system setting was trying to prevent. They
   are cut from the page's own glass now, in the light and in the dark alike. */
@media (prefers-reduced-motion:reduce){ .fmtbar{transition:opacity .16s} }
/* a note stored before the bar moved out may still carry one of its own: it is
   not part of the note's text and must never show */
.mynote .fmt,.mynote .foot{display:none}
/* the invitation stands exactly where the first letter will go, not on a line
   of its own below — it is what the caret is sitting on */
.mynote.blank::after{content:attr(data-ph);position:absolute;left:16px;top:12px;
  color:#9aa7c4;pointer-events:none}
/* A note looks the same whether it is being written in or finished: no line
   around it in any state, and no halo either. The caret is signal enough that
   it is open; a frame that comes and goes only makes the page restless. */
/* ——— the cross says what it does ——— */
.mynote .del{position:absolute;top:7px;right:9px;width:24px;height:24px;border-radius:8px;cursor:pointer;
  display:none;align-items:center;justify-content:center;line-height:1;font-size:15px;
  color:var(--nc,var(--mine));opacity:.5;transition:color .16s,background .16s,opacity .16s}
/* Where a pointer can hover — a mouse, or an Apple Pencil held above the glass —
   the cross comes out, and taking aim at it turns the whole note red: what is
   about to go is shown, not only the button that would do it.
   `any-hover`, not `hover`: on an iPad with a Pencil `hover:hover` is false. */
@media (any-hover:hover){
  .mynote:hover .del{display:flex}
  .mynote .del:hover{opacity:1;color:#fff;background:var(--warn)}
  .mynote:has(.del:hover){background:var(--warnbg)}
}
/* a finger has no hover, so there the cross comes with the note being opened */
.mynote:focus .del,.mynote:focus-within .del{display:flex}
.mynote .del:active{opacity:1;color:#fff;background:var(--warn)}
@media (prefers-reduced-motion:reduce){ .mynote,.mynote .del{transition:none} }
.legend{display:none}

/* one tap and the room is empty: the rail slides out to the left, the bar
   lifts away, and nothing but the lesson is left on the screen */
.bar{transition:transform .3s cubic-bezier(.3,.9,.3,1),opacity .22s}
.rail{transition:opacity .22s,transform .3s cubic-bezier(.3,.9,.3,1)}
body.bare .bar{transform:translateY(-110%);opacity:0;pointer-events:none}
/* `writing` goes the same way as `bare`, and for the same reason: while the
   reader is putting down his own words nothing else belongs on the screen.
   On a phone this is what keeps the strip of days off the note when the
   keyboard is up and the visible half of the screen is all there is. */
body.bare .rail,body.writing .rail{opacity:0;pointer-events:none;
  transform:var(--raily,translateY(-50%)) translateX(calc(-100% - 22px))}
@media (max-width:700px){ body.bare .rail,body.writing .rail{transform:translate(calc(-100% - 14px),-50%)} }

/* ——— THE RAIL ———
   The tools stand beside the sheet and stay there. What is in hand is visible
   at a glance, nothing has to pop up to be found, and nothing closes after a
   click: take a marker, run through the lesson, put it back. */
.rail{position:fixed;top:var(--railtop,50%);bottom:var(--railbot,auto);
  transform:var(--raily,translateY(-50%));z-index:60;
  /* it keeps to the left margin: outside the sheet where there is room, and
     over the sheet's own white edge on a tablet — never over the text */
  left:max(10px,calc((100vw - 900px) / 2));
  display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 7px;
  background:var(--matl);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border-radius:var(--r-tool);box-shadow:0 0 0 .5px var(--hair),var(--lift1);
  transition:opacity .2s}
/* ——— it comes when it is called ———
   Standing in the margin all day, the rail was the darkest thing on a bright
   page: the eye found it before it found a word, and a tool nobody asked for
   was guarding the lesson. Now the margin is empty while reading, and the rail
   answers one question only: something has been chosen on the page. It used to
   answer the margin as well — the pointer crossing into its lane called it out —
   and that turned every trip to the left of the sheet into a light going on for
   no reason. A tool is wanted when there is something to use it on.
   After a mark it lingers a moment, long enough to change the colour or put the
   tool down; that is not a second trigger but the same one letting go slowly.
   A phone never sees this rule: there the rail is a drawer behind a tab (see the
   narrow block below) and is off screen already. */
/* ——— on a desktop it waits at the foot of the margin ———
   The reading starts at the top of the sheet and travels down it; a tool level
   with the middle of the text stands in the way of that. At the foot of the
   margin it is out of the reading and still one movement away. A narrow screen
   keeps it in the middle — there the margin is short, and the middle is the only
   place it fits. */
@media (min-width:1011px){ :root{--railtop:auto;--railbot:22px;--raily:translateY(0)} }
@media (min-width:701px){
  .rail{opacity:0;pointer-events:none;transform:var(--raily,translateY(-50%)) translateX(-7px);
    transition:opacity .18s ease,transform .24s cubic-bezier(.25,1.1,.35,1)}
  body.railcall:not(.bare):not(.writing) .rail{opacity:1;pointer-events:auto;transform:var(--raily,translateY(-50%))}
}
.rail .sep{width:24px;height:.5px;background:var(--hair);margin:2px 0}
.rail .two{display:grid;grid-template-columns:repeat(2,30px);gap:4px}
.rbtn{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:9px;
  color:#5b5b60;cursor:pointer;transition:background .16s,color .16s,transform .12s}
@media (hover:hover){ .rbtn:hover{background:rgba(120,120,128,.16);color:#1c1c1e} }
.rbtn:active{transform:scale(.92)}
.rbtn:focus,.mtool:focus,.ink:focus,.dchip:focus{outline:none}
.rbtn.on{background:var(--on);color:var(--on-t)}
.rbtn.own.on{background:var(--mine);color:var(--onacc)}
.rbtn svg{display:block}
.inks{display:grid;grid-template-columns:repeat(2,22px);gap:6px;justify-content:center}
.ink{position:relative;width:22px;height:22px;border-radius:50%;cursor:pointer;flex:none;
  box-shadow:inset 0 0 0 .5px rgba(0,0,0,.14),inset 0 -3px 5px rgba(0,0,0,.06),inset 0 3px 4px rgba(255,255,255,.5);
  transition:transform .16s cubic-bezier(.3,1.4,.4,1),box-shadow .16s}
@media (hover:hover){ .ink:hover{transform:scale(1.14)} }
.ink:active{transform:scale(.94)}
.ink.on{box-shadow:inset 0 0 0 .5px rgba(0,0,0,.14),0 0 0 2px var(--on)}
/* a pinned ink keeps its place: the row may reshuffle around it, it will not */
.ink.pin::after{content:"";position:absolute;left:50%;bottom:-1px;transform:translateX(-50%);
  width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
.ink.more{background:conic-gradient(from .5turn,#ff6b6b,#ffb35c,#ffe066,#8fe08f,#7fc8f8,#b39ddb,#f48fb1,#ff6b6b)}

/* the gamut opens beside the rail, in the same block — never as a window */
.rpick{position:absolute;left:calc(100% + 9px);top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;gap:7px;padding:9px;
  background:var(--mat);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border-radius:var(--r-pop);box-shadow:0 0 0 .5px var(--hair),var(--lift2)}
.rpick[hidden]{display:none}
.area{position:relative;width:190px;height:110px;border-radius:9px;cursor:crosshair;
  box-shadow:inset 0 0 0 .5px rgba(0,0,0,.18)}
.hue{position:relative;width:190px;height:14px;border-radius:7px;cursor:pointer;
  background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);
  box-shadow:inset 0 0 0 .5px rgba(0,0,0,.18)}
.area .dot,.hue .dot{position:absolute;width:13px;height:13px;border-radius:50%;border:2px solid #fff;
  box-shadow:0 0 0 1px rgba(0,0,0,.35),0 1px 3px rgba(0,0,0,.3);transform:translate(-50%,-50%);pointer-events:none}
.hue .dot{top:50%}

/* ——— the days of the lesson, down the right edge ———
   A lesson is seven days long; this is the thread you pull to get to any of
   them, and it says which one you are reading now.
   `days` is a LAYER name: everything under it is torn out of the page and made
   to float. Nothing inside a panel may carry it — the calendar's own week is
   `dcells` for exactly that reason. */
.days{position:fixed;right:max(10px,calc((100vw - 900px) / 2));top:50%;transform:translateY(-50%);
  z-index:59;display:flex;flex-direction:column;gap:3px;padding:6px;
  background:var(--matl);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border-radius:var(--r-pill);box-shadow:0 0 0 .5px var(--hair),var(--lift1);
  transition:opacity .22s,transform .3s cubic-bezier(.3,.9,.3,1)}
.days:empty{display:none}
/* the panel itself never reacts: no grey flash from the system's tap
   highlight, no accidental selection of the day letters — only the drop moves */
.days,.rail,.bub,.rpick,.hintchip,.caretbtn,.mtoast{
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;-moz-user-select:none;user-select:none;
  -webkit-touch-callout:none}
.days *,.rail *{-webkit-tap-highlight-color:transparent}
/* the band you jumped to answers with a shine, so the eye lands on it */
.sec.flash{overflow:hidden}
.sec.flash::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(100deg,transparent 22%,rgba(255,255,255,.6) 46%,transparent 68%);
  transform:translateX(-110%);animation:secsweep .9s cubic-bezier(.3,.7,.3,1)}
@keyframes secsweep{to{transform:translateX(110%)}}
@media (prefers-reduced-motion:reduce){
  .days .dpill{transition:none} .sec.flash::after{display:none}
}
/* The mark moves and changes shape at the same time, and the two are kept
   apart: the outer layer only travels, the inner one only stretches. One
   transform cannot be transitioned and animated at once. */
.days .dpill{position:absolute;left:6px;top:6px;width:30px;height:30px;opacity:0;pointer-events:none;
  transition:transform .52s cubic-bezier(.22,.9,.25,1),opacity .2s}
.days .dpill b{display:block;width:100%;height:100%;border-radius:50%;background:var(--gray-dk);
  transform-origin:50% 50%}
.days .dpill.go b{animation:dropv .56s cubic-bezier(.3,.75,.25,1)}
.days.row .dpill.go b{animation-name:droph}
@keyframes dropv{
  0%{transform:scale(1,1)}
  22%{transform:scale(.78,1.32);border-radius:50% 50% 46% 46%/60% 60% 40% 40%}
  55%{transform:scale(.94,1.12)}
  78%{transform:scale(1.12,.9)}
  100%{transform:scale(1,1)}}
@keyframes droph{
  0%{transform:scale(1,1)}
  22%{transform:scale(1.32,.78);border-radius:46% 46% 46% 46%/50% 50% 50% 50%}
  55%{transform:scale(1.12,.94)}
  78%{transform:scale(.9,1.12)}
  100%{transform:scale(1,1)}}
@media (prefers-reduced-motion:reduce){
  .days .dpill{transition:none} .days .dpill.go b{animation:none}
}
.days.ready .dpill{opacity:1}
.dchip{position:relative;z-index:1;width:30px;height:30px;display:flex;align-items:center;justify-content:center;
  border-radius:50%;cursor:pointer;font-size:10.5px;font-weight:700;letter-spacing:.2px;
  color:#8a8a8e;text-transform:uppercase;transition:color .16s,background .16s}
@media (hover:hover){ .dchip:hover{background:rgba(120,120,128,.14);color:#2b2b2b} }
.dchip.on{color:var(--onacc)}
body.bare .days,body.writing .days{opacity:0;pointer-events:none;transform:translateY(-50%) translateX(calc(100% + 22px))}
@media (max-width:1010px){ .days{right:8px} }
/* the phone rules for the strip live in one place, further down with the rest
   of the phone layout — a second copy here only argued with it */
@media (pointer:coarse){ .dchip,.days .dpill{width:36px;height:36px} .dchip{font-size:11.5px} }

/* ——— the quarter, standing beside the sheet ———
   Not a panel. A panel has an edge, a floor and a lid, and all three say "this
   is another surface" — the list is meant to lie in the white the window leaves
   beside the booklet, the way the strip of days already does, close enough to
   the page to belong to it.
   The days and this cannot both have that margin, and they should not: the days
   move inside one lesson, the list moves between them. So the list takes the
   margin while it is open and gives it back when it closes. One thing at a time
   in the space beside the page.
   Wide windows have margin enough to hold it without touching the sheet.
   Narrower ones do not, so there it lies over the page on a white ground, and
   the scrim says the lesson is not the thing being used. */
/* Anchored to the sheet, not to the window: half the page is 410px, the list is
   246 and wants 20 of air, so it stands 676 in from the middle. Measuring from
   the window edge instead is what put it on top of the text — the sheet is
   centred, and its margin is not the window's margin.
   The ground is always white. Beside the page it is invisible against the paper;
   over the page it is what keeps the lines from showing through. */
.outline{position:fixed;z-index:62;right:max(10px,calc(50vw - 776px));
  top:calc(var(--barh,67px) + 14px);width:296px;max-height:calc(100dvh - var(--barh,67px) - 26px);
  display:flex;flex-direction:column;
  /* No ground of its own: the list lies on the same paper as the lesson, and a
     panel tone over a paper texture reads as a card laid on the sheet. It takes
     a ground only where it has to cover the text — see the narrow rule below. */
  background:none;
  opacity:0;pointer-events:none;transform:translateX(14px);
  transition:opacity .24s,transform .3s cubic-bezier(.3,.9,.3,1)}
body.outlineon .outline{opacity:1;pointer-events:auto;transform:none}

/* The quarter's name, centred over its own lessons, with the quarters either
   side a step away. The arrows are set in the lesson's own serif and given room
   to stand in — pressed against the edge they read as scroll hints rather than
   as something to press. */
.outhead{flex:none;padding:2px 4px 6px;display:flex;align-items:center;gap:4px}
.outhead b{flex:1;min-width:0;text-align:center;
  font-family:var(--serif);font-size:15px;font-weight:700;line-height:1.3;color:var(--gray-dk)}
.outhead .oarr{flex:none;width:26px;height:26px;display:flex;align-items:center;
  justify-content:center;font-family:var(--serif);font-size:19px;line-height:1;
  color:var(--quiet);cursor:pointer;user-select:none;transition:color .15s}
.outhead .oarr:hover{color:var(--gray-dk)}
.outsub{flex:none;padding:0 6px 10px;text-align:center;
  font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.outlist{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-bottom:6px}

/* Number and text on one rhythm: the digit stands the height of both lines, so
   the column reads as a row and not as a figure with a caption. */
/* In the lesson's own ink. The blue came from the official site and stayed blue
   while the sheet turned to forest or gold — a list beside the lesson has to be
   made of the same colour, or it reads as a window onto somebody else's page.
   Distance is given by weight and opacity, never by a second hue. */
.oitem{display:grid;grid-template-columns:2.1rem 1fr;align-items:stretch;gap:1px;
  padding:4px 6px;cursor:pointer;opacity:.72;transition:background .18s,opacity .18s}
@media (hover:hover){ .oitem:hover{background:rgba(120,120,128,.08);opacity:1} }
.oitem .ono{display:flex;align-items:center;justify-content:center;
  font-size:1.6rem;font-weight:800;line-height:1;color:var(--quiet);transition:color .18s}
/* two lines and no more — a title that runs on pushes the quarter off screen */
.oitem .otitle{font-size:12.5px;font-weight:700;line-height:1.3;color:var(--gray-dk);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.oitem .odate{font-size:10.5px;line-height:1.3;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oitem.on .ono{color:var(--gray-dk)}
.oitem.on{background:var(--box);opacity:1}
/* the offering Sabbath carries a mark instead of a number — it is not a lesson
   and must not be counted as one */
.oitem.gift .ono{display:flex;align-items:center;justify-content:center;color:var(--gold)}
.oitem.gift .otitle{font-weight:600;color:var(--gold-d)}
.outmsg{padding:10px 6px;font-size:12px;color:var(--muted)}

/* the button that calls it, matching the gear it stands beside */
.bar-in .lbl{margin-right:auto}
.bar-in .outbtn+.gear{margin-left:8px}
.outbtn{flex:none;width:34px;height:34px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--ctl-line);border-radius:10px;background:var(--ctl);color:var(--ctl-t);cursor:pointer;
  user-select:none;transition:background .15s,color .15s,border-color .15s}
.outbtn:hover{border-color:var(--ctl-line2);color:var(--ctl-t2)}
body.outlineon .outbtn{background:var(--on);border-color:var(--on);color:var(--on-t)}

/* The strip is fixed to the sheet, so it does not move because a different
   panel opened: the list stands outside it and nothing needs to shuffle. A
   thing that jumps when something unrelated happens teaches the eye to distrust
   its position. */

/* Below this the margin is too narrow to hold the list clear of the sheet, so
   it lies over the page instead — on its own white ground, with the scrim. */
/* Below this the sheet reaches the list, so it stops standing beside the page
   and starts lying on it — which needs an edge and a scrim, and nothing else. */
@media (max-width:1560px){
  body.outlineon .days,body.setopen .days{opacity:0;pointer-events:none}
  .outline{right:10px;padding:14px 8px 4px;background:var(--paper-tone,#fff);
    box-shadow:-14px 0 34px rgba(0,0,0,.10)}
  .outhead,.outsub{padding-left:8px;padding-right:8px}
  /* the settings reach the sheet at the same width the list does, and cover the
     text the same way — so here, and only here, they take a ground */
  .setpop{right:10px;padding:6px 8px;background:var(--paper-tone,#fff);
    box-shadow:-14px 0 34px rgba(0,0,0,.10)}
}
@media (min-width:1561px){ .outscrim{display:none} }
.outscrim{position:fixed;inset:0;z-index:61;background:rgba(0,0,0,.22);
  opacity:0;pointer-events:none;transition:opacity .28s}
body.outlineon .outscrim{opacity:1;pointer-events:auto}
/* nothing stands beside the lesson while a tool is in hand or the page is bare */
body.bare .outline,body.writing .outline{opacity:0;pointer-events:none}
body.bare .outscrim,body.writing .outscrim{opacity:0;pointer-events:none}


/* ——— the reading, when there is one ———
   The button is not drawn unless a file is actually there: an empty player is
   a promise the page cannot keep, and every quarter that has no recording would
   otherwise carry a dead control. The file is asked for once per lesson; if it
   answers, the bar appears.
   `audioTimes` in the quarter file marks where each day of the lesson begins, so
   the strip of days doubles as the chapter list — pressing a day moves the
   recording to it. */
/* Mirrors the list of lessons: that one lies in the margin to the right of the
   sheet, this one in the margin to the left, both set the same distance in from
   the middle. A bar across the bottom would have cut the page off from the
   window; standing beside the sheet it belongs to the page instead.
   The pencil rail owns that margin when it is out, so the player steps aside
   for it rather than sitting underneath. */
/* ——— the reading, in the margin opposite the lessons ———
   No card. The list of lessons lies on the paper to the right; this lies on the
   same paper to the left, and a panel tone under either would make it furniture
   standing on the sheet rather than something belonging to it.
   Both are the same width and stand the same distance in from the middle, so
   the sheet sits between two equal margins instead of being pushed off centre
   by whichever side happened to be wider. */
.aud{position:fixed;left:max(10px,calc(50vw - 776px));top:calc(var(--barh,67px) + 14px);
  z-index:64;width:296px;display:flex;flex-direction:column;
  opacity:0;pointer-events:none;transform:translateX(-14px);
  transition:opacity .22s,transform .3s cubic-bezier(.3,.9,.3,1)}
body.audon .aud{opacity:1;pointer-events:auto;transform:none}
body.railout .aud{left:calc(var(--railw,106px) + 16px)}
body.bare .aud,body.writing .aud{opacity:0;pointer-events:none}
/* ——— and where the margin runs out, the reading steps out ———
   The player is the list's mirror: the same 296px, the same distance in from
   the middle, only on the other side. So the same width defeats it — below this
   the left margin cannot hold it clear of the sheet, and it was lying across the
   lesson. The list may take a ground and cover the text, because covering the
   text is exactly what a reader asks a list of lessons to do while he picks one
   from it. Nobody asks that of a player, so it goes away instead.
   This has to stand after the rule above and not with the other narrow-window
   rules further up: `.aud` sets `display:flex` there, a media query lends no
   specificity of its own, and the later of two equal rules is the one that
   wins. */
@media (max-width:1560px){ .aud{display:none} }

/* The lesson names the whole reading, the way a record is named over its
   tracks. What is playing is shown by the mark in the list, not by repeating
   its name here — the same words twice in a panel this small read as a fault. */
/* ——— what is playing, said once and properly ———
   The panel used to carry the name of the lesson, which the sheet and the
   quarter already say twice over. What it could not say was the one thing only
   it knows: which part is sounding now. So the small line names the reading and
   the place in it, and the large line names the part. */
.ahd{padding:0 2px 11px}
.akick{font-size:9.5px;letter-spacing:.085em;text-transform:uppercase;color:#8f8f97;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
.alabel{font-family:var(--serif);font-size:15px;font-weight:700;line-height:1.28;
  color:var(--gray-dk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* the three that move the reading stand together in the middle; the two that
   only say how it should behave keep to the edges */
.arow{position:relative;display:flex;align-items:center;justify-content:center;gap:13px;padding:2px 2px 0}
.aflow{position:absolute;left:1px;width:24px;height:24px;display:flex;align-items:center;
  justify-content:center;color:#c2c2cb;cursor:pointer;user-select:none;transition:color .15s}
.aflow.on{color:var(--gray-dk)}
@media (hover:hover){ .aflow:hover{color:#8a8a92} .aflow.on:hover{color:var(--gray-dk)} }
/* it carries the page along with it, and there is no page to carry on a phone */
@media (max-width:1010px),(hover:none){ .aflow{display:none} }
/* A filled navy disc was the loudest thing on the page, next to a lesson set in
   quiet type. The mark alone is enough: the ring appears under the hand, and
   the shape says what it does without shouting it. */
/* A filled disc was the loudest thing on a page of quiet type; no shape at all
   left nothing to press. A ring is the middle: the form is there to be seen,
   and it fills only under the hand. */
.aplay{flex:none;width:40px;height:40px;display:flex;align-items:center;justify-content:center;
  border-radius:50%;background:none;color:var(--gray-dk);cursor:pointer;user-select:none;
  box-shadow:inset 0 0 0 1px var(--quiet);
  transition:background .16s,box-shadow .16s,color .16s,transform .1s}
@media (hover:hover){ .aplay:hover{background:var(--gray-dk);color:var(--onacc);
  box-shadow:inset 0 0 0 1px var(--gray-dk)} }
.aplay:active{transform:scale(.94)}
/* the three are one family: the same circle, the middle one larger because it
   is the one pressed most */
.astep{flex:none;width:30px;height:30px;display:flex;align-items:center;justify-content:center;
  border-radius:50%;color:#7e7e86;cursor:pointer;user-select:none;
  box-shadow:inset 0 0 0 1px var(--hair);
  transition:color .15s,background .15s,box-shadow .15s,transform .1s}
.astep:active{transform:scale(.94)}
@media (hover:hover){ .astep:hover{color:var(--gray-dk);box-shadow:inset 0 0 0 1px var(--quiet)} }
.astep:hover{color:var(--gray-dk)}

/* the chevron turns as the list comes down, so the control shows its own state */
.atoggle{position:absolute;right:1px;width:24px;height:24px;display:flex;align-items:center;
  justify-content:center;color:var(--quiet);cursor:pointer;user-select:none;
  transition:color .15s,transform .3s cubic-bezier(.25,1.1,.35,1)}
.atoggle:hover{color:var(--gray-dk)}
.atoggle.on{color:var(--gray-dk);transform:rotate(180deg)}

/* ——— the line that is a track, not a rule ———
   Two grey pixels across the panel read as a divider until something plays, and
   a divider is not something anyone thinks to press. Rounded, a shade thicker,
   with a head that comes out under the hand, it says what it is while still at
   nought. The head is drawn from the same navy as the filled part, so the whole
   thing is one object and not a bar with a dot on it. */
.aseek{position:relative;margin:0 2px;height:3px;border-radius:2px;
  background:rgba(120,120,128,.20);cursor:pointer}
.aseek::before{content:"";position:absolute;inset:-10px 0}   /* нажимать удобно, видно тонко */
.aseek i{display:block;height:100%;width:0;border-radius:2px;background:var(--gray-dk);
  transition:width .12s linear}
.aseek b{position:absolute;top:50%;left:0;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;
  border-radius:50%;background:var(--gray-dk);opacity:0;pointer-events:none;
  transition:opacity .16s}
.aud:hover .aseek b{opacity:1}
.atimes{display:flex;justify-content:space-between;padding:7px 3px 2px;
  font-size:10.5px;font-variant-numeric:tabular-nums;color:#7e7e86}

/* The parts, numbered straight through the way any player lists a record. The
   first attempt set them as lettered marks under each day — compact, and
   nobody would have known what to do with it. A track list is understood on
   sight, and that is worth more here than cleverness. */
/* It unrolls rather than appearing: the height is animated, so the panel grows
   downward and the eye follows it instead of being handed a new block. */
.alist{max-height:0;overflow:hidden;opacity:0;
  transition:max-height .34s cubic-bezier(.25,1.1,.35,1),opacity .24s,
             margin-top .34s cubic-bezier(.25,1.1,.35,1),padding-top .34s}
/* ——— opened means opened ———
   Three hundred and twenty pixels was a number, not a reason: a lesson of
   thirteen parts spent most of its list behind a scrollbar while half the
   margin stood empty beside it. The list now stops where the window stops and
   nowhere earlier, so on any ordinary screen the whole reading is in sight at
   once, and only a short window makes it scroll. */
.alist.open{max-height:calc(100dvh - var(--barh,67px) - 180px);overflow-y:auto;overscroll-behavior:contain;
  opacity:1;margin-top:13px;padding-top:9px;border-top:1px solid var(--hair)}
/* ——— the list reads as the lesson reads ———
   Every part used to repeat the name of its day: "Teilhaber der Gnade · a",
   "· b", "· c" — three lines saying the same thing and none of them saying what
   the part is about. The day now stands once, over its own parts, and each part
   carries the question it actually reads. Choosing by the question is the only
   way anyone ever chooses. */
.ahead{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:#8f8f97;
  padding:12px 5px 3px;line-height:1.3}
.alist > .ahead:first-child{padding-top:1px}
/* ——— one line to a part ———
   The question set in full turned the list into a wall of text, and a list you
   have to read is not a list. One line and the rest in an ellipsis: enough to
   know which question it is, short enough to take in at a glance, with the
   length of the part where the eye expects it — at the right edge. */
.atrk{display:flex;align-items:center;gap:9px;padding:4px 5px;cursor:pointer;border-radius:7px;
  font-size:12.5px;color:#54545b;transition:color .15s,background .15s}
@media (hover:hover){ .atrk:hover{background:rgba(120,120,128,.07);color:#2b2b2b} }
@media (hover:hover){ .atrk:hover{background:rgba(120,120,128,.08);color:var(--gray-dk)} }
.atrk .anum{flex:none;width:12px;text-align:center;font-size:11px;font-weight:700;
  color:#8f8f97}
.atrk .atit{flex:1;min-width:0;line-height:1.35;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.atrk .adur{flex:none;font-size:10.5px;font-variant-numeric:tabular-nums;color:#8f8f97}
.atrk.on .adur{color:var(--gray-dk)}
.atrk.on{color:var(--gray-dk);font-weight:700}
.atrk.on .anum{color:var(--gray-dk)}
/* the one playing carries the mark instead of its number */
.atrk.on .anum svg{display:block;margin:0 auto}

/* one thin line at the top edge for as long as anything is being fetched: the
   only honest answer to "is it working or is it stuck" */
#load{position:fixed;left:0;right:0;top:0;height:2px;z-index:75;overflow:hidden;
  pointer-events:none;opacity:0;transition:opacity .25s}
body.loading #load{opacity:1}
#load i{display:block;width:38%;height:100%;border-radius:0 2px 2px 0;
  background:var(--gray-dk);animation:loadrun 1.15s cubic-bezier(.5,0,.5,1) infinite}
@keyframes loadrun{from{transform:translateX(-100%)}to{transform:translateX(365%)}}
@media print{ #load{display:none} }

/* the quiet invitation: shown a few times, never again after that */
.hintchip{position:absolute;z-index:61;display:none;align-items:center;gap:6px;
  padding:7px 12px;border-radius:var(--r-pill);cursor:pointer;
  font-size:12.5px;font-weight:700;letter-spacing:.2px;color:#fff;background:rgba(28,28,30,.92);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--lift1);
  animation:hintin .22s cubic-bezier(.2,1.4,.4,1)}
.hintchip.on{display:flex}
@keyframes hintin{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* the ends of a stroke can be taken and pulled: two knobs, the way a phone
   offers them for text */
.grip{position:fixed;z-index:63;display:none;width:15px;height:15px;border-radius:50%;
  background:var(--gray-dk);box-shadow:0 0 0 2px var(--paper-tone),0 2px 6px rgba(0,0,0,.3);
  cursor:ew-resize;touch-action:none;-webkit-tap-highlight-color:transparent}
.grip.on{display:block}
.grip::after{content:"";position:absolute;left:50%;width:2px;transform:translateX(-50%);
  background:var(--gray-dk);border-radius:1px}
.grip.s::after{bottom:100%;height:var(--gh,18px)}
.grip.e::after{top:100%;height:var(--gh,18px)}
@media (pointer:coarse){ .grip{width:19px;height:19px} }

/* ——— the bubble on a stroke already laid down ——— */
.bub{position:fixed;z-index:62;display:flex;align-items:center;gap:5px;padding:5px 6px;
  background:var(--mat);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border-radius:var(--r-pop);box-shadow:0 0 0 .5px var(--hair),var(--lift2);
  opacity:0;transform:scale(.92) translateY(3px);pointer-events:none;transform-origin:50% 0;
  transition:opacity .14s,transform .2s cubic-bezier(.2,1.4,.4,1)}
.bub.on{opacity:1;transform:none;pointer-events:auto}
.bub .mhair{width:.5px;height:20px;background:var(--hair);margin:0 2px}
.mtool{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:8px;
  color:#5b5b60;cursor:pointer;transition:background .16s,color .16s,transform .12s}
@media (hover:hover){ .mtool:hover{background:rgba(120,120,128,.16);color:#1c1c1e} }
.mtool:active{transform:scale(.92)}
.mtool.own{color:var(--mine)}

/* the toast stands above whatever is already pinned to the bottom edge, so it
   and the strip of days never land in the same place */
.mtoast{position:fixed;left:50%;bottom:calc(var(--gut-b,0px) + 24px);transform:translateX(-50%) translateY(8px);opacity:0;z-index:70;
  background:rgba(28,28,30,.92);color:#fff;font-size:12.5px;padding:9px 16px;border-radius:12px;pointer-events:none;
  transition:opacity .2s,transform .3s cubic-bezier(.2,1.3,.4,1)}
.mtoast.on{opacity:1;transform:translateX(-50%)}
.mtoast b{margin-left:14px;padding-left:14px;border-left:.5px solid rgba(255,255,255,.25);
  color:#8fb8ff;cursor:pointer;pointer-events:auto;font-weight:700}
.mtoast b:hover{color:#fff}

/* шпаргалка: всё, что можно нажать, одним списком */
.keysback{position:fixed;inset:0;z-index:78;background:rgba(20,20,22,.28);
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.keysback[hidden],.keyspop[hidden]{display:none}
.keyspop{position:fixed;z-index:79;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(420px,calc(100vw - 32px));max-height:min(80vh,640px);overflow:auto;padding:18px 20px 16px;
  background:var(--mat);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border-radius:var(--r-tool);box-shadow:0 0 0 .5px var(--hair),var(--lift3)}
.keyspop h4{font-size:13px;font-weight:700;letter-spacing:.3px;color:#1c1c1e;margin-bottom:12px}
.keyspop .cap{font-size:9px;letter-spacing:1.2px;text-transform:uppercase;color:#8a8a8e;margin:15px 0 7px}
.krow{display:flex;align-items:flex-start;gap:11px;padding:5px 0}
.krow kbd{flex:none;min-width:46px;text-align:center;font-family:var(--sans);font-size:11.5px;font-weight:700;
  color:#3a3a3c;background:rgba(120,120,128,.14);border-radius:7px;padding:5px 7px;line-height:1.1}
.krow span{font-size:13px;line-height:1.4;color:#4a4a4e;padding-top:3px}
/* ——— a finger, not a mouse ———
   On a tablet the lesson is read at arm's length and marked with the thumb, so
   every target grows. Where the sheet leaves no gutter — a phone — the rail
   lies down along the bottom edge instead of standing beside the page. */
@media (pointer:coarse){
  .page{-webkit-touch-callout:none}
  .rail{left:10px;padding:9px 8px;gap:6px;border-radius:22px}
  .rail .two{grid-template-columns:repeat(2,38px);gap:5px}
  .rbtn{width:38px;height:38px;border-radius:11px}
  .hand{width:42px;height:42px}
  .inks{grid-template-columns:repeat(2,28px);gap:7px}
  .ink{width:28px;height:28px}
  .mtool{width:38px;height:38px;border-radius:11px}
  .area{width:min(260px,66vw);height:130px} .hue{width:min(260px,66vw);height:20px}
  .area .dot,.hue .dot{width:17px;height:17px}
  /* a finger has no hover, so the cross is simply there on a touch device */
  .mynote .del{display:flex;width:28px;height:28px}
}
/* a tablet: the sheet stays where it is — centred, not nudged aside — and the
   rail goes down to a single narrow column so it fits inside the sheet's own
   white margin without touching a letter */
@media (min-width:701px) and (max-width:1010px){
  .rail{left:9px;padding:7px 6px;gap:4px;border-radius:20px}
  /* one narrow column, and every row centred on its own width — a finger makes
     the buttons bigger than the inks, and a fixed grid column would push them
     off to one side */
  .rail .two,.rail .inks{display:flex;flex-direction:column;align-items:center;gap:4px}
  .rail .sep{width:20px}
  .days{right:9px}
}
/* the tab that says the tools are there — only on a phone, where the rail is
   put away by default so it never takes half the screen */
.railtab{display:none;position:fixed;left:0;top:50%;transform:translateY(-50%);z-index:58;
  width:20px;height:56px;border-radius:0 12px 12px 0;cursor:pointer;
  background:var(--matl);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  box-shadow:0 0 0 .5px var(--hair),var(--lift1);
  flex-direction:column;align-items:center;justify-content:center;gap:4px;
  -webkit-tap-highlight-color:transparent}
.railtab i{width:4px;height:4px;border-radius:50%;background:#9a9aa0}

/* only a phone has no margin at all: there the rail slides in from the edge,
   and the sheet gives it the room instead of being covered by it */
@media (max-width:700px){
  .railtab{display:flex}
  .rail{left:0;top:50%;bottom:auto;transform:translate(calc(-100% - 14px),-50%);
    flex-direction:column;flex-wrap:nowrap;width:auto;max-width:none;
    border-radius:0 20px 20px 0;padding:9px 8px;gap:5px;
    transition:transform .34s cubic-bezier(.25,1.1,.35,1),opacity .2s}
  body.railout .rail{transform:translate(0,-50%)}
  body.railout .railtab{transform:translateY(-50%) translateX(-24px);opacity:0}
  /* The rail out means a left gutter, and the gutter is the rail's own measured
     width (`--railw`, set in `mkDrawer`): the buttons grow on a finger device,
     so any number written here would be wrong on exactly the screens that
     matter. The sheet is set beside the rail, never under it. */
  body.railout{--gut-l:var(--railw,106px)}
  /* One narrow column down the left edge, and everything in it a tenth smaller
     than anywhere else — on a phone the width taken from the lesson matters
     more than the size of the target. These sizes deliberately undercut the
     coarse-pointer block above: it grows the buttons for a finger, which is
     right on a tablet and too wide here. Small enough that a single column
     still ends above the bottom edge, which is what put the counter off screen
     when it was full size. */
  .rail{padding:7px 6px;gap:4px}
  .rail .two,.rail .inks{display:flex;flex-direction:column;gap:4px}
  .rbtn,.mtool{width:27px;height:27px;border-radius:8px}
  .hand{width:31px;height:31px}
  .ink{width:20px;height:20px}
  .rail .sep{width:20px;height:.5px;margin:1px 0}
  .rpick{left:calc(100% + 9px);right:auto;top:50%;bottom:auto;transform:translateY(-50%)}
  /* the strip of days lies along the bottom, and the sheet ends above it */
  .days{right:auto;left:50%;top:auto;bottom:calc(env(safe-area-inset-bottom) + 12px);
    transform:translateX(-50%);flex-direction:row;border-radius:999px}
  body.bare .days,body.writing .days{transform:translateX(-50%) translateY(140%)}
  body{--gut-b:calc(env(safe-area-inset-bottom) + 66px)}
  body.bare,body.writing{--gut-b:0px}
  body.writing{--gut-l:0px}
}


/* ——— the sheet after dark ———
   The panels once turned dark with the system while the page they float over
   stayed white, and that was rightly taken out: a black slab lying on a white
   lesson is the one thing the system setting was trying to prevent. The answer
   was never to darken less — it was to darken the sheet as well. So this is one
   printing on dark stock, not a dark frame around a lit page: the paper, the
   bands, the memory box, the tools and the glass all move together, and the
   reader's chosen colour moves with them.
   All of it is `@media screen`. Paper is paper at every hour — what is printed
   is the white sheet with black ink, whatever the screen was wearing. */
@media screen{
html.dark{
  color-scheme:dark;
  --paper-tone:#16171b;                 /* the stock itself */
  --ink:#e6e3dd;                        /* the lesson's own ink, warm, never pure white */
  --muted:#8d8b85;
  /* the band, the tag and the box, for a reader who never chose a colour. A
     saved choice is written straight onto the element by `paintTint` and wins
     over these — they are here so the first frame after `html.dark` is already
     right, before a line of script has run. */
  --gray:var(--td-band,#24303f); --gray-dk:var(--td-tag,#8fadd8); --box:var(--td-box,#1d2530);
  --quiet:var(--td-quiet,#44506a);
  --gold:#d4b171; --gold-d:#c19c56;
  --mine:#8ab0ff;                       /* the reader's own hand, lifted off the dark */
  --warnbg:rgba(229,72,77,.17);
  --card:#212329; --card-line:#34363d;
  --hair:rgba(255,255,255,.11);
  /* the same three depths of glass, poured dark */
  --mat:rgba(31,33,39,.78); --matx:rgba(31,33,39,.95); --matl:rgba(31,33,39,.60);
  /* a shadow on a dark ground has to be deeper to say anything at all */
  --lift1:0 8px 22px rgba(0,0,0,.46);
  --lift2:0 14px 36px rgba(0,0,0,.58);
  --lift3:0 26px 60px rgba(0,0,0,.72);
  --selc:#54471f; --selc-t:#f2ede0;
  /* the chrome inverts where it says "on", and nowhere else */
  --ctl:rgba(255,255,255,.07); --ctl-line:rgba(255,255,255,.13);
  --ctl-line2:rgba(255,255,255,.27); --ctl-t:#9d9ba3; --ctl-t2:#e9e8eb;
  --ctl-hi:rgba(255,255,255,.11);
  --on:#e9e8eb; --on-t:#1a1b1f; --onacc:#16171b;
  --slab:#a4a2aa;
}
/* the tone of the sheet is the tone of the window: the page is not a lit card
   lying on a darker desk, it is the whole surface */
html.dark body{background:var(--paper-tone)}
/* ——— the grain, on dark stock ———
   The tiles are scans of pale paper. Laid on as they are they would read as a
   white veil; blended they do what a grain does on any stock — lift the places
   where the pulp lay thicker and leave the rest alone. */
html.dark.paper{ --paper-tone:#181713; --mat:rgba(33,32,28,.80); --matx:rgba(33,32,28,.95);
                 --matl:rgba(33,32,28,.62) }
html.dark.paper body{background-blend-mode:soft-light}
html.dark.paper .mem,html.dark.paper .sec::before,html.dark.paper .lesson{background-blend-mode:soft-light}

/* the lesson's own type */
html.dark .vtext{color:#c9c6c0}
html.dark #vpeek .pt{color:#c9c6c0}
html.dark #vpeek .pv{color:#8d8b93;border-bottom-color:var(--card-line)}
html.dark .vmiss{color:#5b5c63}
html.dark .vtext:empty{background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.09),rgba(255,255,255,.04));background-size:220% 100%}
html.dark .msg{color:#7c7a82}
/* the shine that answers a jump: on dark stock a white sweep is a flashbulb */
html.dark .sec.flash::after{background:linear-gradient(100deg,transparent 22%,rgba(255,255,255,.17) 46%,transparent 68%)}

/* ——— the marker, on dark stock ———
   The two strokes that lay a full band are multiplied onto the page, which is
   how ink behaves on white and how two passes go darker. Multiplied onto black
   they take the letters with them and the marked words go out. So on dark stock
   the band is laid on rather than multiplied in, and it carries dark letters —
   which is exactly what a highlighter does on paper: the marked line is the lit
   one. The line and the wave never multiplied and never needed to; they sit
   under the text and keep the sheet's own ink. */
html.dark mark.fill,html.dark mark.tex{mix-blend-mode:normal;color:#1a1a1c}
html.dark mark.sel{outline-color:rgba(0,0,0,.5)}
html.dark mark.line.sel,html.dark mark.wave.sel{outline-color:rgba(255,255,255,.5)}

/* what the reader wrote himself */
html.dark .myins{background:rgba(138,176,255,.12);border-bottom-color:rgba(138,176,255,.5)}
html.dark .myins:focus{background:rgba(138,176,255,.17);box-shadow:0 0 0 2px rgba(138,176,255,.22)}
html.dark .myins .del{background:rgba(138,176,255,.2)}
html.dark .mynote{background:var(--nbg,rgba(138,176,255,.11));color:#cddaf5}
html.dark .mynote.blank::after{color:#6f7f9e}

/* the colophon */
html.dark .fkind{color:#5f5e66}
html.dark .fnote{color:#7b7a82}
html.dark .fset{color:#5f5e66}
html.dark footer a{color:#918f99;border-bottom-color:rgba(255,255,255,.15)}

/* the settings sheet and the card of keys */
html.dark .sfoot{border-top-color:var(--hair)}
html.dark .keyspop h4{color:#e9e8eb}
html.dark .keyspop .cap{color:#8d8b93}
html.dark .krow kbd{color:#dcdbe0;background:rgba(255,255,255,.13)}
html.dark .krow span{color:#b9b7c0}
html.dark .keysback{background:rgba(0,0,0,.46)}
html.dark .sw{border-color:#2a2c33;box-shadow:0 0 0 1px rgba(255,255,255,.16)}
html.dark .sw.active{box-shadow:0 0 0 2px var(--on)}
/* The strip has always been drawn in the tones it actually hands out, so on
   dark stock it has to be drawn in the dark ones — otherwise it offers a row of
   deep colours and the page answers with pale ones. Same hues, same order, the
   lightness of `hueTintDark`. */
html.dark .huebar{border-color:rgba(255,255,255,.14);
  background:linear-gradient(90deg,hsl(0,42%,68%),hsl(40,42%,68%),hsl(80,42%,68%),hsl(120,42%,68%),
    hsl(160,42%,68%),hsl(200,42%,68%),hsl(240,42%,68%),hsl(280,42%,68%),hsl(320,42%,68%),hsl(360,42%,68%))}

/* the tools, the strip of days and the quarter beside the sheet */
html.dark .rbtn,html.dark .mtool{color:#a3a1a9}
@media (hover:hover){
  html.dark .rbtn:hover,html.dark .mtool:hover{background:rgba(255,255,255,.12);color:#f0eff2}
  html.dark .dchip:hover{background:rgba(255,255,255,.11);color:#e9e8eb}
  html.dark .oitem:hover{background:rgba(255,255,255,.07)}
  html.dark .atrk:hover{background:rgba(255,255,255,.07)}
  html.dark .fmtbar span:hover{background:rgba(255,255,255,.13);color:#f0eff2}
}
html.dark .railtab i{background:#7c7a84}
html.dark .outscrim{background:rgba(0,0,0,.5)}
/* Where the list lies over the page it already carries a shadow, and that
   shadow is the only thing keeping the lines beneath it from showing through;
   a tenth of black does nothing against dark stock, so there — and only there —
   it is poured deeper. Beside the sheet the list has no ground and no shadow at
   any hour: it lies on the same paper as the lesson. */
@media (max-width:1560px){ html.dark .outline,html.dark .setpop{box-shadow:-14px 0 34px rgba(0,0,0,.42)} }
html.dark .fmtbar span{color:#b9b7c0}

/* the reading */
html.dark .atrk{color:#a3a1a9}
html.dark .akick,html.dark .ahead,html.dark .atrk .anum,html.dark .atrk .adur{color:#8a8892}
html.dark .atimes{color:#8a8892}
html.dark .astep{color:#96949e}
html.dark .aflow{color:#6f6d77}
html.dark .aseek{background:rgba(255,255,255,.16)}

/* what floats over the sheet and used to be the dark thing on a light page */
html.dark .hintchip{background:rgba(58,60,68,.94);color:#f0eff2}
html.dark .mtoast{background:rgba(58,60,68,.94);color:#f0eff2}
html.dark .mtoast b{border-left-color:rgba(255,255,255,.26);color:#9dbcff}
html.dark .mtoast b:hover{color:#fff}
}

@media print{
  @page{
    size:A4;                     /* the booklet's own sheet, whatever the printer defaults to */
    margin:15mm;                 /* the same air on all four sides */
    @top-left{ content:"" } @top-center{ content:"" } @top-right{ content:"" }
    @bottom-center{ content:"" }
    @bottom-left{ content:"themaestr-o.github.io/sbl/"; font-family:"PT Sans",sans-serif; font-size:8.5px; letter-spacing:.2px; color:#9a9a9a; }
    @bottom-right{ content:counter(page) "  /  " counter(pages); font-family:"PT Sans",sans-serif; font-size:8.5px; letter-spacing:.4px; color:#9a9a9a; }
  }
  .bar,footer{display:none} body{background:#fff}
  #sheets{padding-left:0;padding-bottom:0}   /* the gutters are a screen affair */
  /* whatever size the reader chose on screen, the sheet prints at 100%.
     No padding of its own: the top and bottom air comes from @page alone, so
     it matches the left and right margins exactly. */
  /* the paper grain is a screen affair: real paper brings its own */
  .page{box-shadow:none;margin:0;max-width:none;overflow:hidden;padding:0;zoom:1;
    background-image:none;background-color:#fff}
  html.paper body,html.paper .page{background-image:none;background-color:#fff}
  html.paper .mem,html.paper .sec::before,html.paper .lesson,html.paper .sec .day{background-image:none}
  .page + .page{break-before:page;page-break-before:always}   /* each lesson opens its own page */
  /* on screen the tag bleeds off the top of the sheet and the sheet clips it.
     Paper has no bleed: left as it is, the tag prints its full height into the
     top margin, 4 mm from the edge of the paper. Same bottom edge, same seat
     for the date — only the part that used to hang outside is gone. */
  .lesson{right:0;top:0;height:98px}
  /* a day never starts at the foot of a page: the band, the question that opens
     it and the text that answers that question are built as one block
     (`daystart`, see renderLesson) and travel over together. The old rules stay
     as a second line of defence, in both spellings — Safari and Firefox do not
     honour `break-after:avoid` everywhere the way Chrome does. */
  .daystart{break-inside:avoid;page-break-inside:avoid}
  .sec,.q,.vref{break-after:avoid;page-break-after:avoid}
  .sec,.q,.review,.mem{break-inside:avoid;page-break-inside:avoid}
  /* long passages flow on instead of leaving half a page empty … */
  .vgroup,.vitem,.note,.quote{break-inside:auto;page-break-inside:auto}
  /* … but a verse set on its own line is never cut in half, and running text
     never strands fewer than three lines either side of a break */
  .vtext.lines .v{break-inside:avoid;page-break-inside:avoid}
  .note,.quote,.mem{orphans:2;widows:2}
  .vtext{orphans:3;widows:3}
  /* ——— the pencil work prints with the lesson; nothing else does ———
     Everything that floats over the sheet is furniture for reading it, and none
     of it belongs on paper. The list of lessons is the one that had been getting
     through: left off this line it printed straight across the text whenever it
     happened to be open at the moment of saving. The settings sheet joins it —
     it used to live inside `.bar` and was carried off by the rule that hides the
     bar, and now that it stands beside the page it has to be named here for
     itself. The player and the drawer tab for the same reason. */
  .rail,.rpick,.bub,.grip,.days,.hintchip,.mtoast,.keysback,.keyspop,#vpeek,
  .outline,.outscrim,.setpop,.aud,.railtab,
  .mynote .del,.myins .del,.mynote .foot{display:none!important}
  .mynote,.myins{break-inside:avoid;page-break-inside:avoid}
  .mynote blockquote{break-inside:avoid;page-break-inside:avoid}
  /* whoever picks up the sheet must see at a glance which lines are not
     the lesson's own */
  .legend.has{display:block;margin-top:30px;padding-top:9px;border-top:.5px solid #ddd;
    font-family:var(--sans);font-size:9.5px;letter-spacing:.3px;color:#8a8a8a}
  .legend .sw{display:inline-block;width:8px;height:8px;background:var(--mine);border-radius:2px;margin-right:5px} }
</style>
<script>
/* ——— the stock is chosen before the sheet is drawn ———
   Read here, in the head, and put straight on <html>: a white flash on the way
   to a dark lesson is the very thing the setting was turned on to stop. An
   empty choice means follow the system, and the system keeps being followed
   while the page is open — see `paintTheme` further down. */
(function(){try{
  var t=localStorage.getItem("sbl.theme")||"";
  if(t==="dark"||(t!=="light"&&matchMedia("(prefers-color-scheme:dark)").matches))
    document.documentElement.classList.add("dark");
}catch(e){}})();
</script>
</head>

  </div>

<div id="sheets"><div class="page"><div class="msg">&hellip;</div></div></div>

<div class="keyspop" id="keyspop" hidden></div>

<div class="rail" id="rail">
