<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MANNA — Sabbath Bible Lesson</title>
<meta name="description" content="The weekly Sabbath Bible Lesson in the original booklet layout.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1c1c1c; --gray:#d1d3d4; --gray-dk:#606162; --box:#e6e6e6; --muted:#666;
  --sans:"PT Sans","Segoe UI",-apple-system,sans-serif;
  --serif:"PT Serif",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{background:#fff;color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}

/* control bar (screen only) — refined, document-like; hidden when printing */
.bar{position:sticky;top:0;z-index:9;background:rgba(255,255,255,.82);backdrop-filter:blur(12px) saturate(1.15);-webkit-backdrop-filter:blur(12px) saturate(1.15);color:#333;border-bottom:1px solid #ededed}
.bar-in{max-width:860px;margin:0 auto;padding:11px 22px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.wk{display:flex;align-items:center;gap:5px}
.ar{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:10px;border:1px solid #e6e6e6;background:#fff;color:#555;cursor:pointer;font-size:18px;line-height:1;user-select:none;transition:background .15s,color .15s,border-color .15s,transform .1s}
.ar:hover{background:#2b2b2b;color:#fff;border-color:#2b2b2b}
.ar:active{transform:translateY(1px)}
.wk .lbl{cursor:pointer;font-size:12.5px;font-weight:600;letter-spacing:.3px;color:#8c8c8c;min-width:128px;text-align:center;padding:0 6px;white-space:nowrap}
.wk .lbl b{color:#222;font-weight:700}
.wk .lbl:hover b{text-decoration:underline;text-underline-offset:3px}
.seg{display:inline-flex;background:#f0f0f0;border:1px solid #e7e7e7;border-radius:10px;padding:3px}
.seg .o{padding:6px 14px;font-size:12px;font-weight:700;letter-spacing:.8px;color:#8a8a8a;cursor:pointer;border-radius:7px;transition:background .15s,color .15s}
.seg .o:hover{color:#333}
.seg .o.active{background:#2b2b2b;color:#fff}
.tog{padding:7px 15px;font-size:12px;font-weight:700;letter-spacing:.7px;color:#777;background:#fff;border:1px solid #e6e6e6;border-radius:10px;cursor:pointer;user-select:none;transition:background .15s,color .15s,border-color .15s}
.tog:hover{border-color:#d3d3d3;color:#333}
.tog.active{background:#2b2b2b;color:#fff;border-color:#2b2b2b}
.pdf{padding:8px 17px;font-size:12px;font-weight:700;letter-spacing:.7px;color:#fff;background:#2b2b2b;border:1px solid #2b2b2b;border-radius:10px;cursor:pointer;user-select:none;transition:background .15s,transform .1s}
.pdf:hover{background:#000;border-color:#000}
.pdf:active{transform:translateY(1px)}

/* the page (booklet) */
.page{position:relative;overflow:hidden;max-width:820px;margin:6px auto 44px;background:#fff;padding:56px 64px 72px}
.msg{text-align:center;color:#999;padding:80px 0;font-family:var(--serif);font-style:italic;font-size:19px}

/* LESSON tag — contour from L4.eps: vertical sides, horizontal top (bleeds off page top),
   bottom slants down to the right (right corner ~4.86% of width lower). */
.lesson{position:absolute;top:-40px;right:64px;z-index:2;width:210px;height:138px;
  background:var(--gray);color:var(--gray-dk);
  font-weight:700;font-size:26px;letter-spacing:3px;text-transform:uppercase;line-height:1;white-space:nowrap;
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:18px;
  clip-path:polygon(0 0,100% 0,100% 100%,0 calc(100% - 10px))}

.top{margin-bottom:24px}
.top .date{font-weight:700;font-size:19px;letter-spacing:.4px;text-transform:uppercase}
h1.title{font-weight:700;font-size:58px;line-height:1.02;letter-spacing:-1px;margin:6px 0 30px}

.mem{background:var(--box);padding:20px 22px;margin-bottom:26px;text-align:justify;hyphens:auto;font-size:18px;line-height:1.55}
.mem b{font-weight:700}
.read{margin-bottom:26px;font-size:18px}
.read .lbl{font-weight:700}
.read .val{margin-left:1.6em}
.read .val i{font-family:var(--serif);font-style:italic}
.quote{font-family:var(--serif);font-size:19px;line-height:1.6;text-align:justify;hyphens:auto;margin-bottom:34px}
.quote i{font-style:italic}

/* band shape from official vector: rectangle + dark tag (vertical left seam, right edge slanted 8.2deg) */
.sec{position:relative;height:52px;margin:40px 0 22px}
.sec::before{content:"";position:absolute;inset:0;background:var(--gray);clip-path:polygon(0 0,100% 0,calc(100% - 7.5px) 100%,0 100%)}
.sec .t{position:relative;height:100%;display:flex;align-items:center;padding-left:20px;font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.2px}
.sec .t .n{margin-right:24px}
.sec .day{position:absolute;top:0;bottom:0;right:0;z-index:1;background:var(--gray-dk);color:#fff;display:flex;align-items:center;
  padding:0 26px;font-weight:700;font-size:18px;white-space:nowrap;clip-path:polygon(0 0,100% 0,calc(100% - 7.5px) 100%,0 100%)}

.vgroup{margin:8px 0 16px;padding:3px 0 4px 20px;border-left:2px solid var(--gray-dk)}
.vitem{break-inside:avoid}
.vitem + .vitem{margin-top:12px}
.vref{font-weight:700;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--gray-dk);margin-bottom:4px}
.vtext{font-family:var(--serif);font-size:16.5px;line-height:1.58;text-align:justify;hyphens:auto;color:#2b2b2b}
.vtext .vnum{font-weight:700;font-size:10px;vertical-align:super;line-height:0;margin:0 4px 0 1px;color:var(--gray-dk)}
.vmiss{color:#bbb}
.q{font-weight:700;font-size:18px;line-height:1.5;text-align:justify;hyphens:auto;margin:0 0 14px;padding-left:26px;text-indent:-26px}
.note{font-family:var(--serif);font-size:18px;line-height:1.62;text-align:justify;hyphens:auto;margin:0 0 16px}
.note i{font-style:italic}
.review{font-weight:700;font-size:18px;line-height:1.5;margin:0 0 14px;padding-left:26px;text-indent:-26px}

footer{max-width:820px;margin:0 auto;text-align:center;color:#bcbcbc;font-size:12px;padding:6px 22px 46px}
footer a{color:#8a8a8a;text-decoration:none}

@media(max-width:720px){ .page{padding:34px 24px 50px;margin:0} h1.title{font-size:40px} .top .lesson{font-size:18px;padding:10px 24px} }
@media print{
  @page{ margin:0 0 15mm 0 }
  .bar,footer{display:none} body{background:#fff}
  .page{box-shadow:none;margin:0;max-width:none;overflow:hidden;padding:48px 64px 24px}
  .q,.vitem,.note,.sec,.review,.mem{break-inside:avoid} }
</style>
</head>
<body>

<div class="bar">
  <div class="bar-in">
    <div class="wk">
      <div class="ar" id="prev" title="Previous week">&lsaquo;</div>
      <div class="lbl" id="wk" title="This week">&mdash;</div>
      <div class="ar" id="next" title="Next week">&rsaquo;</div>
    </div>
    <div class="seg" id="seg"></div>
    <div class="tog" id="tog" title="Show the full Bible verse text under each reference">Verses</div>
    <div class="pdf" id="pdf" title="Save as PDF (uses the selected language)">&#8595; PDF</div>
  </div>
</div>

<div class="page" id="page"><div class="msg">&hellip;</div></div>
<footer>Content &copy; <a href="https://sdarm.org" target="_blank" rel="noopener">Seventh Day Adventist Reform Movement</a> &middot; original booklet layout &middot; by <a href="https://github.com/TheMaestr-o" target="_blank" rel="noopener">Sergio</a></footer>

<script>
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }

const LANGS=["de","en","ru"];
const LOCALE={de:"de-DE",en:"en-US",ru:"ru-RU"};
const MEMLABEL={de:"Merktext",en:"Memory verse",ru:"Памятный стих"};
let lang=localStorage.getItem("manna.print.lang")||localStorage.getItem("manna.web.left")||"en";
if(LANGS.indexOf(lang)===-1) lang="en";
let current=new Date();
const quarters={};
const BIBLE={de:"de-lut",en:"en-kjv",ru:"ru-rst"};
const bibles={};
let versesOn=localStorage.getItem("manna.print.verses")==="1";

function ymd(d){return d.getFullYear()+("0"+(d.getMonth()+1)).slice(-2)+("0"+d.getDate()).slice(-2);}
function qOf(d){return Math.floor(d.getMonth()/3)+1;}
function addDays(d,n){const x=new Date(d.getTime());x.setDate(x.getDate()+n);return x;}
function neigh(y,q){return[[y,q],q===1?[y-1,4]:[y,q-1],q===4?[y+1,1]:[y,q+1]];}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function strip(s){return String(s==null?"":s).replace(/<[^>]*>/g,"");}
function cleanMem(t){t=String(t||"").trim();var qi=t.search(/[„“"«]/);if(qi>0&&qi<=42){var ci=t.lastIndexOf(":",qi);if(ci>=0&&ci<qi)t=t.slice(ci+1).trim();}return t;}
function isJunk(s){return /out of date|install the (new|latest) version|Google Play|App ?store|version installed on your device/i.test(String(s||""));}
function ymdToDate(s){return new Date(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6,8));}
function fmt(dstr,opts){try{return new Intl.DateTimeFormat(LOCALE[lang],opts).format(ymdToDate(dstr));}catch(e){return dstr;}}

async function loadQuarter(l,y,q){
  const key=l+"-"+y+"-"+q; if(quarters[key]) return quarters[key];
  try{const r=await fetch("https://app.sdarm.org/sbl/data/"+l+"/"+l+"-"+y+"-"+q+".json");if(!r.ok)throw 0;return quarters[key]=await r.json();}
  catch(e){return quarters[key]=null;}
}
async function findLesson(d,l){
  const t=ymd(d);
  for(const[y,q]of neigh(d.getFullYear(),qOf(d))){
    const data=await loadQuarter(l,y,q); if(!data||!data.lessons) continue;
    for(const les of data.lessons){
      const days=les.dailyLessons||[];
      const start=days.length?days[0].date:les.date;
      if(t>=start && t<=les.date) return les;
    }
  }
  return null;
}

function loadBible(v){ if(bibles[v]) return bibles[v];
  return bibles[v]=fetch("https://app.sdarm.org/bible/data/"+v+".json").then(r=>r.json()).catch(function(){bibles[v]=null;return null;}); }
function parseSeg(s){const d=s.split("-");const a=d[0].split(".");const b=(d[1]||d[0]).split(".");
  return{book:a[0],chap:+a[1],v1:+a[2],echap:+(b[1]||a[1]),v2:+(b[2]||a[2])};}
function verseHtml(books,sOsis){let out="";
  for(const raw of String(sOsis).split(",")){
    const s=parseSeg(raw.trim());const ch=books&&books[s.book];if(!ch)continue;
    for(let c=s.chap;c<=s.echap;c++){const vs=ch[c-1];if(!vs)continue;
      const from=c===s.chap?s.v1:1,to=c===s.echap?s.v2:vs.length;
      for(let n=from;n<=to;n++) if(vs[n-1]!=null) out+='<span class="vnum">'+n+'</span>'+esc(String(vs[n-1]).trim())+" ";
    }
  }
  return out.trim();
}
function questionLine(sub){
  const parts=(sub.q||[]).map(x=>(x.text||"").trim()).filter(function(t){return t&&!isJunk(t);});
  for(const q of (sub.question||[])) if(q&&q.text&&!isJunk(q.text)) parts.push(q.text.trim());
  return parts.join(" ");
}

function renderLesson(les,tasks){
  let vid=0;
  let h='<div class="lesson">'+esc(strip(les.header||""))+'</div>'+
        '<div class="top"><div class="date">'+esc(strip(WORDsab()+", "+fmt(les.date,{month:"long",day:"numeric",year:"numeric"})))+'</div></div>';
  h+='<h1 class="title">'+esc(les.title||"")+'</h1>';

  const kt=les.keyText||{}, kText=cleanMem(strip(kt.text||les.keyTextVerse||"")), kRef=strip((kt.ref&&kt.ref.text)||"");
  if(kText) h+='<div class="mem"><b>'+esc(MEMLABEL[lang])+':</b> '+esc(kText)+(kRef?' ('+esc(kRef)+').':'')+'</div>';

  const rd=les.reading;
  if(rd&&rd.reading&&rd.reading.length)
    h+='<div class="read"><b>'+esc(strip(rd.label||""))+'</b> <i>'+rd.reading.map(x=>esc(strip(x.label||""))).join("; ")+'</i></div>';

  if(les.keyNote&&les.keyNote.text) h+='<div class="quote">'+esc(strip(les.keyNote.text))+'</div>';

  for(const day of les.dailyLessons||[]){
    const tag=fmt(day.date,{weekday:"short",month:"short",day:"numeric"});
    const st=strip(day.sectionTitle||"").trim();
    const mm=st.match(/^(\d+[.)]?)\s+(.*)$/);
    const secInner=mm?'<span class="n">'+esc(mm[1])+'</span><span class="ttl">'+esc(mm[2])+'</span>':'<span class="ttl">'+esc(st)+'</span>';
    h+='<div class="sec"><div class="t">'+secInner+'</div><div class="day">'+esc(tag)+'</div></div>';
    for(const sub of day.subsections||[]){
      const q=questionLine(sub);
      if(q) h+='<div class="q">'+esc(q)+'</div>';
      if(versesOn){
        const refs=(sub.q||[]).filter(it=>it&&it.sOsis);
        if(refs.length){ h+='<div class="vgroup">';
          for(const it of refs){ const id="pv"+(vid++); tasks.push([id,it.sOsis]);
            const ref=strip(it.text||"").replace(/[;,.\s]+$/,"");
            h+='<div class="vitem">'+(ref?'<div class="vref">'+esc(ref)+'</div>':'')+'<div class="vtext" id="'+id+'"></div></div>'; }
          h+='</div>'; }
      }
      for(const n of sub.note||[]) if(n&&n.text&&!isJunk(n.text)) h+='<div class="note">'+esc(strip(n.text))+'</div>';
    }
    for(const rq of day.reviewQuestions||[]) if(rq) h+='<div class="review">'+esc(strip(rq))+'</div>';
  }
  return h;
}
function WORDsab(){return {de:"Sabbat",en:"Sabbath",ru:"Суббота"}[lang];}

let token=0;
async function render(){
  const my=++token;
  buildSeg();
  const page=document.getElementById("page"); page.innerHTML='<div class="msg">&hellip;</div>';
  const les=await findLesson(current,lang);
  if(my!==token) return;
  if(!les){ page.innerHTML='<div class="msg">No lesson for this week.</div>'; document.getElementById("wk").innerHTML=""; return; }
  document.getElementById("wk").innerHTML='<b>'+esc(strip(les.header||""))+'</b> · '+esc(fmt(les.date,{month:"short",day:"numeric"}));
  const tasks=[];
  page.innerHTML=renderLesson(les,tasks);
  if(versesOn && tasks.length){
    const bib=await loadBible(BIBLE[lang]);
    if(my!==token) return;
    for(const t of tasks){ const el=document.getElementById(t[0]); if(!el) continue;
      const vh=verseHtml(bib&&bib.books,t[1]); el.innerHTML=vh||'<span class="vmiss">—</span>'; }
  }
}
function buildSeg(){
  const el=document.getElementById("seg");
  el.innerHTML=LANGS.map(x=>'<div class="o'+(x===lang?' active':'')+'" data-l="'+x+'">'+x.toUpperCase()+'</div>').join("");
  el.querySelectorAll(".o").forEach(o=>o.onclick=()=>{ if(o.dataset.l===lang)return; lang=o.dataset.l; localStorage.setItem("manna.print.lang",lang); render(); });
}
document.getElementById("prev").onclick=()=>{current=addDays(current,-7);render();};
document.getElementById("next").onclick=()=>{current=addDays(current,7);render();};
document.getElementById("wk").onclick=()=>{current=new Date();render();};

const tog=document.getElementById("tog");
tog.classList.toggle("active",versesOn);
tog.onclick=function(){ versesOn=!versesOn; localStorage.setItem("manna.print.verses",versesOn?"1":"0"); tog.classList.toggle("active",versesOn); render(); };
document.getElementById("pdf").onclick=async function(){
  const b=this,o=b.innerHTML; b.innerHTML="&hellip;";
  try{ await render(); }catch(e){}
  b.innerHTML=o; setTimeout(function(){ window.print(); },80);
};

render();
</script>
</body>
</html>
