/* ——— the reading ———
   The parts are uploaded, not described: nothing lists a folder over http, so
   the page asks for the names it expects and stops at the first miss. One file
   per question is what the studio records anyway, and it costs nothing to keep
   them apart — each is its own mark, and a day is simply its first part.
       audio/de-09-0.mp3    the title and the memory verse
       audio/de-09-1a.mp3   Sunday, question a
       audio/de-09-1b.mp3   Sunday, question b   … and so on to 7g
   A quarter with no recordings answers one 404 and shows nothing. */
const audEl=document.getElementById("audel"), audBar=document.getElementById("aud");
const aseek=document.getElementById("aseek"), atime=document.getElementById("atime");
const alabel=document.getElementById("alabel");
const AUD_LETTERS="abcdefgh";
let audList=[], audAt=0, audToken=0;
function audDir(no){ return "audio/"+lang+"-"+String(no).replace(/\D/g,"").padStart(2,"0"); }
async function audHas(u){ try{ const r=await fetch(u,{method:"HEAD"}); return r.ok; }catch(e){ return false; } }
function mmss(t){ t=Math.max(0,Math.floor(t||0)); return Math.floor(t/60)+":"+String(t%60).padStart(2,"0"); }
function audShow(on){ document.body.classList.toggle("audon",on); if(!on) audEl.pause(); }
/* ——— nothing plays behind a wall ———
   Narrowing the window takes the player off the screen (see the rule above).
   Sound going on with no controls anywhere to stop it is the one state worse
   than no player at all, so it is stopped as it leaves. */
(function(){ const mq=matchMedia("(max-width:1560px)");
  const f=function(){ if(mq.matches) audEl.pause(); };
  if(mq.addEventListener) mq.addEventListener("change",f); else mq.addListener(f); })();
function audIcon(playing){
  document.getElementById("aplay").innerHTML = playing
    ? '<svg width="12" height="14" viewBox="0 0 12 14" fill="currentColor"><path d="M1.4 1.4h3v11h-3zM7.6 1.4h3v11h-3z"/></svg>'
    : '<svg width="13" height="14" viewBox="0 0 13 14" fill="currentColor"><path d="M2 1.4 11.4 7 2 12.6Z"/></svg>';
}
function audDayName(i){
  try{ const d=new Date(2026,1,1+i); return new Intl.DateTimeFormat(LOCALE[lang],{weekday:"long"}).format(d); }
  catch(e){ return String(i+1); }
}
let audLesson="";
/* ——— read straight through, and take the page along ———
   The pause after a question is where the reader answers it, and that is why
   nothing starts by itself. But a reader who is not answering — driving, or
   listening while his hands are busy — wants the lesson read to him whole. This
   is that reader, and it is a choice he makes, not the default: off until
   pressed, and remembered after. Switched on it does the other half too — the
   sheet goes to the question being read, exactly as it goes when a day is
   pressed on the strip. On a phone there is no margin to follow with, so the
   control is not drawn there at all. */
let audFlow=false; try{ audFlow=localStorage.getItem("sbl.audflow")==="1"; }catch(e){}
function audWide(){ try{ return matchMedia("(min-width:1011px) and (hover:hover)").matches; }catch(e){ return true; } }
function audFlowSet(on){
  audFlow=!!on;
  try{ localStorage.setItem("sbl.audflow",audFlow?"1":"0"); }catch(e){}
  document.getElementById("aflow").classList.toggle("on",audFlow);
}
/* the sheet follows the voice: the part knows its day and its letter, and the
   blocks on the sheet are keyed by exactly those two things */
function audFollow(p){
  if(!p||!audFlow||!audWide()) return;
  let el=null,band=null,q=null;
  if(p.day){
    const di=p.day-1, si=AUD_LETTERS.indexOf(p.letter);
    const t=document.querySelector('.sec .t[data-k="d'+di+'"]');
    band=t&&t.closest(".sec");
    q=si>=0?document.querySelector('[data-k="d'+di+"s"+si+'q"]'):null;
    el=q||band;
  } else {
    el=document.querySelector('[data-k="mem"]');    /* the opening reads the memory verse */
  }
  if(!el) return;
  const go=function(){ mkBarH(); mkLand(el); };
  go(); requestAnimationFrame(go);
  if(band) mkFlash(band);
  if(q){ q.classList.remove("lit"); void q.offsetWidth; q.classList.add("lit");
         setTimeout(function(){ q.classList.remove("lit"); },1900); }
}
async function audSync(){
  const my=++audToken;
  audShow(false); audList=[]; audAt=0; audEl.removeAttribute("src"); audIcon(false);
  if(scope==="quarter") return;            /* the whole quarter is not one reading */
  const les=await findLesson(current,lang); if(!les||my!==audToken) return;
  const base=audDir(les.no);

  const intro=base+"-0.mp3";
  if(!(await audHas(intro))||my!==audToken) return;    /* no recording for this lesson */
  audList.push({u:intro,label:T("aintro")||"Intro"});

  const days=les.dailyLessons||[];
  for(let d=1;d<=7;d++){
    const sec=strip((days[d-1]&&days[d-1].sectionTitle)||"").replace(/^\s*\d+\.\s*/,"").trim();
    const subs=(days[d-1]&&days[d-1].subsections)||[];
    const got=[];
    for(let li=0;li<AUD_LETTERS.length;li++){
      const u=base+"-"+d+AUD_LETTERS[li]+".mp3";
      if(!(await audHas(u))){ break; }             /* this day has no more parts */
      if(my!==audToken) return;
      got.push([u,AUD_LETTERS[li]]);
    }
    got.forEach(function(g,gi){
      const sub=subs[gi], first=sub&&sub.q&&sub.q[0];
      /* the question without its marker: the letter has a column of its own */
      const ask=first?strip(first.text||"").replace(/^[a-zA-Zа-яё]\.\s*/,"").trim():"";
      audList.push({u:g[0],day:d,letter:g[1],
        head:gi===0?(audDayName(d-1)+(sec?" \u00b7 "+sec:"")):"",
        label:(sec||audDayName(d-1))+(got.length>1?" \u00b7 "+g[1]:""),
        ask:ask});
    });
  }
  audLesson=strip(les.title||"");
  const fl=document.getElementById("aflow");
  fl.title=T("aflowt"); fl.classList.toggle("on",audFlow);
  audBuildList(); audLoad(0,false); audShow(true); audDurs(my);
}
/* the parts as a list: the opening, then every day over its own questions */
function audBuildList(){
  const box=document.getElementById("alist");
  box.innerHTML=audList.map(function(p,i){
    return (p.head?'<div class="ahead">'+esc(p.head)+'</div>':"")
      +'<div class="atrk" data-i="'+i+'"><span class="anum">'+esc(p.letter||"")+'</span>'
      +'<span class="atit">'+esc(p.ask||p.label||"")+'</span>'
      +'<span class="adur">'+(p.secs?mmss(p.secs):"")+'</span></div>';
  }).join("");
  box.querySelectorAll("[data-i]").forEach(function(el){
    el.onclick=function(){ audLoad(+el.dataset.i,true); };
  });
  audMarkList();
}
const AU_MARK='<svg width="9" height="10" viewBox="0 0 9 10" fill="currentColor"><path d="M1 .8 8 5 1 9.2Z"/></svg>';
function audMarkList(){
  document.querySelectorAll("#alist .atrk").forEach(function(el){
    const i=+el.dataset.i, on=i===audAt;
    el.classList.toggle("on",on);
    el.firstElementChild.innerHTML=on?AU_MARK:esc((audList[i]||{}).letter||"");
  });
}
/* ——— how long each part is ———
   The server answers a range request, so asking for a part's length costs its
   header and not the recording. They arrive one by one and each writes itself
   into its own row; a part whose length never comes simply shows none. */
function audDurs(my){
  audList.forEach(function(p,i){
    if(p.secs!=null) return;
    const a=new Audio(); a.preload="metadata"; a.src=p.u;
    a.addEventListener("loadedmetadata",function(){
      if(my!==audToken) return;                 /* the lesson has moved on */
      p.secs=a.duration||0;
      const el=document.querySelector('#alist .atrk[data-i="'+i+'"] .adur');
      if(el&&p.secs) el.textContent=mmss(p.secs);
    },{once:true});
    a.addEventListener("error",function(){},{once:true});
  });
}
/* the head of the panel says the reading and the place in it, then the part */
function audSay(){
  const p=audList[audAt]||{};
  document.getElementById("alabel").textContent=p.label||T("aintro")||"";
  document.getElementById("akick").textContent=
    (audLesson?audLesson+" \u00b7 ":"")+(audAt+1)+"/"+audList.length;
}
function audLoad(i,play){
  if(i<0||i>=audList.length) return;
  audAt=i; audEl.src=audList[i].u; audMarkList(); audSay();
  aseek.firstElementChild.style.width="0%";
  aseek.lastElementChild.style.left="0%";
  document.getElementById("atotal").textContent="";
  if(play){ audEl.play(); audIcon(true); audFollow(audList[i]); } else audIcon(false);
}
document.getElementById("aplay").onclick=function(){
  if(!audList.length) return;
  if(audEl.paused){ audEl.play(); audIcon(true); audFollow(audList[audAt]); }
  else { audEl.pause(); audIcon(false); }
};
document.getElementById("aflow").onclick=function(){ audFlowSet(!audFlow); };
/* one part ends, the next begins — the lesson reads straight through */
/* A question ends and the next is put on, but nothing starts by itself: the
   pause after a question is where the reader answers it. Pressing play moves on
   when he is ready. */
audEl.addEventListener("ended",function(){
  if(audAt+1>=audList.length){ audIcon(false); return; }
  audLoad(audAt+1,audFlow);        /* read straight through, or wait to be asked */
});
audEl.addEventListener("timeupdate",function(){
  const d=audEl.duration||0,t=audEl.currentTime||0, pc=(d?(t/d*100):0);
  aseek.firstElementChild.style.width=pc+"%";
  aseek.lastElementChild.style.left=pc+"%";
  atime.textContent=mmss(t);
});
audEl.addEventListener("loadedmetadata",function(){
  document.getElementById("atotal").textContent=audEl.duration?mmss(audEl.duration):"";
});
aseek.onclick=function(e){ const r=this.getBoundingClientRect();
  if(audEl.duration) audEl.currentTime=(e.clientX-r.left)/r.width*audEl.duration; };
document.getElementById("atoggle").onclick=function(){
  const b=document.getElementById("alist"), on=!b.classList.contains("open");
  b.classList.toggle("open",on); this.classList.toggle("on",on); };
document.getElementById("aprev").onclick=function(){ audLoad(audAt-1,!audEl.paused); };
document.getElementById("anext").onclick=function(){ audLoad(audAt+1,!audEl.paused); };
/* a day is where its first part begins */
function audSeekDay(i){
  const k=audList.findIndex(function(p){ return p.day===i+1; });
  if(k<0) return false;
  audLoad(k,true); return true;
}

/* ——— the address bar always holds a link worth sending ———
   The lesson being read is written into the address as it is opened, so a
   reader who simply copies what the browser shows him copies the right thing.
   `replaceState` and not a jump: the back button still walks the pages he
   actually visited, and no hashchange comes back at us for it. */
function linkStamp(){
  try{ history.replaceState(null,"","#"+lang+"/"+ymd(current)); }catch(e){}
  /* the two places that can be pointed at say so under the cursor */
  document.querySelectorAll(".q .qm").forEach(function(el){ el.title=T("linkq"); });
  document.querySelectorAll(".sec .day").forEach(function(el){ el.title=T("linkd"); });
}
/* the question a link names, found through the band it sits under: the band
   knows its date, its title knows the index of the day, and the letter is the
   place of the question inside it */
function linkBlock(dayYmd,letter){
  const band=document.querySelector('.sec[data-d="'+dayYmd+'"]');
  if(!band) return {band:null,q:null};
  if(!letter) return {band:band,q:null};
  const t=band.querySelector(".t[data-k]");
  const di=t&&t.dataset.k;
  const si=letter.charCodeAt(0)-97;
  return {band:band,q:(di&&si>=0)?document.querySelector('[data-k="'+di+"s"+si+'q"]'):null};
}
function linkLand(){
  const w=linkWant; if(!w) return;
  linkWant=null;
  const hit=linkBlock(w.date,w.q);
  if(!hit.band) return;
  const el=hit.q||hit.band;
  /* the same landing the day strip uses: put down, then put down again once the
     layout has finished moving under it */
  const go=function(){ mkBarH(); mkLand(el); };
  go(); requestAnimationFrame(go); setTimeout(go,220);
  mkFlash(hit.band);
  if(hit.q){
    const q=hit.q;
    q.classList.remove("lit"); void q.offsetWidth; q.classList.add("lit");
    setTimeout(function(){ q.classList.remove("lit"); },1900);
  }
}
function linkCopy(dayYmd,letter){
  const u=location.href.replace(/#.*$/,"")+"#"+lang+"/"+dayYmd+(letter?"/"+letter:"");
  if(navigator.clipboard) navigator.clipboard.writeText(u);
  mkToast(T("linked"));
}
document.addEventListener("click",function(e){
  if(mkMode) return;                    /* a tool in hand means the click is the tool's */
  if(!e.target.closest) return;
  const day=e.target.closest(".sec .day");
  if(day){ const b=day.closest(".sec"); if(b&&b.dataset.d) linkCopy(b.dataset.d,""); return; }
  const qm=e.target.closest(".q .qm");
  if(!qm) return;
  const blk=qm.closest("[data-k]"); if(!blk) return;
  const m=/^d(\d+)s(\d+)q$/.exec(blk.dataset.k||""); if(!m) return;
  const t=document.querySelector('.sec .t[data-k="d'+m[1]+'"]');
  const band=t&&t.closest(".sec");
  if(band&&band.dataset.d) linkCopy(band.dataset.d,String.fromCharCode(97+ +m[2]));
});
/* someone pastes a link into the page that is already open */
addEventListener("hashchange",function(){
  const w=linkRead(); if(!w) return;
  linkWant=w;
  if(w.lang!==lang){ lang=w.lang; try{ localStorage.setItem("sbl.lang",lang); }catch(e){} paintUI(); buildSeg(); }
  current=w.at;
  render();
});

/* ——— what leaves the page keeps its source ———
   In the booklet the credit stands at the foot of the quote. On a screen it is
   left behind the moment the text is copied, and the quote turns up in somebody
   else's chat with no name on it. So a copy takes the source with it: the
   passage names itself in the line above it, a commentary in the italic at its
   foot, the memory verse in the brackets that close it. */
function mkSourceFor(el){
  if(!el||!el.closest) return null;
  const item=el.closest(".vitem"), vref=item&&item.querySelector(".vref");
  if(vref) return {t:vref.textContent.replace(/\u00A0/g," ").trim(),br:true};
  const blk=el.closest(".quote,.note");
  if(blk){
    const is=blk.querySelectorAll(":scope > i"), last=is[is.length-1];
    if(last){
      const src=last.textContent.replace(/\u00A0/g," ").trim();
      /* only if it really is the foot of the block, not an italic mid-sentence */
      if(src&&blk.textContent.replace(/\u00A0/g," ").trim().slice(-src.length)===src) return {t:src,br:false};
    }
  }
  const mem=el.closest(".mem");
  if(mem){
    const m=mem.textContent.replace(/\u00A0/g," ").trim().match(/\(([^()]{2,70})\)\.?$/);
    if(m) return {t:m[1].trim(),br:true};
  }
  return null;
}
function mkWithSource(t,el){
  const s=mkSourceFor(el);
  if(!s||!s.t||t.indexOf(s.t)>=0) return t;      /* already inside what was taken */
  return t+(s.br?" ("+s.t+")":" \u2014 "+s.t);
}
/* an ordinary Cmd-C, not the tool: a whole thought carries its credit, a word
   or two stays a word or two */
document.addEventListener("copy",function(e){
  const sel=document.getSelection();
  if(!sel||sel.isCollapsed||!sel.rangeCount) return;
  const t=sel.toString().replace(/\u00A0/g," ").trim();
  if(t.length<25) return;
  let el=sel.getRangeAt(0).commonAncestorContainer;
  if(el.nodeType===3) el=el.parentElement;
  if(!el||!el.closest||!el.closest(".page[data-les]")) return;
  if(el.closest(".myins,.mynote")) return;        /* his own words are his own */
  const out=mkWithSource(t,el);
  if(out===t) return;
  try{ e.clipboardData.setData("text/plain",out); e.preventDefault(); }catch(err){}
});
</script>
</body>
