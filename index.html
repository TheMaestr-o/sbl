<style>
:root{
  --z:1;   /* text size: the sheet scales as a whole, proportions untouched */
  /* the lesson comes up in the navy of the quarterly's own cover; grey and the
     rest wait in the colour row of the settings */
  --ink:#1c1c1c; --gray:#ccd5e2; --gray-dk:#24426e; --box:#e7ecf4; --muted:#666;
  --gold:#c6a15b; --gold-d:#b28e44;
  --mine:#2f5bd0;                       /* everything the reader added himself */
  --mat:rgba(250,250,252,.76); --hair:rgba(0,0,0,.08);
  --sans:"PT Sans","Segoe UI",-apple-system,sans-serif;
  --serif:"PT Serif",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{background:#fff;color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
/* selecting text feels like running a highlighter over the booklet */
::selection{background:var(--selc,#f7de84);color:#1c1c1c}
::-moz-selection{background:var(--selc,#f7de84);color:#1c1c1c}

/* control bar (screen only) — refined, document-like; hidden when printing */
.bar{position:sticky;top:0;z-index:9;background:rgba(255,255,255,.82);backdrop-filter:blur(12px) saturate(1.15);-webkit-backdrop-filter:blur(12px) saturate(1.15);color:#333;border-bottom:1px solid #ededed}
/* the buttons line up with the text column, not with the edge of the sheet:
   same width and the same side margins as the page below */
.bar-in{max-width:820px;margin:0 auto;padding:11px 64px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.ar{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:10px;border:1px solid #e6e6e6;background:#fff;color:#555;cursor:pointer;font-size:18px;line-height:1;user-select:none;transition:background .15s,color .15s,border-color .15s,transform .1s}
.ar:hover{background:#2b2b2b;color:#fff;border-color:#2b2b2b}
.ar:active{transform:translateY(1px)}
/* the week label opens the month — it has to look like something you press */
.lbl{cursor:pointer;font-size:12px;font-weight:600;letter-spacing:.3px;color:#8c8c8c;min-width:104px;
  height:34px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;white-space:nowrap;
  border:1px solid #e6e6e6;border-radius:10px;background:#fff;transition:background .15s,border-color .15s}
.lbl:hover{border-color:#d3d3d3;background:#fafafa}
.lbl::after{content:"";flex:none;width:4.5px;height:4.5px;margin-top:-2px;
  border-right:1.4px solid #bdbdbd;border-bottom:1.4px solid #bdbdbd;transform:rotate(45deg)}
.lbl:hover::after{border-color:#777}
/* text size — two square buttons cut like the rest of the toolbar */
.zoom{flex:none;width:34px;height:34px;display:flex;align-items:center;justify-content:center;
  border:1px solid #e6e6e6;border-radius:10px;background:#fff;color:#777;cursor:pointer;user-select:none;
  font-size:13px;font-weight:700;letter-spacing:0;transition:background .15s,color .15s,border-color .15s,opacity .15s}
.zoom:hover{border-color:#d3d3d3;color:#333}
.zoom.off{opacity:.32;cursor:default;border-color:#ededed}
.zoom.off:hover{color:#777;border-color:#ededed}
.lbl b{color:#222;font-weight:700}
.lbl:hover b{text-decoration:underline;text-underline-offset:3px}
.seg{display:inline-flex;background:#f0f0f0;border:1px solid #e7e7e7;border-radius:10px;padding:3px}
.seg .o{padding:6px 14px;font-size:12px;font-weight:700;letter-spacing:.8px;color:#8a8a8a;cursor:pointer;border-radius:7px;transition:background .15s,color .15s}
.seg .o:hover{color:#333}
.seg .o.active{background:#2b2b2b;color:#fff}
.tog{padding:7px 15px;font-size:12px;font-weight:700;letter-spacing:.7px;color:#777;background:#fff;border:1px solid #e6e6e6;border-radius:10px;cursor:pointer;user-select:none;transition:background .15s,color .15s,border-color .15s}
.tog:hover{border-color:#d3d3d3;color:#333}
.tog.active{background:#2b2b2b;color:#fff;border-color:#2b2b2b}
.tog[hidden]{display:none}
/* the toolbar carries two things: which lesson, and everything else */
.gear{flex:none;width:34px;height:34px;display:flex;align-items:center;justify-content:center;
  border:1px solid #e6e6e6;border-radius:10px;background:#fff;color:#777;cursor:pointer;user-select:none;
  transition:background .15s,color .15s,border-color .15s}
.gear:hover{border-color:#d3d3d3;color:#333}
.gear.open{background:#2b2b2b;border-color:#2b2b2b;color:#fff}
.gear svg{display:block}

/* everything that used to sit in the bar now lives here, one row per setting */
.setpop{position:absolute;top:calc(100% + 7px);right:0;background:#fff;border:1px solid #e9e9e9;border-radius:14px;
  box-shadow:0 16px 44px rgba(0,0,0,.16);padding:6px;z-index:31;width:min(320px,calc(100vw - 24px))}
.setpop[hidden]{display:none}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 10px;border-radius:9px}
.srow + .srow{border-top:1px solid #f1f1f1}
/* one quiet line closes the sheet: which version this is, and where the keys
   are written down */
.sfoot{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:9px 10px 4px;margin-top:2px;border-top:1px solid #f1f1f1}
.sfoot span{font-size:10.5px;letter-spacing:.2px;color:#b0b0b4;cursor:pointer;transition:color .15s}
.sfoot span:hover{color:#2b2b2b}
.slab{font-size:12.5px;font-weight:600;color:#6f6f6f;white-space:nowrap}
.sctl{display:flex;gap:6px;flex:none}
.sbtn{padding:7px 11px;font-size:12px;font-weight:700;color:#2b2b2b;background:#f4f4f4;border-radius:8px;
  cursor:pointer;user-select:none;white-space:nowrap;transition:background .15s,color .15s}
.sbtn:hover{background:#2b2b2b;color:#fff}
/* a switch reads at a glance: the tools are either out or away */
.sw2{position:relative;width:42px;height:25px;border-radius:13px;background:rgba(120,120,128,.3);
  cursor:pointer;flex:none;transition:background .2s}
.sw2 i{position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.28);transition:transform .22s cubic-bezier(.3,1.3,.4,1)}
.sw2.on{background:#34c759}
.sw2.on i{transform:translateX(17px)}
/* the PDF row is the one that does something: its first button says so */
.sbtn.pri{background:#2b2b2b;color:#fff}
.sbtn.pri:hover{background:#000}
.langseg{display:inline-flex;background:#f0f0f0;border:1px solid #e7e7e7;border-radius:10px;padding:3px}
.langseg .o{padding:6px 11px;font-size:12px;font-weight:700;letter-spacing:.6px;color:#8a8a8a;cursor:pointer;
  border-radius:7px;transition:background .15s,color .15s}
.langseg .o:hover{color:#333}
.langseg .o.active{background:#2b2b2b;color:#fff}
.swatches{display:flex;align-items:center;gap:7px}
.sw{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid #fff;box-shadow:0 0 0 1px #dcdcdc;transition:transform .1s}
.sw:hover{transform:scale(1.1)}
.sw.active{box-shadow:0 0 0 2px #111}
/* the colour wheel says "any colour you like" better than a plus sign */
.sw.custom{background:conic-gradient(from .5turn,#e04b4b,#e0a33c,#d6cf3f,#4fb257,#3f9fd6,#5b57c9,#b950b0,#e04b4b)}
.swatches input[type=color]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
/* text size — two square buttons cut like the rest */
.zoom{flex:none;width:32px;height:32px;display:flex;align-items:center;justify-content:center;
  border:1px solid #e6e6e6;border-radius:9px;background:#fff;color:#777;cursor:pointer;user-select:none;
  font-size:13px;font-weight:700;transition:background .15s,color .15s,border-color .15s,opacity .15s}
.zoom:hover{border-color:#d3d3d3;color:#333}
.zoom.off{opacity:.32;cursor:default;border-color:#ededed}
.tog{width:32px;height:32px;padding:0;display:flex;align-items:center;justify-content:center;
  border:1px solid #e6e6e6;border-radius:9px;background:#fff;color:#777;cursor:pointer;user-select:none;
  transition:background .15s,color .15s,border-color .15s}
.tog:hover{border-color:#d3d3d3;color:#333}
.tog.active{background:#2b2b2b;color:#fff;border-color:#2b2b2b}
.tog svg{display:block}

/* a month at a glance, with the lesson standing beside its week */
.calpop{position:absolute;top:calc(100% + 7px);left:50%;transform:translateX(-50%);background:#fff;
  border:1px solid #e9e9e9;border-radius:14px;box-shadow:0 16px 44px rgba(0,0,0,.16);padding:12px;z-index:31;
  width:min(430px,calc(100vw - 24px));max-height:min(70vh,560px);overflow:auto}
.calpop[hidden]{display:none}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calhead b{font-size:13.5px;font-weight:700;color:#2b2b2b;letter-spacing:.3px;text-transform:capitalize}
.calnav{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:8px;
  border:1px solid #e6e6e6;color:#777;cursor:pointer;font-size:15px;user-select:none}
.calnav:hover{background:#2b2b2b;color:#fff;border-color:#2b2b2b}
.calrow{display:flex;align-items:center;gap:8px;padding:2px 0}
.calrow.head .d{color:#b0b0b0;font-size:9.5px;letter-spacing:.6px;text-transform:uppercase;cursor:default}
.calrow .days{display:flex;gap:2px;flex:none}
.calrow .d{width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:7px;
  font-size:11.5px;color:#3a3a3a;cursor:pointer}
.calrow .d.out{color:#c9c9c9}
.calrow .d.today{font-weight:700;box-shadow:inset 0 0 0 1px var(--gray-dk)}
.calrow .les{flex:1;min-width:0;font-size:11.5px;line-height:1.25;color:#8a8a8a;cursor:pointer;
  padding:4px 7px;border-radius:8px;overflow:hidden}
.calrow .les b{display:block;color:#2b2b2b;font-weight:700;font-size:11px;letter-spacing:.3px}
.calrow .les span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.calrow.pick:hover .d:not(.head),.calrow.pick:hover .les{background:#f4f4f4}
.calrow.on .les{background:var(--box)}
.calrow.on .les b{color:var(--gray-dk)}
.calfoot{margin-top:9px;padding-top:9px;border-top:1px solid #eee;display:flex;justify-content:center}
.calfoot .it{font-size:12px;font-weight:700;color:#2b2b2b;cursor:pointer;padding:7px 14px;border-radius:8px}
.calfoot .it:hover{background:#f4f4f4}

/* the page (booklet)
   --z scales the whole sheet at once — type, bands, tags, rules, margins — so
   every proportion of the printed layout is kept. The sheet keeps its full
   820px of measure and simply grows with the text; it only gives width back
   when the window itself has none left, so the column never narrows on a
   screen that had room for it. */
.page{position:relative;overflow:hidden;max-width:min(calc(820px / var(--z)),100%);
  margin:6px auto 44px;background:#fff;zoom:var(--z);
  padding:calc(56px / var(--z)) calc(64px / var(--z)) calc(72px / var(--z))}
.msg{text-align:center;color:#999;padding:80px 0;font-family:var(--serif);font-style:italic;font-size:19px}

/* LESSON tag — contour from L4.eps: vertical sides, horizontal top (bleeds off page top),
   bottom slants down to the right (right corner ~4.86% of width lower). */
.lesson{position:absolute;top:-40px;right:64px;z-index:2;width:210px;height:138px;
  background:var(--gray);color:var(--gray-dk);
  font-weight:700;font-size:26px;letter-spacing:3px;text-transform:uppercase;line-height:1;white-space:nowrap;
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:18px;
  clip-path:polygon(0 0,100% 0,100% 100%,0 calc(100% - 10px))}

/* the lesson tag's seat: the date can never grow into it, at any text size */
.top{margin-bottom:24px;padding-right:292px;min-height:100px}
.top .date{font-weight:700;font-size:19px;letter-spacing:.4px;text-transform:uppercase}
h1.title{font-weight:700;font-size:58px;line-height:1.02;letter-spacing:-1px;margin:6px 0 30px}

.mem{background:var(--box);padding:20px 22px;margin-bottom:26px;text-align:justify;hyphens:auto;font-size:18px;line-height:1.5}
.mem b{font-weight:700}
.read{margin-bottom:26px;font-size:18px}
.read .lbl{font-weight:700}
.read .val{margin-left:1.6em}
.read .val i{font-family:var(--serif);font-style:italic}
.quote{font-family:var(--serif);font-size:19px;line-height:1.52;text-align:justify;hyphens:auto;margin-bottom:34px}
.quote i{font-style:italic}

/* band shape from official vector: rectangle + dark tag (vertical left seam, right edge slanted 8.2deg) */
.sec{position:relative;height:auto;min-height:40px;margin:40px 0 22px}   /* band hugs the text as in the printed booklet */
.sec::before{content:"";position:absolute;inset:0;background:var(--gray);clip-path:polygon(0 0,100% 0,calc(100% - 7.5px) 100%,0 100%)}
/* the right padding is the day tag's seat — a long title wraps inside the band
   instead of running underneath it */
.sec .t{position:relative;min-height:40px;display:flex;align-items:center;padding:6px 152px 6px 20px;
  font-weight:700;font-size:22px;line-height:1.2;text-transform:uppercase;letter-spacing:.2px}
.sec .t .n{margin-right:.32em}   /* one space between "1." and the title */
.sec .day{position:absolute;top:0;bottom:0;right:0;z-index:1;background:var(--gray-dk);color:#fff;display:flex;align-items:center;
  padding:0 26px;font-weight:700;font-size:18px;white-space:nowrap;clip-path:polygon(0 0,100% 0,calc(100% - 7.5px) 100%,0 100%)}

/* 24px + the 2px rule = 26px, the same column the question text starts in, so
   reference, verse and question all hang on one vertical line */
.vgroup{margin:8px 0 16px;padding:3px 0 4px 24px;border-left:2px solid var(--gray-dk)}
.vitem{break-inside:avoid}
.vitem + .vitem{margin-top:12px}
.vref{font-weight:700;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--gray-dk);margin-bottom:4px}
.vtext{font-family:var(--serif);font-size:16.5px;line-height:1.5;text-align:justify;hyphens:auto;color:#2b2b2b}
/* the verse number keeps one look everywhere: same serif, same size, same
   colour — only a gentle raise, not a full superscript hop */
.vtext .vnum{font-weight:700;font-size:11px;vertical-align:.42em;line-height:0;margin:0 4px 0 0;color:var(--gray-dk)}
/* one verse per line — number hangs in the margin, wrapped lines align under the text */
.vtext.lines{text-align:left;hyphens:none}
/* the number starts the line — flush with the reference above it and with the
   question text — and the verse hangs off it */
.vtext.lines .v{display:block;padding-left:17px;text-indent:-17px;break-inside:avoid}
.vtext.lines .v + .v{margin-top:5px}
/* min-width, not width: the verse follows the number as closely as it does in
   running text, and a three-digit number simply takes the room it needs */
.vtext.lines .vn{display:inline-block;min-width:13px;margin-right:4px;text-indent:0;vertical-align:.42em;
  font-weight:700;font-size:11px;color:var(--gray-dk)}   /* same raise as the inline number */
.vmiss{color:#bbb}
.q{font-weight:700;font-size:18px;line-height:1.45;text-align:justify;hyphens:auto;margin:0 0 14px;padding-left:26px;text-indent:-26px}
.note{font-family:var(--serif);font-size:18px;line-height:1.52;text-align:justify;hyphens:auto;margin:0 0 16px}
.note i{font-style:italic}
.review{font-weight:700;font-size:18px;line-height:1.45;margin:0 0 14px;padding-left:26px;text-indent:-26px}
/* the "a." / "b." marker owns its own column, so wrapped lines land exactly
   under the first word of the question rather than a few pixels off */
.q .qm,.review .qm{display:inline-block;width:26px;text-indent:0}

/* colophon — takes its accent from whatever colour the bands are wearing */
footer{max-width:820px;margin:0 auto;text-align:center;padding:20px 22px 58px}
.frule{width:230px;height:1px;margin:0 auto 16px;
  background:linear-gradient(90deg,transparent,var(--gray-dk),transparent)}
.fkind{font-size:10px;letter-spacing:2.6px;text-transform:uppercase;color:#b9b9b9;margin-bottom:15px}
.fnote{font-size:12px;line-height:1.75;color:#9c9c9c}
.fset{font-size:11px;letter-spacing:.4px;color:#c2c2c2;margin-top:9px}
footer a{color:#7a7a7a;text-decoration:none;border-bottom:1px solid #e2e2e2;padding-bottom:1px;transition:color .15s,border-color .15s}
footer a:hover{color:var(--gray-dk);border-bottom-color:var(--gray-dk)}

/* a narrow desktop window: the text column is only 640px, so the toolbar has
   to give up a little padding to stay on one line inside it */
@media screen and (min-width:721px) and (max-width:900px){
  .bar-in{gap:10px 6px}
  .lbl{min-width:98px;padding:0 7px;gap:5px}
  .seg .o{padding:6px 9px}
}
/* screen-only: the phone. `screen` keeps the PDF (A4 ≈ 794px) out of these rules. */
@media screen and (max-width:720px){
  body{font-size:16px}

  /* control bar: week row on top, then everything else on one line */
  .bar-in{padding:9px 22px;gap:8px;justify-content:center}
  .wk{flex:0 0 100%;justify-content:space-between;gap:6px}
  .lbl{min-width:0;max-width:calc(100% - 46px);overflow:hidden;text-overflow:ellipsis;padding:0 10px}
  .ar,.tintbtn{flex:none;width:34px;height:34px;font-size:17px}
  .seg .o{padding:6px 11px}
  .tog{padding:7px 12px}
  .pdf{padding:7px 13px}

  .page{padding:calc(30px / var(--z)) calc(22px / var(--z)) calc(44px / var(--z));margin:0}
  /* lesson tag shrinks and the date keeps clear of it */
  .lesson{width:136px;height:96px;top:-30px;right:22px;font-size:17px;letter-spacing:2px;padding-bottom:13px}
  .top{margin-bottom:18px;padding-right:146px;min-height:66px}
  .top .date{font-size:14px;line-height:1.35}
  h1.title{font-size:34px;letter-spacing:-.5px;margin:4px 0 22px}

  /* justified text needs a wide measure — a phone has none, so rag right */
  .mem,.quote,.vtext,.q,.note,.review{text-align:left}
  .mem{padding:16px;margin-bottom:20px;font-size:16px}
  .read{font-size:16px;margin-bottom:20px}
  .read .val{margin-left:0;display:block}
  .quote{font-size:17px;margin-bottom:26px}

  /* section band grows to fit; the title never runs under the day tag */
  .sec{height:auto;min-height:36px;margin:30px 0 18px}
  .sec .t{min-height:36px;font-size:15px;letter-spacing:0;line-height:1.25;padding:8px 104px 8px 12px}
  .q .qm,.review .qm{width:20px}
  .sec .day{font-size:11.5px;padding:0 11px}

  .vgroup{margin:8px 0 14px;padding-left:18px}   /* + 2px rule = the 20px question column */
  .vtext{font-size:15.5px}
  .q{font-size:17px;padding-left:20px;text-indent:-20px}
  .note{font-size:16.5px}
  .review{font-size:17px;padding-left:20px;text-indent:-20px}
  footer{padding:6px 18px 36px}
}
@media screen and (max-width:400px){
  .bar-in{padding:9px 18px;gap:6px}
  .ar,.zoom,.tintbtn,.langbtn{width:30px;height:30px;font-size:12px}
  .seg .o{padding:6px 7px;letter-spacing:.3px}
  .tog,.pdf{padding:7px 8px;letter-spacing:.3px}
  .tog.ic,.pdf.ic,.tog.vlines,.langbtn{width:30px;height:30px;padding:0}
  .page{padding:calc(26px / var(--z)) calc(18px / var(--z)) calc(40px / var(--z))}
  .lesson{width:122px;height:88px;right:18px;font-size:15px;letter-spacing:1.5px}
  .top{padding-right:130px;min-height:58px}
  h1.title{font-size:30px}
  .sec .t{font-size:14px;padding-right:96px}
  .sec .day{font-size:11px;padding:0 9px}
}
/* ——— PENCIL MARKS ———
   Everything is drawn as the background of the line itself, never as an overlay:
   the ink then flows with the text, breaks with it across lines and pages, and
   arrives in the PDF exactly as it looks on screen. */
mark{background:none;color:inherit;background-repeat:no-repeat;background-size:100% 100%;
  mix-blend-mode:multiply;-webkit-box-decoration-break:clone;box-decoration-break:clone;
  cursor:pointer;transition:filter .15s}
mark:hover{filter:saturate(1.22)}
/* the stroke that was tapped: the rail's colours and strokes now act on it */
mark.sel{outline:1.5px dashed rgba(0,0,0,.4);outline-offset:1px;border-radius:2px}
@media (prefers-color-scheme:dark){ mark.sel{outline-color:rgba(0,0,0,.55)} }
mark.fill{padding:0;margin:0;background-repeat:no-repeat}
mark.tex{padding:.1em 0 .12em;margin:0;background-size:100% 1.15em;background-position:0 .06em}
/* the ink reaches past the letters only at the true ends of the selection —
   otherwise neighbouring pieces overlap and a dirty seam shows in the middle */
mark.ps{padding-left:.3em;margin-left:-.3em}
mark.pe{padding-right:.3em;margin-right:-.3em}
/* куски одного мазка встают встык: перекрытие давало бы тёмную зарубку на
   стыке, а разрыв — белую щель. Обычно куска и вовсе один — см. mkWhole() */
mark.fill:not(.ps),mark.tex:not(.ps){margin-left:0;padding-left:0}
mark.fill:not(.pe),mark.tex:not(.pe){margin-right:0;padding-right:0}
mark.line,mark.wave{mix-blend-mode:normal;padding:0 .05em .26em;margin:0;background-position:0 100%}
mark.line{background-size:100% .48em}
mark.wave{background-size:auto .42em;background-repeat:repeat-x}

/* ——— what the reader wrote: another colour, another face, its own label ——— */
.myins{font-family:var(--sans);font-size:.93em;font-style:normal;color:var(--mine);
  background:rgba(47,91,208,.08);border-bottom:1.5px dotted rgba(47,91,208,.55);border-radius:3px;
  padding:.02em .3em;margin:0 .08em;-webkit-box-decoration-break:clone;box-decoration-break:clone;
  outline:none;text-indent:0}
.myins:empty::before{content:"…";opacity:.5}
.myins .del{display:inline-block;margin-left:.35em;width:1.15em;height:1.15em;line-height:1.05em;text-align:center;
  border-radius:50%;background:rgba(47,91,208,.16);color:var(--mine);font-size:.82em;cursor:pointer;user-select:none;
  vertical-align:.05em}
.myins .del:hover{background:var(--mine);color:#fff}
.myins:focus{background:rgba(47,91,208,.13);box-shadow:0 0 0 2px rgba(47,91,208,.18)}
/* the reader's own block: rounded on every corner, with its own colour and a
   bar of the same shape down the side */
.mynote{position:relative;margin:14px 0 18px;padding:11px 16px 9px 19px;text-indent:0;
  background:var(--nbg,rgba(47,91,208,.055));border-radius:11px;
  font-family:var(--sans);font-size:15.5px;line-height:1.55;color:#22304e;outline:none;text-align:left}
.mynote::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:3px;
  background:var(--nc,var(--mine))}
.mynote b,.mynote strong{font-weight:700}
.mynote i,.mynote em{font-style:italic}
.mynote.blank::after{content:attr(data-ph);color:#9aa7c4}
.mynote .lab{display:block;margin-top:7px;font-size:8.5px;letter-spacing:1.1px;
  text-transform:uppercase;color:var(--nc,var(--mine));opacity:.6;font-weight:700}
.mynote:focus{box-shadow:0 0 0 3px rgba(47,91,208,.14)}
.mynote .del{position:absolute;top:6px;right:8px;width:20px;height:20px;border-radius:6px;cursor:pointer;
  display:none;align-items:center;justify-content:center;color:var(--mine);opacity:.55;font-size:14px}
.mynote:hover .del{display:flex}
.mynote .del{color:var(--nc,var(--mine))}
.mynote .del:hover{opacity:1;background:rgba(120,120,128,.16)}
.legend{display:none}

/* one tap and the room is empty: the rail slides out to the left, the bar
   lifts away, and nothing but the lesson is left on the screen */
.bar{transition:transform .3s cubic-bezier(.3,.9,.3,1),opacity .22s}
.rail{transition:opacity .22s,transform .3s cubic-bezier(.3,.9,.3,1)}
body.bare .bar{transform:translateY(-110%);opacity:0;pointer-events:none}
body.bare .rail{opacity:0;pointer-events:none;transform:translateY(-50%) translateX(calc(-100% - 22px))}
@media (max-width:700px){ body.bare .rail{transform:translateX(-50%) translateY(140%)} }

/* ——— THE RAIL ———
   The tools stand beside the sheet and stay there. What is in hand is visible
   at a glance, nothing has to pop up to be found, and nothing closes after a
   click: take a marker, run through the lesson, put it back. */
.rail{position:fixed;top:50%;transform:translateY(-50%);z-index:60;
  /* it keeps to the left margin: outside the sheet where there is room, and
     over the sheet's own white edge on a tablet — never over the text */
  left:max(10px,calc((100vw - 900px) / 2));
  display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 7px;
  background:var(--mat);-webkit-backdrop-filter:saturate(180%) blur(28px);backdrop-filter:saturate(180%) blur(28px);
  border-radius:19px;box-shadow:0 0 0 .5px var(--hair),0 14px 36px rgba(0,0,0,.15);
  transition:opacity .2s}
.rail .sep{width:24px;height:.5px;background:var(--hair);margin:2px 0}
.rail .two{display:grid;grid-template-columns:repeat(2,30px);gap:4px}
.rbtn{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:9px;
  color:#5b5b60;cursor:pointer;transition:background .16s,color .16s,transform .12s}
.rbtn:hover{background:rgba(120,120,128,.16);color:#1c1c1e}
.rbtn:active{transform:scale(.92)}
.rbtn.on{background:#2b2b2b;color:#fff}
.rbtn.own.on{background:var(--mine);color:#fff}
.rbtn svg{display:block}
.inks{display:grid;grid-template-columns:repeat(2,22px);gap:6px;justify-content:center}
.ink{position:relative;width:22px;height:22px;border-radius:50%;cursor:pointer;flex:none;
  box-shadow:inset 0 0 0 .5px rgba(0,0,0,.14),inset 0 -3px 5px rgba(0,0,0,.06),inset 0 3px 4px rgba(255,255,255,.5);
  transition:transform .16s cubic-bezier(.3,1.4,.4,1),box-shadow .16s}
.ink:hover{transform:scale(1.14)} .ink:active{transform:scale(.94)}
.ink.on{box-shadow:inset 0 0 0 .5px rgba(0,0,0,.14),0 0 0 2px #2b2b2b}
/* a pinned ink keeps its place: the row may reshuffle around it, it will not */
.ink.pin::after{content:"";position:absolute;left:50%;bottom:-1px;transform:translateX(-50%);
  width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
.ink.more{background:conic-gradient(from .5turn,#ff6b6b,#ffb35c,#ffe066,#8fe08f,#7fc8f8,#b39ddb,#f48fb1,#ff6b6b)}
/* the saved mark: how many, and that they are kept at all */
.chip{font-size:9.5px;font-weight:700;letter-spacing:.2px;color:#9a9a9e;cursor:pointer;
  padding:3px 6px;border-radius:7px;white-space:nowrap;transition:color .2s,background .2s}
.chip:hover{color:#2b2b2b;background:rgba(120,120,128,.14)}
.chip.flash{color:#2f9e56}

/* the gamut opens beside the rail, in the same block — never as a window */
.rpick{position:absolute;left:calc(100% + 9px);top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;gap:7px;padding:9px;
  background:var(--mat);-webkit-backdrop-filter:saturate(180%) blur(28px);backdrop-filter:saturate(180%) blur(28px);
  border-radius:14px;box-shadow:0 0 0 .5px var(--hair),0 12px 30px rgba(0,0,0,.16)}
.rpick[hidden]{display:none}
.area{position:relative;width:190px;height:110px;border-radius:9px;cursor:crosshair;
  box-shadow:inset 0 0 0 .5px rgba(0,0,0,.18)}
.hue{position:relative;width:190px;height:14px;border-radius:7px;cursor:pointer;
  background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);
  box-shadow:inset 0 0 0 .5px rgba(0,0,0,.18)}
.area .dot,.hue .dot{position:absolute;width:13px;height:13px;border-radius:50%;border:2px solid #fff;
  box-shadow:0 0 0 1px rgba(0,0,0,.35),0 1px 3px rgba(0,0,0,.3);transform:translate(-50%,-50%);pointer-events:none}
.hue .dot{top:50%}

/* ——— the days of the lesson, down the right edge ———
   A lesson is seven days long; this is the thread you pull to get to any of
   them, and it says which one you are reading now. */
.days{position:fixed;right:max(10px,calc((100vw - 900px) / 2));top:50%;transform:translateY(-50%);
  z-index:59;display:flex;flex-direction:column;gap:3px;padding:6px;
  background:var(--mat);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);
  border-radius:999px;box-shadow:0 0 0 .5px var(--hair),0 10px 28px rgba(0,0,0,.1);
  transition:opacity .22s,transform .3s cubic-bezier(.3,.9,.3,1)}
.days:empty{display:none}
/* the band you jumped to answers with a shine, so the eye lands on it */
.sec.flash{overflow:hidden}
.sec.flash::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(100deg,transparent 22%,rgba(255,255,255,.6) 46%,transparent 68%);
  transform:translateX(-110%);animation:secsweep .9s cubic-bezier(.3,.7,.3,1)}
@keyframes secsweep{to{transform:translateX(110%)}}
@media (prefers-reduced-motion:reduce){
  .days .dpill{transition:none} .sec.flash::after{display:none}
}
.days .dpill{position:absolute;left:6px;top:6px;width:30px;height:30px;border-radius:50%;
  background:var(--gray-dk);opacity:0;pointer-events:none;
  transition:transform .42s cubic-bezier(.32,1.5,.4,1),opacity .2s}
.days.ready .dpill{opacity:1}
.dchip{position:relative;z-index:1;width:30px;height:30px;display:flex;align-items:center;justify-content:center;
  border-radius:50%;cursor:pointer;font-size:10.5px;font-weight:700;letter-spacing:.2px;
  color:#8a8a8e;text-transform:uppercase;transition:color .16s,background .16s}
.dchip:hover{background:rgba(120,120,128,.14);color:#2b2b2b}
.dchip.on{color:#fff}
body.bare .days{opacity:0;pointer-events:none;transform:translateY(-50%) translateX(calc(100% + 22px))}
@media (max-width:1010px){ .days{right:8px} }
@media (max-width:700px){
  .days{right:auto;left:50%;top:auto;bottom:calc(env(safe-area-inset-bottom) + 96px);
    transform:translateX(-50%);flex-direction:row;border-radius:999px}
  body.bare .days{transform:translateX(-50%) translateY(140%)}
}
@media (pointer:coarse){ .dchip,.days .dpill{width:36px;height:36px} .dchip{font-size:11.5px} }

/* the quiet invitation: shown a few times, never again after that */
.hintchip{position:absolute;z-index:61;display:none;align-items:center;gap:6px;
  padding:7px 12px;border-radius:11px;cursor:pointer;
  font-size:12.5px;font-weight:700;letter-spacing:.2px;color:#fff;background:rgba(28,28,30,.92);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 8px 22px rgba(0,0,0,.22);
  animation:hintin .22s cubic-bezier(.2,1.4,.4,1)}
.hintchip.on{display:flex}
@keyframes hintin{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* ——— the bubble on a stroke already laid down ——— */
.bub{position:absolute;z-index:62;display:flex;align-items:center;gap:5px;padding:5px 6px;
  background:var(--mat);-webkit-backdrop-filter:saturate(180%) blur(28px);backdrop-filter:saturate(180%) blur(28px);
  border-radius:13px;box-shadow:0 0 0 .5px var(--hair),0 10px 28px rgba(0,0,0,.18);
  opacity:0;transform:scale(.92) translateY(3px);pointer-events:none;transform-origin:50% 0;
  transition:opacity .14s,transform .2s cubic-bezier(.2,1.4,.4,1)}
.bub.on{opacity:1;transform:none;pointer-events:auto}
.bub .mhair{width:.5px;height:20px;background:var(--hair);margin:0 2px}
.mtool{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:8px;
  color:#5b5b60;cursor:pointer;transition:background .16s,color .16s,transform .12s}
.mtool:hover{background:rgba(120,120,128,.16);color:#1c1c1e}
.mtool:active{transform:scale(.92)}
.mtool.own{color:var(--mine)}

.mtoast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(8px);opacity:0;z-index:70;
  background:rgba(28,28,30,.92);color:#fff;font-size:12.5px;padding:9px 16px;border-radius:12px;pointer-events:none;
  transition:opacity .2s,transform .3s cubic-bezier(.2,1.3,.4,1)}
.mtoast.on{opacity:1;transform:translateX(-50%)}
.mtoast b{margin-left:14px;padding-left:14px;border-left:.5px solid rgba(255,255,255,.25);
  color:#8fb8ff;cursor:pointer;pointer-events:auto;font-weight:700}
.mtoast b:hover{color:#fff}

/* шпаргалка: всё, что можно нажать, одним списком */
.keysback{position:fixed;inset:0;z-index:78;background:rgba(20,20,22,.28);
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.keysback[hidden],.keyspop[hidden]{display:none}
.keyspop{position:fixed;z-index:79;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(420px,calc(100vw - 32px));max-height:min(80vh,640px);overflow:auto;padding:18px 20px 16px;
  background:var(--mat);-webkit-backdrop-filter:saturate(180%) blur(30px);backdrop-filter:saturate(180%) blur(30px);
  border-radius:18px;box-shadow:0 0 0 .5px var(--hair),0 26px 60px rgba(0,0,0,.28)}
.keyspop h4{font-size:13px;font-weight:700;letter-spacing:.3px;color:#1c1c1e;margin-bottom:12px}
.keyspop .cap{font-size:9px;letter-spacing:1.2px;text-transform:uppercase;color:#8a8a8e;margin:15px 0 7px}
.krow{display:flex;align-items:flex-start;gap:11px;padding:5px 0}
.krow kbd{flex:none;min-width:46px;text-align:center;font-family:var(--sans);font-size:11.5px;font-weight:700;
  color:#3a3a3c;background:rgba(120,120,128,.14);border-radius:7px;padding:5px 7px;line-height:1.1}
.krow span{font-size:13px;line-height:1.4;color:#4a4a4e;padding-top:3px}
@media (prefers-color-scheme:dark){
  .keyspop{--mat:rgba(44,44,46,.9);--hair:rgba(255,255,255,.12)}
  .keyspop h4{color:#fff} .krow kbd{color:#e5e5ea;background:rgba(120,120,128,.3)} .krow span{color:#c7c7cc}
}
/* ——— a finger, not a mouse ———
   On a tablet the lesson is read at arm's length and marked with the thumb, so
   every target grows. Where the sheet leaves no gutter — a phone — the rail
   lies down along the bottom edge instead of standing beside the page. */
@media (pointer:coarse){
  .page{-webkit-touch-callout:none}
  .rail{left:10px;padding:9px 8px;gap:6px;border-radius:22px}
  .rail .two{grid-template-columns:repeat(2,38px);gap:5px}
  .rbtn{width:38px;height:38px;border-radius:11px}
  .hand{width:42px;height:42px}
  .inks{grid-template-columns:repeat(2,28px);gap:7px}
  .ink{width:28px;height:28px}
  .mtool{width:38px;height:38px;border-radius:11px}
  .area{width:min(260px,66vw);height:130px} .hue{width:min(260px,66vw);height:20px}
  .area .dot,.hue .dot{width:17px;height:17px}
  .mynote .del{display:flex;width:26px;height:26px}
}
/* a tablet: the sheet stays where it is — centred, not nudged aside — and the
   rail goes down to a single narrow column so it fits inside the sheet's own
   white margin without touching a letter */
@media (min-width:701px) and (max-width:1010px){
  .rail{left:9px;padding:7px 6px;gap:4px;border-radius:20px}
  /* one narrow column, and every row centred on its own width — a finger makes
     the buttons bigger than the inks, and a fixed grid column would push them
     off to one side */
  .rail .two,.rail .inks{display:flex;flex-direction:column;align-items:center;gap:4px}
  .rail .sep{width:20px}
  .days{right:9px}
}
/* only a phone has no margin at all: there the rail lies down at the foot */
@media (max-width:700px){
  .rail{left:50%;top:auto;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);
    flex-direction:row;align-items:center;gap:6px;padding:7px 9px;border-radius:17px;
    max-width:calc(100vw - 20px);overflow-x:auto;overflow-y:hidden}
  .rail .sep{width:.5px;height:24px;margin:0 2px}
  .rail .two,.inks{display:flex;gap:5px}
  .rpick{left:50%;right:auto;top:auto;bottom:calc(100% + 10px);transform:translateX(-50%)}
}

/* a phone has no room for one long row: the bar wraps instead of scrolling
   away, so every tool stays reachable with a thumb */
@media (max-width:700px){
  .rail{left:50%;top:auto;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);
    flex-direction:row;flex-wrap:wrap;justify-content:center;overflow:visible;row-gap:8px;column-gap:10px;
    width:calc(100vw - 16px);max-width:none;padding:9px 8px;border-radius:17px}
  .rail .sep{display:none}
  .rail .two{order:1;display:flex;gap:6px}        /* штрихи и инструменты — верхний ряд */
  .inks{order:2;flex-basis:100%;display:flex;justify-content:center;gap:7px}   /* цвета — нижний */
  .ink{width:26px;height:26px}
  .chip{order:3}
}

@media (prefers-color-scheme:dark){
  .rail,.rpick,.bub{--mat:rgba(44,44,46,.86);--hair:rgba(255,255,255,.12)}
  .rbtn{color:#c7c7cc} .rbtn:hover{background:rgba(120,120,128,.28);color:#fff}
  .rbtn.on{background:#f2f2f7;color:#1c1c1e}
  .hand{background:rgba(120,120,128,.28);color:#c7c7cc}
  .hand.on{box-shadow:0 0 0 2px rgba(255,255,255,.5),0 2px 6px rgba(0,0,0,.4)}
  .ink.on{box-shadow:inset 0 0 0 .5px rgba(0,0,0,.14),0 0 0 2px #fff}
  .chip{color:#8e8e93} .chip:hover{color:#fff;background:rgba(120,120,128,.28)}
  .mtool{color:#c7c7cc} .mtool:hover{background:rgba(120,120,128,.28);color:#fff}
  .mtool.own{color:#83a9ff}
}

@media print{
  @page{
    size:A4;                     /* the booklet's own sheet, whatever the printer defaults to */
    margin:15mm;                 /* the same air on all four sides */
    @top-left{ content:"" } @top-center{ content:"" } @top-right{ content:"" }
    @bottom-center{ content:"" }
    @bottom-left{ content:"themaestr-o.github.io/sbl/"; font-family:"PT Sans",sans-serif; font-size:8.5px; letter-spacing:.2px; color:#9a9a9a; }
    @bottom-right{ content:counter(page) "  /  " counter(pages); font-family:"PT Sans",sans-serif; font-size:8.5px; letter-spacing:.4px; color:#9a9a9a; }
  }
  .bar,footer{display:none} body{background:#fff}
  #sheets{padding-left:0}   /* the tablet gutter is a screen affair */
  /* whatever size the reader chose on screen, the sheet prints at 100%.
     No padding of its own: the top and bottom air comes from @page alone, so
     it matches the left and right margins exactly. */
  .page{box-shadow:none;margin:0;max-width:none;overflow:hidden;padding:0;zoom:1}
  .page + .page{break-before:page;page-break-before:always}   /* each lesson opens its own page */
  /* on screen the tag bleeds off the top of the sheet and the sheet clips it.
     Paper has no bleed: left as it is, the tag prints its full height into the
     top margin, 4 mm from the edge of the paper. Same bottom edge, same seat
     for the date — only the part that used to hang outside is gone. */
  .lesson{right:0;top:0;height:98px}
  /* a day never starts at the foot of a page: the band, the question that opens
     it and the text that answers that question are built as one block
     (`daystart`, see renderLesson) and travel over together. The old rules stay
     as a second line of defence, in both spellings — Safari and Firefox do not
     honour `break-after:avoid` everywhere the way Chrome does. */
  .daystart{break-inside:avoid;page-break-inside:avoid}
  .sec,.q,.vref{break-after:avoid;page-break-after:avoid}
  .sec,.q,.review,.mem{break-inside:avoid;page-break-inside:avoid}
  /* long passages flow on instead of leaving half a page empty … */
  .vgroup,.vitem,.note,.quote{break-inside:auto;page-break-inside:auto}
  /* … but a verse set on its own line is never cut in half, and running text
     never strands fewer than three lines either side of a break */
  .vtext.lines .v{break-inside:avoid;page-break-inside:avoid}
  .note,.quote,.mem{orphans:2;widows:2}
  .vtext{orphans:3;widows:3}
  /* the pencil work prints with the lesson; the tools themselves never do */
  .rail,.rpick,.bub,.days,.hintchip,.mtoast,.keysback,.keyspop,.mynote .del,.myins .del{display:none!important}
  .mynote,.myins{break-inside:avoid;page-break-inside:avoid}
  /* whoever picks up the sheet must see at a glance which lines are not
     the lesson's own */
  .legend.has{display:block;margin-top:30px;padding-top:9px;border-top:.5px solid #ddd;
    font-family:var(--sans);font-size:9.5px;letter-spacing:.3px;color:#8a8a8a}

<script>
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }

const LANGS=["de","en","ru"];
const LOCALE={de:"de-DE",en:"en-US",ru:"ru-RU"};
const MEMLABEL={de:"Merktext",en:"Memory verse",ru:"Памятный стих"};
let lang=localStorage.getItem("sbl.lang")||localStorage.getItem("sbl.left")||"en";
if(LANGS.indexOf(lang)===-1) lang="en";
let current=new Date();
const quarters={};
const BIBLE={de:"de-lut",en:"en-kjv",ru:"ru-rst"};
const bibles={};
let versesOn=localStorage.getItem("sbl.verses")==="1";
let versesLines=localStorage.getItem("sbl.verselines")==="1";   /* one verse per line */

/* band colour themes — first colour matches the quarterly cover (navy + light) */
const THEMES=[
  {dk:"#606162",lt:"#d1d3d4",bx:"#e6e6e6"},   /* grey (default) */
  {dk:"#24426e",lt:"#ccd5e2",bx:"#e7ecf4"},   /* navy — cover */
  {dk:"#6e2a3c",lt:"#e1ccd3",bx:"#f1e7ea"},   /* wine */
  {dk:"#2f5140",lt:"#cfdfd6",bx:"#e7f0ea"},   /* forest */
  {dk:"#8f7328",lt:"#e6dabb",bx:"#f2ecd8"}    /* gold */
];
function setTint(t){const R=document.documentElement.style;R.setProperty("--gray-dk",t.dk);R.setProperty("--gray",t.lt);R.setProperty("--box",t.bx);}
function hexHsl(h){h=h.replace("#","");const r=parseInt(h.slice(0,2),16)/255,g=parseInt(h.slice(2,4),16)/255,b=parseInt(h.slice(4,6),16)/255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let hh,s,l=(mx+mn)/2;if(mx===mn){hh=s=0;}else{const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);hh=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;hh/=6;}return[Math.round(hh*360),Math.round(s*100)];}
function customTint(hex){const a=hexHsl(hex),h=a[0],sd=Math.min(a[1],46),sl=Math.min(a[1],30);return{dk:"hsl("+h+","+sd+"%,38%)",lt:"hsl("+h+","+sl+"%,84%)",bx:"hsl("+h+","+Math.round(sl*0.7)+"%,90%)"};}
(function(){try{const s=JSON.parse(localStorage.getItem("sbl.tint")||"null");if(s){if(s.c)setTint(customTint(s.c));else if(s.i!=null&&THEMES[s.i])setTint(THEMES[s.i]);}}catch(e){}})();

function ymd(d){return d.getFullYear()+("0"+(d.getMonth()+1)).slice(-2)+("0"+d.getDate()).slice(-2);}
function qOf(d){return Math.floor(d.getMonth()/3)+1;}
function addDays(d,n){const x=new Date(d.getTime());x.setDate(x.getDate()+n);return x;}
function neigh(y,q){return[[y,q],q===1?[y-1,4]:[y,q-1],q===4?[y+1,1]:[y,q+1]];}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function strip(s){return String(s==null?"":s).replace(/<[^>]*>/g,"");}
function cleanMem(t){t=String(t||"").trim();var qi=t.search(/[„“"«]/);if(qi>0&&qi<=42){var ci=t.lastIndexOf(":",qi);if(ci>=0&&ci<qi)t=t.slice(ci+1).trim();}return t;}
function isJunk(s){return /out of date|install the (new|latest) version|Google Play|App ?store|version installed on your device/i.test(String(s||""));}
function ymdToDate(s){return new Date(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6,8));}
function fmt(dstr,opts){try{return new Intl.DateTimeFormat(LOCALE[lang],opts).format(ymdToDate(dstr));}catch(e){return dstr;}}

async function loadQuarter(l,y,q){
  const key=l+"-"+y+"-"+q; if(quarters[key]) return quarters[key];
  try{const r=await fetch("https://app.sdarm.org/sbl/data/"+l+"/"+l+"-"+y+"-"+q+".json");if(!r.ok)throw 0;return quarters[key]=await r.json();}
  catch(e){return quarters[key]=null;}
}
async function findLesson(d,l){
  const t=ymd(d);
  for(const[y,q]of neigh(d.getFullYear(),qOf(d))){
    const data=await loadQuarter(l,y,q); if(!data||!data.lessons) continue;
    for(const les of data.lessons){
      const days=les.dailyLessons||[];
      const start=days.length?days[0].date:les.date;
      if(t>=start && t<=les.date) return les;
    }
  }
  return null;
}

function loadBible(v){ if(bibles[v]) return bibles[v];
  return bibles[v]=fetch("https://app.sdarm.org/bible/data/"+v+".json").then(r=>r.json()).catch(function(){bibles[v]=null;return null;}); }
/* A reference with no verse number means the whole chapter: "Rev.16", or
   "Rev.2-Rev.3" for a span of them. Infinity is clamped to the chapter length
   where the verses are actually read. */
function parseSeg(s){const d=s.split("-");const a=d[0].split(".");const b=(d[1]||d[0]).split(".");
  return{book:a[0],chap:+a[1],v1:a[2]!=null?+a[2]:1,echap:+(b[1]||a[1]),v2:b[2]!=null?+b[2]:Infinity};}
function verseHtml(books,sOsis,perLine){let out="";
  for(const raw of String(sOsis).split(",")){
    const s=parseSeg(raw.trim());const ch=books&&books[s.book];if(!ch)continue;
    for(let c=s.chap;c<=s.echap;c++){const vs=ch[c-1];if(!vs)continue;
      const from=c===s.chap?s.v1:1,to=Math.min(c===s.echap?s.v2:vs.length,vs.length);
      for(let n=from;n<=to;n++) if(vs[n-1]!=null){
        const t=esc(strip(String(vs[n-1])).trim());
        out+= perLine ? '<span class="v"><span class="vn">'+n+'</span>'+t+'</span>'
                      : '<span class="vnum">'+n+'</span>'+t+" ";
      }
    }
  }
  return perLine?out:out.trim();
}
/* DE/RU carry the EGW source inside the quote itself ("…wecken.“ – Der Weg zu
   Christus, S. 4."). Find the book title and italicise it, so all three
   languages read the same as English — where the source arrives in `sop`.
   Runs on already-escaped text; the page reference is what proves it's a
   source and not just a dash in the sentence. */
function inlineSource(t){
  /* a dash usually opens the source; thirteen Russian commentaries use // */
  const m=t.match(/^([\s\S]*[»”“"'’″]\s*)([,.]?\s*(?:[–—-]|\/\/)\s*)([\s\S]+)$/);
  if(!m) return t;
  let p=m[3].search(/\s*[,.]?\s*[–—-]?\s*(?:S\.|p\.|pp\.|С\.|с\.|стр\.)\s*\d/);
  /* a periodical is cited by date rather than by page: "…school, 1 December 1912." */
  if(p<=0&&/[0-9]{4}[^0-9]{0,14}$/.test(m[3])) p=m[3].lastIndexOf(",");
  if(p<=0) return t;
  /* the whole source is set as one: the title and the page it stands on read
     as a single line of credit, not as two kinds of type */
  return m[1]+m[2]+'<i>'+m[3]+'</i>';
}
/* Source of an EGW quote. English data keeps it apart in `sop`; DE/RU already
   have it inside the text, so this simply returns nothing there. */
function sopHtml(sop,text){
  if(!sop||!sop.label) return "";
  const s=String(sop.label);
  const m=s.match(/<span[^>]*sop-book[^>]*>([\s\S]*?)<\/span>([\s\S]*)$/i);
  const dash=/[—–-]\s*$/.test(String(text||"").trim())?"":"—";
  /* title and page together, in one italic — see inlineSource() */
  return dash+'<i>'+(m?esc(strip(m[1]).trim())+esc(strip(m[2])):esc(strip(s)))+'</i>';
}
/* "a. How did Paul…" → ["a.", "How did Paul…"] so the marker can hold its own
   column. Latin and Cyrillic letters, and numbers for the review questions. */
function splitMarker(t){
  /* the space after the marker is optional — Russian data sometimes has none
     ("а.От чего…"), and putting the marker in its own column repairs that too */
  const m=String(t||"").match(/^\s*([0-9]{1,2}|[A-Za-zА-яЁё])\s*[.)]\s*([\s\S]+)$/);
  return m?[m[1]+".",m[2]]:null;
}
function markedHtml(cls,t,k){
  const s=splitMarker(t), a=' class="'+cls+'"'+(k?' data-k="'+k+'"':'');
  return s?'<div'+a+'><span class="qm">'+esc(s[0])+'</span>'+esc(s[1])+'</div>'
          :'<div'+a+'>'+esc(t)+'</div>';
}
/* Russian Q3 leaves the booklet's own page number at the end of some
   commentaries — "…– С.510. 37", "…к людям 9". Drop a trailing one-to-three
   digit number, unless it continues a page range ("S. 442. 443"). */
function dropPageNo(t){
  const s=String(t||"");
  /* the number either stands off on a space, or sits glued to the punctuation
     that closes the sentence — "…для нас.14" is a page number just the same */
  const m=s.match(/^([\s\S]*?[.!?…»”"'’)])\s*(\d{1,3})\s*$/)||s.match(/^([\s\S]*?)\s+(\d{1,3})\s*$/);
  if(!m) return s;
  const prev=m[1].match(/(\d{1,4})\s*[.,]?\s*$/);
  if(prev&&+m[2]===+prev[1]+1) return s;
  return m[1];
}
function questionLine(sub){
  /* a few Russian entries hold nothing but a page number */
  const parts=(sub.q||[]).map(x=>(x.text||"").trim()).filter(function(t){return t&&!isJunk(t)&&!/^\d{1,3}[.;:]?$/.test(t);});
  for(const q of (sub.question||[])) if(q&&q.text&&!isJunk(q.text)) parts.push(q.text.trim());
  return parts.join(" ");
}

let vid=0;   /* runs across a whole quarter, so verse ids stay unique */
/* Every block of running text carries a key that does not depend on how the
   page happens to be rendered — not on the order of the elements, not on
   whether the Bible text is switched on. A highlight is stored against that
   key, so it comes back after a reload, after the type is enlarged, after the
   verses are turned on. See `mkRestore()`. */
function renderLesson(les,tasks){
  let h='<div class="lesson">'+esc(strip(les.header||""))+'</div>'+
        '<div class="top"><div class="date" data-k="dt">'+esc(strip(WORDsab()+", "+fmt(les.date,{month:"long",day:"numeric",year:"numeric"})))+'</div></div>';
  h+='<h1 class="title" data-k="ti">'+esc(les.title||"")+'</h1>';

  const kt=les.keyText||{}, kText=cleanMem(strip(kt.text||les.keyTextVerse||"")), kRef=strip((kt.ref&&kt.ref.text)||"");
  if(kText) h+='<div class="mem" data-k="mem"><b>'+esc(MEMLABEL[lang])+':</b> '+esc(kText)+(kRef?' ('+esc(kRef)+').':'')+'</div>';

  const rd=les.reading;
  if(rd&&rd.reading&&rd.reading.length)
    h+='<div class="read" data-k="rd"><b>'+esc(strip(rd.label||""))+'</b> <i>'+rd.reading.map(x=>esc(strip(x.label||""))).join("; ")+'</i></div>';

  if(les.keyNote&&les.keyNote.text) h+='<div class="quote" data-k="qt">'+inlineSource(esc(strip(les.keyNote.text)))+sopHtml(les.keyNote.sop,les.keyNote.text)+'</div>';

  for(let di=0;di<(les.dailyLessons||[]).length;di++){
    const day=les.dailyLessons[di];
    const tag=fmt(day.date,{weekday:"short",month:"short",day:"numeric"});
    const st=strip(day.sectionTitle||"").trim();
    const mm=st.match(/^(\d+[.)]?)\s+(.*)$/);
    const secInner=mm?'<span class="n">'+esc(mm[1])+'</span><span class="ttl">'+esc(mm[2])+'</span>':'<span class="ttl">'+esc(st)+'</span>';
    const band='<div class="sec" data-d="'+esc(day.date)+'"><div class="t" data-k="d'+di+'">'+secInner+'</div><div class="day">'+esc(tag)+'</div></div>';
    /* the day is built as a list of blocks first, so that its opening can be
       held together below */
    const subs=day.subsections||[], blocks=[];
    for(let si=0;si<subs.length;si++){
      const sub=subs[si], kk="d"+di+"s"+si;
      const q=questionLine(sub);
      if(q) blocks.push(markedHtml("q",q,kk+"q"));
      if(versesOn){
        const refs=(sub.q||[]).filter(it=>it&&it.sOsis);
        if(refs.length){ let g='<div class="vgroup">';
          for(let vi=0;vi<refs.length;vi++){ const it=refs[vi],id="pv"+(vid++); tasks.push([id,it.sOsis]);
            const ref=strip(it.text||"").replace(/[;,.\s]+$/,"");
            g+='<div class="vitem">'+(ref?'<div class="vref">'+esc(ref)+'</div>':'')
              +'<div class="vtext'+(versesLines?' lines':'')+'" id="'+id+'" data-k="'+kk+'v'+vi+'"></div></div>'; }
          blocks.push(g+'</div>'); }
      }
      let ni=0;
      for(const n of sub.note||[]) if(n&&n.text&&!isJunk(n.text))
        blocks.push('<div class="note" data-k="'+kk+'n'+(ni++)+'">'+inlineSource(esc(dropPageNo(strip(n.text))))+sopHtml(n.sop,n.text)+'</div>');
    }
    /* the heading of the day, the question it opens with and the beginning of
       the text that answers it are one block: a day heading left at the foot of
       a page with its Bible text overleaf is what the printed booklet never
       does. `relaxDayStarts()` lets the last piece out again if holding it
       would cost more than a page break is worth. */
    h+='<div class="daystart">'+band+blocks.slice(0,2).join("")+'</div>'+blocks.slice(2).join("");
    let ri=0;
    for(const rq of day.reviewQuestions||[]) if(rq) h+=markedHtml("review",dropPageNo(strip(rq)),"d"+di+"r"+(ri++));
  }
  return h+'<div class="legend"></div>';
}
function WORDsab(){return {de:"Sabbat",en:"Sabbath",ru:"Суббота"}[lang];}

let token=0;
let scope="week";                        /* "week" | "quarter" */
/* the sheet carries which lesson it holds: pencil marks are stored per lesson
   and per language, and a quarter puts thirteen sheets on the page at once */
function sheet(inner,id){
  return '<div class="page"'+(id?' data-les="'+id+'" data-lang="'+lang+'"':'')+'>'+inner+'</div>'; }
/* what the browser will call the saved file — set as the page is built */
let docName="SBL Edition";
function fileSafe(s){ return String(s||"").replace(/[\\/:*?"<>|]+/g," ").replace(/\s+/g," ").trim(); }

/* An A4 page holds about 1010 px of text. Keeping the opening of a day
   together is worth a page break; keeping half a page of commentary together
   is not — past that the last piece is let out of the block again. */
const KEEPMAX=420;
function relaxDayStarts(){
  document.querySelectorAll(".daystart").forEach(function(d){
    while(d.children.length>2 && d.offsetHeight>KEEPMAX)

async function render(){
  const my=++token;
  /* the whole sheet is set justified with hyphens:auto, and the browser picks
     its hyphenation dictionary by the language of the document: without this
     line German breaks by English rules and Russian never breaks at all, which
     tears rivers of white through every justified paragraph in the PDF */
  document.documentElement.lang=lang;
  buildSeg();
  const sheets=document.getElementById("sheets"), wk=document.getElementById("wk");
  sheets.innerHTML=sheet('<div class="msg">&hellip;</div>');
  const tasks=[]; vid=0;

  if(scope==="quarter"){
    const data=await loadQuarter(lang,current.getFullYear(),qOf(current));
    if(my!==token) return;
    const lessons=(data&&data.lessons)||[];
    if(!lessons.length){ sheets.innerHTML=sheet('<div class="msg">No lessons for this quarter.</div>'); wk.innerHTML=""; return; }
    wk.innerHTML='<b>'+esc(strip(data.title||""))+'</b>';
    docName=fileSafe("SBL "+current.getFullYear()+"-Q"+qOf(current)+" "+strip(data.title||""));
    sheets.innerHTML=lessons.map(function(les){ return sheet(renderLesson(les,tasks),les.date); }).join("");
  } else {
    const les=await findLesson(current,lang);
    if(my!==token) return;
    if(!les){ sheets.innerHTML=sheet('<div class="msg">No lesson for this week.</div>'); wk.innerHTML=""; return; }
    /* the lesson number alone — the date is on the sheet and in the calendar */
    wk.innerHTML='<b>'+esc(strip(les.header||""))+'</b>';
    docName=fileSafe("SBL "+String(les.date).replace(/^(\d{4})(\d{2})(\d{2})$/,"$1-$2-$3")
      +" "+strip(les.header||"")+" "+strip(les.title||""));
    sheets.innerHTML=sheet(renderLesson(les,tasks),les.date);
  }

  relaxDayStarts();
  mkRestore();
  mkDaysBuild(); mkOpenToday();

  if(versesOn && tasks.length){
    const bib=await loadBible(BIBLE[lang]);
    if(my!==token) return;
    for(const t of tasks){ const el=document.getElementById(t[0]); if(!el) continue;
      const vh=verseHtml(bib&&bib.books,t[1],versesLines); el.innerHTML=vh||'<span class="vmiss">—</span>'; }
    relaxDayStarts();   /* the passage has arrived — the block may have outgrown its keep */
    mkRestore();        /* … and the marks that live inside the passage can go back on */
  }
}

const ZOOMS=[1,1.15,1.3];

function paintZoom(){
  if(zi>maxStep()) zi=maxStep();
  document.documentElement.style.setProperty("--z",ZOOMS[zi]);
  zout.classList.toggle("off",zi===0);
  zin.classList.toggle("off",zi>=maxStep());

  zin.title="Larger text — now "+pct;

/* a 320px screen has no room for the booklet's tag and date side by side at
   the largest step, so the top step is only offered where it fits */
function maxStep(){ return window.innerWidth<400?1:ZOOMS.length-1; }
function setZoom(d){
  const n=Math.min(maxStep(),Math.max(0,zi+d));
  if(n===zi) return;
  zi=n; localStorage.setItem("sbl.zoom",String(zi)); paintZoom();
}

/* the month, with every week carrying the lesson that ends on its Sabbath */
const calpop=document.getElementById("calpop");
let calMonth=null;
async function buildCal(){
  const y=calMonth.getFullYear(), m=calMonth.getMonth();
  const byDate={};
  for(const [yy,qq] of neigh(y,Math.floor(m/3)+1)){
    const d=await loadQuarter(lang,yy,qq);
    if(d&&d.lessons) for(const l of d.lessons) byDate[l.date]=l;
  }
  const first=new Date(y,m,1);
  const cur=new Date(first.getTime()); cur.setDate(1-first.getDay());     /* back to Sunday */
  const today=new Date(), tKey=ymd(today), cKey=ymd(current);
  const dayNames=[];
  for(let i=0;i<7;i++){ const d=new Date(2026,1,1+i);
    dayNames.push(esc(new Intl.DateTimeFormat(LOCALE[lang],{weekday:"short"}).format(d)).slice(0,2)); }

  let h='<div class="calhead"><span class="calnav" data-m="-1">&lsaquo;</span><b>'
      + esc(new Intl.DateTimeFormat(LOCALE[lang],{month:"long",year:"numeric"}).format(first))
      + '</b><span class="calnav" data-m="1">&rsaquo;</span></div>'
      + '<div class="calrow head"><div class="days">'+dayNames.map(n=>'<div class="d">'+n+'</div>').join("")+'</div><div class="les"></div></div>';

  for(let w=0;w<6;w++){
    const sat=new Date(cur.getTime()); sat.setDate(cur.getDate()+6);
    if(w>0&&cur.getMonth()!==m&&sat.getMonth()!==m) break;
    const les=byDate[ymd(sat)];
    let days="",inWeek=false;
    for(let i=0;i<7;i++){
      const d=new Date(cur.getTime()); d.setDate(cur.getDate()+i);
      const k=ymd(d);
      if(k===cKey) inWeek=true;
      days+='<div class="d'+(d.getMonth()!==m?" out":"")+(k===tKey?" today":"")+'" data-d="'+k+'">'+d.getDate()+'</div>';
    }
    h+='<div class="calrow'+(les?" pick":"")+(inWeek&&les?" on":"")+'"'+(les?' data-d="'+les.date+'"':'')+'>'
      +'<div class="days">'+days+'</div><div class="les">'
      +(les?'<b>'+esc(strip(les.header||""))+'</b><span>'+esc(strip(les.title||""))+'</span>':'')
      +'</div></div>';
    cur.setDate(cur.getDate()+7);
  }
  h+='<div class="calfoot"><div class="it" data-today="1">'+esc(WORDtoday())+'</div></div>';
  calpop.innerHTML=h;

  calpop.querySelectorAll(".calnav").forEach(function(n){ n.onclick=function(e){
    e.stopPropagation(); calMonth.setMonth(calMonth.getMonth()+ +n.dataset.m,1); buildCal(); }; });
  calpop.querySelectorAll("[data-d]").forEach(function(el){ el.onclick=function(e){
    e.stopPropagation(); calpop.hidden=true;
    current=ymdToDate(el.dataset.d); render(); }; });
  calpop.querySelector("[data-today]").onclick=function(){ calpop.hidden=true; current=new Date(); render(); };
}

  else if(s==="line") svg="%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 12' preserveAspectRatio='none'%3E%3Cpath d='M2 7.5c26-3.2 62-4.4 99-3.9 34 .5 71 2.4 97 4.8' stroke='"+col+"' stroke-width='2.6' fill='none' stroke-linecap='round'/%3E%3Cpath d='M6 10.2c30-2.4 66-3.1 101-2.7' stroke='"+col+"' stroke-width='1.3' fill='none' opacity='.45' stroke-linecap='round'/%3E%3C/svg%3E";

/* ——— the ink itself ——— */
function mkOwn(n){ return !!(n.parentNode&&n.parentNode.closest&&n.parentNode.closest(".myins,.mynote")); }
function mkWalk(b){ return document.createTreeWalker(b,NodeFilter.SHOW_TEXT,{
  acceptNode:function(n){ return mkOwn(n)?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT; }}); }
/* A stroke is never left cutting a word in half: whatever the hand caught,
   the range grows out to whole words first. It is what makes a highlight look
   deliberate instead of brushed. */
const MK_EDGE=/[\s.,;:!?()\[\]«»"'“”„…—–-]/;
function mkSnapWords(r){
  let n=r.startContainer,o=r.startOffset;

    while(o>0&&!MK_EDGE.test(t[o-1])) o--;

  n=r.endContainer; o=r.endOffset;
  if(n.nodeType===3){ const t=n.nodeValue;
    while(o<t.length&&!MK_EDGE.test(t[o])) o++;
    r.setEnd(n,o); }
  return r;
}
let mkGid=0;
/* One stroke wants to be one element. If the range swallows whole tags — the
   bold label of a memory verse, an italic book title — the browser can wrap it
   in a single <mark>, and a single background has no seams to show: no white
   hairline, no darker notch where two pieces met. Only a range that cuts a tag
   in half falls back to piece-by-piece. */
function mkWhole(range,c,s,g){
  let frag;
  try{ frag=range.cloneContents(); }catch(e){ return false; }
  if(frag.querySelector){
    if(frag.querySelector(".myins,.mynote")) return false;          /* never tint the reader's own words */
    if(frag.querySelector('mark[data-c="'+c+'"][data-y="'+s+'"]')) return false;  /* same ink already there */
  }
  const m=document.createElement("mark");
  m.className=s+" ps pe"; m.dataset.c=c; m.dataset.y=s; m.dataset.g=g;
  mkInkTo(m,c,s,true,true);
  try{ range.surroundContents(m); }catch(e){ return false; }
  return true;

function mkPaint(range,c,s){

    const host=(range.commonAncestorContainer.nodeType===1?range.commonAncestorContainer
      :range.commonAncestorContainer.parentElement);
    const pg=host&&host.closest?(host.closest(".page")||host):host;
    if(pg) mkMerge(pg,String(g));
    mkStore();
    return g;
  }
  const sc=range.startContainer,so=range.startOffset,ec=range.endContainer,eo=range.endOffset;
  const root=range.commonAncestorContainer;
  /* a second pass in a different colour darkens, as real ink does — but the
     same colour laid twice over the same words only makes a dirty patch, so
     that piece is left alone */
  const already=function(n){ let p=n.parentNode;
    while(p&&!(p.dataset&&p.dataset.k)){
      if(p.tagName==="MARK"&&p.dataset.c===c&&p.dataset.y===s) return true;
      p=p.parentNode; }
    return false; };

    acceptNode:function(n){
      if(!n.nodeValue.replace(/\s/g,"")) return NodeFilter.FILTER_REJECT;
      if(mkOwn(n)||already(n)) return NodeFilter.FILTER_REJECT;
      return range.intersectsNode(n)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT; }});

    const ps=i===0,pe=i===nodes.length-1;
    const m=document.createElement("mark");
    m.className=s+(ps?" ps":"")+(pe?" pe":"");
    m.dataset.c=c; m.dataset.y=s; m.dataset.g=g;
    mkInkTo(m,c,s,ps,pe);
    try{ r.surroundContents(m); }catch(err){}
  });

  const host=blk&&blk.closest?(blk.closest(".page")||blk):blk;

/* Two strokes of the same colour standing side by side are one stroke: they
   are joined into a single element. Otherwise their edges meet exactly on the
   character boundary and a white hairline shows through between them. */
function mkMerge(scope,g){
  let again=true;

/* the pieces of one stroke keep a common number, so a stroke torn apart by a

function mkPieces(g){ return [].slice.call(document.querySelectorAll('mark[data-g="'+g+'"]')); }
function mkUnwrap(el){ const p=el.parentNode; while(el.firstChild) p.insertBefore(el.firstChild,el); p.removeChild(el); p.normalize(); }

/* ——— anchors: block key + offset in characters, own text not counted ——— */
function mkOffsets(b,s,e){
  const w=mkWalk(b); let n,acc=0,open=false; const r=document.createRange();

function mkKey(pg){ return (pg.dataset.lang||lang)+"/"+pg.dataset.les; }

  if(mkQuiet) return;

    const out={marks:[],ins:[],notes:[]};

      const k=b.dataset.k;
      const w=mkWalk(b); let n,acc=0,cur=null;

function mkLegend(){
  document.querySelectorAll(".page[data-les]").forEach(function(pg){

    const has=pg.querySelector(".myins,.mynote");
    l.innerHTML=has?'<span class="sw"></span>'+esc(T("legend")):"";

/* the page is rebuilt on every render, so restoring means: wipe whatever is on
   it and lay the stored marks down again from the anchors */
function mkRestore(){
  mkQuiet=true;
  document.querySelectorAll(".page[data-les]").forEach(function(pg){
    pg.querySelectorAll("mark").forEach(mkUnwrap);
    pg.querySelectorAll(".myins,.mynote").forEach(function(e){ e.remove(); });
    const d=MKALL[mkKey(pg)]; if(!d) return;
    (d.marks||[]).forEach(function(o){
      const b=pg.querySelector('[data-k="'+o.k+'"]'); if(!b) return;
      (o.ch||[]).forEach(function(step){
        const r=mkOffsets(b,o.s,o.e); if(r) mkPaint(r,step.c,step.y);
      });
    });
    (d.ins||[]).forEach(function(o){
      const b=pg.querySelector('[data-k="'+o.k+'"]'); if(!b) return;

      r.collapse(true); mkInsert(r,o.t,true);

      const b=pg.querySelector('[data-k="'+o.k+'"]'); if(!b) return;

    });
  });

/* ——— the reader's own words ——— */
function mkStamp(){ try{ return new Date().toLocaleDateString(LOCALE[lang],{day:"numeric",month:"long"}); }catch(e){ return ""; } }
/* the reader's own words, written into the line itself. They carry their own
   little cross: an insertion in the middle of a paragraph must be as easy to
   take back as it was to put in. */
function mkInsText(el){ const c=el.cloneNode(true),d=c.querySelector(".del"); if(d) d.remove(); return c.textContent; }
function mkInsert(range,text,quiet){
  const s=document.createElement("span");
  s.className="myins"; s.contentEditable="true"; s.spellcheck=false;
  const t=document.createTextNode(text||"");
  const x=document.createElement("span");
  x.className="del"; x.contentEditable="false"; x.textContent="×"; x.title=T("erase");
  x.onmousedown=function(e){ e.preventDefault(); };
  x.onclick=function(e){ e.stopPropagation(); s.remove(); mkStore(); };
  s.appendChild(t); s.appendChild(x);
  range.insertNode(s);
  s.addEventListener("blur",function(){ if(!mkInsText(s).trim()) s.remove(); mkStore(); });
  if(!quiet){
    const r=document.createRange(); r.setStart(t,t.nodeValue.length); r.collapse(true);
    const sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(r); s.focus(); mkStore();
  }

let mkNoteFocused=null;
function mkNoteBody(d){ const c=d.cloneNode(true);
  c.querySelectorAll(".del,.lab").forEach(function(x){ x.remove(); }); return c; }
function mkNoteText(d){ return mkNoteBody(d).textContent.trim(); }
function mkNoteTint(d,c){
  const p=mkRgb(c||"#2f5bd0");

  d.style.setProperty("--nc",c||"#2f5bd0");
  d.style.setProperty("--nbg","rgba("+p[0]+","+p[1]+","+p[2]+",.06)");
